<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
  <title id="title">Soho telephone box at night</title>
  <desc id="desc">A scarlet telephone box stands under a street lamp, reflected faintly on the pavement.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#d96b4c" stop-opacity=".18"/><stop offset=".38" stop-color="#b2473d" stop-opacity=".07"/><stop offset="1" stop-color="#b2473d" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop stop-color="#f4c48c" stop-opacity=".25"/><stop offset=".2" stop-color="#e5a66a" stop-opacity=".08"/><stop offset="1" stop-color="#e5a66a" stop-opacity="0"/></radialGradient>
    <linearGradient id="iron" x2="1" y2=".1"><stop stop-color="#3d171b"/><stop offset=".18" stop-color="#a33b38"/><stop offset=".38" stop-color="#842a30"/><stop offset=".75" stop-color="#5d2027"/><stop offset="1" stop-color="#30171d"/></linearGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#211f29"/><stop offset=".48" stop-color="#4a3d43"/><stop offset="1" stop-color="#201f28"/></linearGradient>
    <linearGradient id="reflection" x2=".15" y2="1"><stop stop-color="#97383a" stop-opacity=".26"/><stop offset="1" stop-color="#8a3d43" stop-opacity="0"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#be9a7d" stop-opacity=".28"/><stop offset="1" stop-color="#be9a7d" stop-opacity="0"/></linearGradient>
    <clipPath id="panes"><path d="M126 57h91v139h-91z"/></clipPath>
  </defs>

  <ellipse cx="170" cy="130" rx="160" ry="128" fill="url(#halo)"/>
  <ellipse cx="456" cy="62" rx="166" ry="102" fill="url(#lamp)"/>
  <path d="M12 211Q158 206 280 211T608 208" fill="none" stroke="#a08070" stroke-opacity=".27" stroke-width="1.3"/>
  <path d="M32 219Q205 213 296 220M301 224q102-7 266-1" fill="none" stroke="#d1ad90" stroke-opacity=".1"/>
  <path d="M162 211c-17 8-26 22-27 38h76c-4-16-15-28-31-38" fill="url(#reflection)"/>
  <path d="M231 213q64 2 137 0l-24 34h-85z" fill="url(#floor)" opacity=".28"/>
  <path d="M93 215q59-8 132 0" fill="none" stroke="#d3a17c" stroke-opacity=".22" stroke-width="2"/>

  <!-- Cast-iron crown, raised frame and imperfect enamel. -->
  <path d="M120 41q0-15 17-19h70q17 4 17 19v7H120z" fill="#69232b" stroke="#c16a55" stroke-opacity=".56" stroke-width="1.3"/>
  <path d="M125 42q0-12 13-15h68q13 3 13 15" fill="none" stroke="#e3a284" stroke-opacity=".35" stroke-width="1.3"/>
  <path d="M117 43h111v11H117z" fill="#491d25" stroke="#bd6a57" stroke-opacity=".53"/>
  <path d="M122 54h100v149H122z" fill="url(#iron)" stroke="#b96757" stroke-opacity=".78" stroke-width="1.5"/>
  <path d="M127 57h90v138h-90z" fill="#191c23" stroke="#c37463" stroke-opacity=".64"/>
  <path d="M133 61h78v132h-78z" fill="url(#glass)"/>
  <path d="M146 61h11l-21 132h-5zm46 0h5l-19 132h-8z" fill="#f0c8a1" opacity=".06" clip-path="url(#panes)"/>
  <path d="M133 91h78M133 123h78M133 155h78" stroke="#8d3838" stroke-width="5"/>
  <path d="M133 93h78M133 125h78M133 157h78" stroke="#d7886a" stroke-opacity=".28" stroke-width=".8"/>
  <path d="M157 61v132m29-132v132" stroke="#842d33" stroke-width="5"/>
  <path d="M159 61v132m29-132v132" stroke="#d18570" stroke-opacity=".23" stroke-width=".8"/>
  <path d="M121 55h9v148h-9zm95 0h9v148h-9z" fill="#552025"/>
  <path d="M123 55h2v148h-2zm95 0h2v148h-2z" fill="#dc8069" opacity=".34"/>
  <path d="M117 202h112v9H117z" fill="#3b1b22" stroke="#a65249" stroke-opacity=".6"/>
  <path d="M133 200h79" stroke="#d59174" stroke-opacity=".3"/>

  <!-- One lit panel gives the silhouette depth without turning it into a poster. -->
  <path d="M161 125h25v29h-25z" fill="#ba846b" opacity=".17"/>
  <path d="M169 128h12v17h-12z" fill="#15191d" stroke="#d7ac8b" stroke-opacity=".28"/>
  <path d="M168 130q6-5 13 0l-2 3q-5-2-9 0z" fill="#151619" stroke="#cda889" stroke-opacity=".48"/>
  <path d="M170 145q4 8 9 1" fill="none" stroke="#ccac8f" stroke-opacity=".38" stroke-width="1.2"/>
  <circle cx="204" cy="176" r="1.8" fill="#edbb8f" opacity=".55"/>
  <path d="M127 47h90v15h-90z" fill="#ead7af" stroke="#5b292a" stroke-width="2"/>
  <path d="M130 50h84v9h-84z" fill="#d6c59f"/>
  <text x="172" y="57.5" fill="#493b36" font-family="Georgia,serif" font-size="8.5" letter-spacing="2.8" text-anchor="middle">TELEPHONE</text>
  <path d="M135 34q10-5 20 0t18 0t18 0t20 0" fill="none" stroke="#edb49b" stroke-opacity=".23" stroke-width="1"/>
  <path d="M127 82l3-1m90 23l-3 2m-87 63l-2 3m89 12l2-2" stroke="#f3c7a5" stroke-opacity=".32" stroke-width="1.3"/>

  <!-- Street perspective and the answering light, kept behind the reading space. -->
  <path d="M275 208q81-19 157-13t177-10" fill="none" stroke="#a68d80" stroke-opacity=".18"/>
  <path d="M315 70h3v134h-3z" fill="#716f70" opacity=".2"/>
  <path d="M303 70h27l-5-6h-17z" fill="#c4ad94" opacity=".3"/>
  <path d="M312 64h8l-2-5h-4z" fill="#cbb69b" opacity=".24"/>
  <path d="M430 34h1v157h-1zm104 22h1v129h-1z" stroke="#a5948e" opacity=".14"/>
  <circle cx="430" cy="49" r="2" fill="#edd1ab" opacity=".37"/>
  <circle cx="534" cy="67" r="1.6" fill="#edd1ab" opacity=".24"/>
  <path d="M309 213l-7 36m13-35l5 35m116-52l-5 52" stroke="#e6b18b" stroke-opacity=".11"/>
</svg>
