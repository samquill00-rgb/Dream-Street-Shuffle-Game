<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The walk to Waterloo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #e9dfc8; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view.drag { cursor: grabbing; }
  #veil { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 2.2s ease; }
  #veil.clear { opacity: 0; }
  #walk { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 13px 34px; font: inherit; font-size: 17px; letter-spacing: .08em;
          color: #e9dfc8; background: rgba(18, 16, 14, .55); border: 1px solid rgba(233, 223, 200, .45); border-radius: 3px; cursor: pointer; touch-action: none; }
  #walk.on { background: rgba(233, 223, 200, .2); }
  #hint { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 14px; color: rgba(233, 223, 200, .75); white-space: nowrap;
          text-shadow: 0 1px 3px #000; transition: opacity 1.5s ease; pointer-events: none; }
  #hint.gone { opacity: 0; }
  #end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; font-size: 17px; line-height: 1.6; padding: 0 24px; }
  #end.show { display: flex; }
  #ask { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); display: none; padding: 16px 22px 18px; text-align: center; max-width: calc(100vw - 48px); box-sizing: border-box;
         background: rgba(18, 16, 14, .62); border: 1px solid rgba(233, 223, 200, .4); border-radius: 4px; }
  #ask.show { display: block; }
  #ask p { margin: 0 0 14px; font-size: 19px; }
  #ask p.claude-draft { color: #ff8fc7; }
  #ask button { margin: 0 6px; padding: 10px 22px; font: inherit; font-size: 16px; color: #e9dfc8; background: rgba(18, 16, 14, .5); border: 1px solid rgba(233, 223, 200, .45); border-radius: 3px; cursor: pointer; }
  #ask button:hover { background: rgba(233, 223, 200, .2); }
  #osm { position: fixed; right: 8px; bottom: 6px; font: 10px/1 Helvetica, Arial, sans-serif; color: rgba(233, 223, 200, .4); pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"></div>
<div id="hint">Hold W to walk: Shift to stride, S to stroll. A and D move you across. Drag to look around.</div>
<button id="walk" type="button">Walk</button>
<div id="ask"><p></p><span></span></div>
<div id="end"><div>The train has gone.</div></div>
<div id="osm">Map data &copy; OpenStreetMap contributors</div>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/shaders/CopyShader.js"></script>
<script src="vendor/three/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/three/postprocessing/EffectComposer.js"></script>
<script src="vendor/three/postprocessing/RenderPass.js"></script>
<script src="vendor/three/postprocessing/ShaderPass.js"></script>
<script src="vendor/three/postprocessing/UnrealBloomPass.js"></script>
<script src="waterloo-walk-data.js"></script>
<script src="waterloo-walk-alley.js"></script>
<script src="waterloo-walk-chx.js"></script>
<script src="waterloo-walk-waterloo.js"></script>
<script>
(function () {
  'use strict';
  var D = window.WW_DATA, Q = new URLSearchParams(location.search);
  var canvas = document.getElementById('view');

  /* ---------- small helpers ---------- */
  var seed = 20261126;
  function rnd() { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function cv(w, h, draw) { var c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
  function tex(c, rep) { var t = new THREE.CanvasTexture(c); if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.anisotropy = 8; return t; }
  function pairs(a) { var o = []; for (var i = 0; i < a.length; i += 2) o.push([a[i], a[i + 1]]); return o; }

  /* ---------- renderer ---------- */
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85; /* the alley's grade; the bridge's painted materials opt out below */
  var scene = null; /* the scene being built: each stage makes its own */
  var camera = new THREE.PerspectiveCamera(62, 1, 0.25, 9000);
  var rt = new THREE.WebGLRenderTarget(4, 4, { stencilBuffer: true }); /* 24-bit depth: the default target is 16 */
  var composer = new THREE.EffectComposer(renderer, rt);
  var renderPass = new THREE.RenderPass(new THREE.Scene(), camera); composer.addPass(renderPass);
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(4, 4), 0.5, 0.5, 0.8);
  composer.addPass(bloom);

  /* ---------- shared textures ---------- */
  var glowTex = tex(cv(128, 128, function (g) {
    var r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.18, 'rgba(255,255,255,.55)'); r.addColorStop(0.5, 'rgba(255,255,255,.12)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  }));
  function glow(x, y, z, size, color, parent, op) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: op == null ? 1 : op, fog: false }));
    s.position.set(x, y, z); s.scale.set(size, size, 1); (parent || scene).add(s); return s;
  }

  /* ================= STAGE: the Golden Jubilee Bridge ================= */
  function buildBridge() {
  scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x1d1915, 0.00042);

  /* ---------- sky ---------- */
  (function () {
    var c = cv(1024, 512, function (g, w, h) {
      var gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, '#1d1a18'); gr.addColorStop(0.36, '#342d28'); gr.addColorStop(0.5, '#4d4238'); gr.addColorStop(0.56, '#5a4a3c'); gr.addColorStop(1, '#5a4a3c');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
      for (var i = 0; i < 260; i++) { /* cloud underbellies lit by the town */
        var x = rnd() * w, y = h * (0.05 + rnd() * 0.42), r = 30 + rnd() * 90, lit = rnd() < 0.55;
        var rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, lit ? 'rgba(120,106,92,.16)' : 'rgba(8,7,7,.2)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = rg; g.save(); g.translate(x, y); g.scale(2.4, 1); g.translate(-x, -y); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
      }
    });
    /* canvas gradients are dithered, and 260 of them stacked show the dither as a grid: soften it away */
    var small = cv(256, 128, function (g) { g.drawImage(c, 0, 0, 256, 128); });
    c = cv(1024, 512, function (g) { g.imageSmoothingQuality = 'high'; g.drawImage(small, 0, 0, 1024, 512); });
    var m = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.MeshBasicMaterial({ map: tex(c), side: THREE.BackSide, fog: false, depthWrite: false }));
    scene.add(m);
  })();

  /* ---------- the town from the map: ground, river, banks, buildings ---------- */
  var WATER = -7;
  var bankA = pairs(D.banks[0]), bankB = pairs(D.banks[1]);
  (function () {
    var land = new THREE.Shape(); var R = 4200;
    land.moveTo(-R, -R); land.lineTo(R, -R); land.lineTo(R, R); land.lineTo(-R, R); land.closePath();
    var hole = new THREE.Path(); var ring = bankA.concat(bankB);
    /* run the two bank lines out past the fog so the river does not stop at the edge of the data */
    function ext(p, q, k) { return [p[0] + (p[0] - q[0]) * k, p[1] + (p[1] - q[1]) * k]; }
    var a0 = ext(bankA[0], bankA[6], 14), a1 = ext(bankA[bankA.length - 1], bankA[bankA.length - 7], 14);
    var b0 = ext(bankB[0], bankB[6], 14), b1 = ext(bankB[bankB.length - 1], bankB[bankB.length - 7], 14);
    ring = [a0].concat(bankA, [a1, b0], bankB, [b1]);
    ring.forEach(function (p, i) { if (i) hole.lineTo(p[0], -p[1]); else hole.moveTo(p[0], -p[1]); });
    land.holes.push(hole);
    var g = new THREE.ShapeGeometry(land); g.rotateX(-Math.PI / 2);
    scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x0b0a09 })));
    /* river walls */
    var pos = [];
    [bankA, bankB].forEach(function (b) {
      for (var i = 0; i < b.length - 1; i++) {
        var p = b[i], q = b[i + 1];
        pos.push(p[0], 0, p[1], q[0], 0, q[1], q[0], WATER - 1, q[1], p[0], 0, p[1], q[0], WATER - 1, q[1], p[0], WATER - 1, p[1]);
      }
    });
    var wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Mesh(wg, new THREE.MeshBasicMaterial({ color: 0x1a1612, side: THREE.DoubleSide })));
    /* water */
    var wt = tex(cv(256, 256, function (g2, w, h) {
      g2.fillStyle = '#06080a'; g2.fillRect(0, 0, w, h);
      for (var i = 0; i < 900; i++) { g2.fillStyle = 'rgba(70,74,84,' + (0.05 + rnd() * 0.12) + ')'; g2.fillRect(rnd() * w, rnd() * h, 6 + rnd() * 22, 1); }
    }), true);
    wt.repeat.set(160, 160);
    var water = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshBasicMaterial({ map: wt }));
    water.rotation.x = -Math.PI / 2; water.position.y = WATER; scene.add(water);
    scene.userData.waterTex = wt;
  })();

  var winTex = tex(cv(512, 512, function (g, w, h) { /* 8 bays by 8 floors, about 28 m square */
    g.fillStyle = '#100e0c'; g.fillRect(0, 0, w, h);
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var lit = rnd(), col = lit < 0.13 ? '#c9a460' : lit < 0.19 ? '#aeb6bc' : lit < 0.23 ? '#d8c99a' : '#17150f';
      g.fillStyle = col; g.fillRect(c * 64 + 16, r * 64 + 14, 32, 38);
    }
  }), true);
  (function () {
    var pos = [], uv = [], rpos = [];
    D.buildings.forEach(function (b, bi) {
      var h = b[0] || (13 + hash(bi) * 13), tag = b[1], p = pairs(b[2]);
      if (tag === 'rfh') h = 24;
      var per = hash(bi + 0.5) * 28;
      for (var i = 0; i < p.length; i++) {
        var a = p[i], q = p[(i + 1) % p.length], len = Math.hypot(q[0] - a[0], q[1] - a[1]);
        var u0 = per / 28, u1 = (per + len) / 28, v1 = h / 28; per += len;
        pos.push(a[0], 0, a[1], q[0], 0, q[1], q[0], h, q[1], a[0], 0, a[1], q[0], h, q[1], a[0], h, a[1]);
        uv.push(u0, 0, u1, 0, u1, v1, u0, 0, u1, v1, u0, v1);
      }
      var tri = THREE.ShapeUtils.triangulateShape(p.map(function (v) { return new THREE.Vector2(v[0], v[1]); }), []);
      tri.forEach(function (t) { for (var k = 0; k < 3; k++) rpos.push(p[t[k]][0], h, p[t[k]][1]); });
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: winTex, side: THREE.DoubleSide })));
    var rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.Float32BufferAttribute(rpos, 3));
    scene.add(new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color: 0x0a0908, side: THREE.DoubleSide })));
  })();

  /* ---------- the footbridge frame: x along the walk, z to the right (the railway side), y up ---------- */
  var fw = pairs(D.foot['4254120']);
  var N = fw[2], S = fw[0];
  var L = Math.hypot(S[0] - N[0], S[1] - N[1]), ux = (S[0] - N[0]) / L, uz = (S[1] - N[1]) / L;
  var DECK = 9.2, HALF = 2.35, TRUSS = 3.7, RAILW = 17;
  var br = new THREE.Group(); br.position.set(N[0], 0, N[1]); br.rotation.y = -Math.atan2(uz, ux); scene.add(br);
  function toWorld(x, y, z) { return new THREE.Vector3(x, y, z).applyMatrix4(br.matrixWorld); }
  br.updateMatrixWorld(true);

  /* lights along both banks, each with a streak lying on the water towards the bridge */
  (function () {
    var streakTex = tex(cv(32, 256, function (g, w, h) {
      for (var y = 0; y < h; y++) {
        var t = y / h, a = Math.pow(1 - t, 1.6) * (0.35 + 0.65 * rnd());
        if (rnd() < 0.22) a *= 0.15;
        var gr = g.createLinearGradient(0, 0, w, 0);
        gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,' + a + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(0, y, w, 1);
      }
    }));
    var mid = toWorld(L * 0.45, 0, 0);
    var warm = [0xffb060, 0xffc98a, 0xfff0d2, 0xff9a48], odd = [0xb04cff, 0x30e0d8, 0xff4a3a, 0x4a7cff, 0xff58c0];
    function along(bank, step, fn) {
      var acc = 0;
      for (var i = 0; i < bank.length - 1; i++) {
        var p = bank[i], q = bank[i + 1], len = Math.hypot(q[0] - p[0], q[1] - p[1]);
        while (acc < len) { var t = acc / len; fn(p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, q[0] - p[0], q[1] - p[1]); acc += step; }
        acc -= len;
      }
    }
    [bankA, bankB].forEach(function (bank, bi) {
      along(bank, 21, function (x, z) {
        var d = Math.hypot(x - mid.x, z - mid.z); if (d > 1500 || d < 60) return;
        var col = rnd() < 0.2 ? odd[Math.floor(rnd() * odd.length)] : warm[Math.floor(rnd() * warm.length)];
        glow(x, 5.5, z, 9 + rnd() * 6, col, scene, 0.9);
        var len = 60 + rnd() * 150, wid = 5 + rnd() * 6;
        var m = new THREE.Mesh(new THREE.PlaneGeometry(wid, len), new THREE.MeshBasicMaterial({ map: streakTex, color: col, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        var ang = Math.atan2(mid.x - x, mid.z - z);
        m.rotation.set(-Math.PI / 2, 0, 0); m.rotation.order = 'YXZ'; m.rotation.y = ang + Math.PI;
        m.position.set(x + Math.sin(ang) * (len / 2 + 2), WATER + 0.05 + rnd() * 0.04, z + Math.cos(ang) * (len / 2 + 2));
        scene.add(m);
      });
    });
    /* the string of bulbs along the South Bank walk by the Festival Hall */
    var pts = [];
    along(bankB, 2.2, function (x, z, dx, dz) {
      if (Math.hypot(x - 215, z - 20) > 330) return;
      var n = Math.hypot(dx, dz) || 1; pts.push(x + (dz / n) * -6, 5.2 + Math.abs(Math.sin(pts.length * 0.9)) * 1.1, z - (dx / n) * -6);
    });
    var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffe9b8, size: 3.2, sizeAttenuation: false, fog: false })));
  })();

  /* landmarks by hand: the Festival Hall's lit roof, the Eye, the far skyline, Waterloo Bridge */
  (function () {
    var rfh = D.buildings.filter(function (b) { return b[1] === 'rfh'; })[0];
    if (rfh) {
      var p = pairs(rfh[2]), cx = 0, cz = 0; p.forEach(function (v) { cx += v[0]; cz += v[1]; }); cx /= p.length; cz /= p.length;
      var roof = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x8a2cf0, fog: false }));
      roof.scale.set(40, 9, 30); roof.position.set(cx, 24, cz); roof.rotation.y = -Math.atan2(uz, ux) + Math.PI / 2; scene.add(roof);
      glow(cx, 32, cz, 130, 0x9a3cff, scene, 0.55);
      var front = new THREE.Mesh(new THREE.BoxGeometry(84, 8, 2), new THREE.MeshBasicMaterial({ color: 0x3a2c18, fog: false }));
      front.position.set(cx - 42 * 0.62, 9, cz - 42 * 0.55); front.rotation.y = roof.rotation.y + Math.PI / 2; scene.add(front);
      for (var i = 0; i < 16; i++) glow(cx - 62 + rnd() * 60, 7 + rnd() * 5, cz - 70 + rnd() * 80, 13, 0xff3a2a, scene, 0.5); /* the trees lit red */
      var teal = new THREE.Mesh(new THREE.BoxGeometry(70, 5, 6), new THREE.MeshBasicMaterial({ color: 0x18d8d0, fog: false }));
      teal.position.set(cx + 95, 15, cz - 70); teal.rotation.y = roof.rotation.y; scene.add(teal);
    }
    /* the Eye: its real footprint runs north to south at about (22, 294) */
    var eye = new THREE.Group(); eye.position.set(22, 70, 294); eye.rotation.y = Math.PI / 2 + 0.19; scene.add(eye);
    eye.add(new THREE.Mesh(new THREE.TorusGeometry(60, 0.9, 6, 72), new THREE.MeshBasicMaterial({ color: 0x2a5cff, fog: false })));
    for (var k = 0; k < 32; k++) { var a = k / 32 * Math.PI * 2; glow(Math.cos(a) * 60, Math.sin(a) * 60, 0, 7, 0x3a6cff, eye, 0.9); }
    var legs = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.4, 78, 6), new THREE.MeshBasicMaterial({ color: 0x1c2a58, fog: false }));
    legs.position.set(0, -32, -16); legs.rotation.x = -0.42; eye.add(legs);
    /* far skyline, east past the data: St Paul's, the City, the Shard, the towers at Blackfriars */
    var far = new THREE.Group(); scene.add(far);
    function tower(x, z, w, h, lit, top) {
      var t = winTex.clone(); t.needsUpdate = true; t.repeat.set(w / 28, h / 28);
      var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w * 0.8), new THREE.MeshBasicMaterial({ map: t, color: lit || 0xffffff, fog: false }));
      m.position.set(x, h / 2, z); m.rotation.y = hash(x) * 1.5; far.add(m);
      if (top) glow(x, h + 4, z, 16, 0xff2a1a, far, 0.9);
    }
    tower(1074, 166, 38, 165, 0xdfe8ff, true); tower(1000, 120, 34, 110, 0xffe2b8); tower(1180, 210, 36, 150, 0xdfe8ff, true);
    tower(2321, 166, 60, 300, 0xcfe0ff, true);
    [[2500, -930, 50, 225], [2633, -885, 48, 270], [2700, -960, 52, 190], [2560, -1010, 46, 160], [2760, -820, 44, 205], [2420, -860, 40, 150], [2860, -900, 40, 175]].forEach(function (t, i) { tower(t[0], t[1], t[2], t[3], i % 2 ? 0xfff0d0 : 0xd8e6ff, i % 3 === 0); });
    var sp = new THREE.Group(); sp.position.set(1497, 0, -862); far.add(sp);
    var stone = new THREE.MeshBasicMaterial({ color: 0xcfc6ae, fog: false });
    var drum = new THREE.Mesh(new THREE.CylinderGeometry(19, 19, 30, 20), stone); drum.position.y = 55; sp.add(drum);
    var dome = new THREE.Mesh(new THREE.SphereGeometry(18, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), stone); dome.scale.y = 1.25; dome.position.y = 70; sp.add(dome);
    var lant = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3, 16, 8), stone); lant.position.y = 100; sp.add(lant);
    var nave = new THREE.Mesh(new THREE.BoxGeometry(110, 34, 36), new THREE.MeshBasicMaterial({ color: 0x8e866f, fog: false })); nave.position.y = 22; nave.rotation.y = 0.25; sp.add(nave);
    /* Waterloo Bridge: a lit line over the water downstream */
    D.bridges.forEach(function (b) {
      if (b[0] !== 'Waterloo Bridge') return;
      var p = pairs(b[1]), best = 0, A = p[0], B = p[1];
      p.forEach(function (a) { p.forEach(function (q) { var d = Math.hypot(a[0] - q[0], a[1] - q[1]); if (d > best) { best = d; A = a; B = q; } }); });
      var deck = new THREE.Mesh(new THREE.BoxGeometry(best, 2.4, 24), new THREE.MeshBasicMaterial({ color: 0x15130f }));
      deck.position.set((A[0] + B[0]) / 2, 8, (A[1] + B[1]) / 2); deck.rotation.y = -Math.atan2(B[1] - A[1], B[0] - A[0]); scene.add(deck);
      for (var i = 0; i < 40; i++) {
        var t = i / 39, x = A[0] + (B[0] - A[0]) * t, z = A[1] + (B[1] - A[1]) * t;
        glow(x, 6.4, z, 10, t < 0.5 ? 0xff3aa0 : 0x4a7cff, scene, 0.8);
        if (i % 3 === 0) glow(x, 13, z, 6, 0xffd9a0, scene, 0.8);
      }
    });
  })();

  /* ---------- the deck ---------- */
  (function () {
    var deckTex = tex(cv(256, 512, function (g, w, h) { /* one 3 m bay: stone flags, a pool of light from the rail post on the left */
      g.fillStyle = '#3d3a37'; g.fillRect(0, 0, w, h);
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
        var v = 52 + Math.floor(rnd() * 16); g.fillStyle = 'rgb(' + v + ',' + (v - 2) + ',' + (v - 5) + ')';
        var off = (r % 2) * 32; g.fillRect(((c * 64 + off) % w) + 1, r * 128 + 1, 62, 126);

  canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, yaw: st.yaw, pitch: st.pitch }; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return; var ym = cur.st.yawMax;
    st.yaw = Math.max(-ym, Math.min(ym, drag.yaw - (e.clientX - drag.x) * 0.0042));
    st.pitch = Math.max(-0.75, Math.min(0.6, drag.pitch - (e.clientY - drag.y) * 0.0036));
  });
  ['pointerup', 'pointercancel'].forEach(function (n) { canvas.addEventListener(n, function () { drag = null; canvas.classList.remove('drag'); }); });

  /* a stage can stop the walk to ask something; the answer is kept for later stages and for the game */
  var asking = null, askEl = document.getElementById('ask');
  function ask(pr) {
    asking = pr; var p = askEl.querySelector('p'), box = askEl.querySelector('span');
    p.textContent = pr.text; p.className = pr.draft ? 'claude-draft' : ''; box.innerHTML = '';
    pr.options.forEach(function (o) { var b = document.createElement('button'); b.type = 'button'; b.textContent = o.label; b.addEventListener('click', function () { answer(o.value); }); box.appendChild(b); });
    askEl.classList.add('show'); btn.style.visibility = 'hidden';
  }
  function answer(v) {
    if (!asking) return; choices[asking.id] = v; window.dispatchEvent(new CustomEvent('dss:walk-choice', { detail: { id: asking.id, value: v } }));
    asking = null; askEl.classList.remove('show'); btn.style.visibility = '';
  }
  var last = performance.now(), veil = document.getElementById('veil');
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; st.t += dt;
    var want = wantWalk() && !st.done;
    var pace = keys.shift ? 1.75 : (keys.s || keys.arrowdown) ? 0.5 : st.btn ? (st.btnPace || 1) : 1; /* stride, stroll, or the button's slide */
    st.speed += ((want ? 1.55 * pace : 0) - st.speed) * Math.min(1, dt * 4);
    if (st.speed > 0.05 && !hint.classList.contains('gone')) hint.classList.add('gone');
    if (cur.st.ride) { st.speed = 0; st.s += dt; } /* a ride runs on the clock */
    /* across the path: A and D or the side arrows; on a touch screen you drift the way you look while walking. Each stage says how far */
    var side = ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
    if (coarse && Math.abs(st.yaw) > 0.2) side = -Math.sin(st.yaw) * Math.min(1, st.speed);
    if (st.done || asking) side = 0;
    st.latV = (st.latV || 0) + (side * 1.25 - (st.latV || 0)) * Math.min(1, dt * 6); st.lat += st.latV * dt;
    var lim = cur.st.lat ? cur.st.lat(st.s) : [0, 0];
    if (st.lat > lim[1]) { st.lat += (lim[1] - st.lat) * Math.min(1, dt * 5); if (st.latV > 0) st.latV = 0; }
    if (st.lat < lim[0]) { st.lat += (lim[0] - st.lat) * Math.min(1, dt * 5); if (st.latV < 0) st.latV = 0; }
    st.s += st.speed * dt; st.bob += st.speed * dt * 4.1;
    (cur.st.prompts || []).forEach(function (pr) {
      if (pr.id in choices || st.s < pr.at) return;
      st.s = pr.at; st.speed = 0; if (!asking) ask(pr);
      st.yaw += (pr.look - st.yaw) * Math.min(1, dt * 2.5); st.pitch += (0 - st.pitch) * Math.min(1, dt * 2.5);
    });
    /* nearing the portal the whole view softens; through it, the blur peaks, the place changes, and it clears */
    var nd = cur.st.nearDist, near = Math.max(0, Math.min(1, (st.s - (S1 - nd)) / nd)); near = near * near;
    if (st.s >= S1 && !st.done) {
      window.dispatchEvent(new CustomEvent('dss:walk-stage-end', { detail: { stage: cur.id } }));
      if (idx < SEQ.length - 1) { enter(idx + 1); st.through = 1; drag = null; near = 0; }
      else { st.done = true; veil.classList.remove('clear'); setTimeout(function () { document.getElementById('end').classList.add('show'); btn.style.display = 'none'; window.dispatchEvent(new CustomEvent('dss:walk-end')); }, 2400); }
    }
    st.through = Math.max(0, st.through - dt / 1.8);
    var soft = Math.max(near * 0.55, st.through * st.through), blurPx = soft * 26;
    canvas.style.filter = blurPx > 0.15 ? 'blur(' + blurPx.toFixed(1) + 'px) brightness(' + (1 + soft * 0.9).toFixed(2) + ')' : '';
    portalMat.uniforms.t.value = st.t; portalMat.uniforms.near.value = near;
    var P = cur.st.pose(st.s), amp = Math.min(1.25, st.speed / 1.55);
    var camX = P.x + Math.cos(P.yaw) * st.lat, camZ = P.z - Math.sin(P.yaw) * st.lat;
    camera.position.set(camX, P.y + Math.sin(st.bob * 2) * 0.028 * amp, camZ);
    camera.rotation.order = 'YXZ'; camera.rotation.set(st.pitch, P.yaw + st.yaw, Math.sin(st.bob) * 0.004 * amp);
    cur.st.update(dt, st.t, st.s, [camX, camZ], st.lat); soundTick(dt);
    composer.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { veil.classList.add('clear'); }, 150);

  window.__walk = {
    state: function () { return { stage: idx, id: cur.id, blur: canvas.style.filter, lat: st.lat, limits: cur.st.lat ? cur.st.lat(st.s) : [0, 0], s: st.s, from: S0, to: S1, done: st.done, speed: st.speed, yaw: st.yaw, pitch: st.pitch }; },
    goto: function (f) { st.s = S0 + (S1 - S0) * f; }, enter: enter, look: function (yaw, pitch) { st.yaw = yaw; st.pitch = pitch || 0; },
    auto: function (on) { auto = !!on; }, choices: choices, answer: answer, sound: function () { var o = { on: soundOn, clip: soundClip }; Object.keys(players).forEach(function (k) { o[k] = { t: +players[k].currentTime.toFixed(1), vol: +players[k].volume.toFixed(2), paused: players[k].paused }; }); return o; }, asking: function () { return asking && asking.id; }, cam: camera, renderer: renderer
  };
})();
</script>
</body>
