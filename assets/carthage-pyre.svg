    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <style>
    .tg{transform-origin:0 0;animation:fl 1.3s ease-in-out infinite alternate}
    @keyframes fl{0%{transform:scale(1,1) skewX(0deg)}30%{transform:scale(.9,1.12) skewX(-7deg)}60%{transform:scale(1.08,.9) skewX(5deg)}100%{transform:scale(.95,1.07) skewX(-3deg)}}
    .em{animation:rise 4s linear infinite;opacity:0}
    @keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}70%{opacity:.55}100%{transform:translate(var(--dx),-170px);opacity:0}}
    .gl{animation:glow 2.3s ease-in-out infinite alternate}
    @keyframes glow{0%{opacity:.7}45%{opacity:1}100%{opacity:.8}}
    .sm{animation:smk 9s ease-in-out infinite alternate;transform-origin:310px 120px}
    @keyframes smk{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-16px,-12px) scale(1.1)}}
  </style>
