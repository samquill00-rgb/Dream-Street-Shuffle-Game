<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
  <title id="title">The third pillar closes</title>
  <desc id="desc">Two worn pub pillars frame a dark, apparently solid wall; an amber glow escapes at the foot.</desc>
  <defs>
    <radialGradient id="gas"><stop stop-color="#d8ab67" stop-opacity=".2"/><stop offset=".48" stop-color="#b3824e" stop-opacity=".07"/><stop offset="1" stop-color="#b3824e" stop-opacity="0"/></radialGradient>
    <radialGradient id="fault"><stop stop-color="#e2b771" stop-opacity=".48"/><stop offset=".4" stop-color="#d39a59" stop-opacity=".15"/><stop offset="1" stop-color="#d39a59" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x2="1" y2=".2"><stop stop-color="#171c20"/><stop offset=".18" stop-color="#686458"/><stop offset=".41" stop-color="#343532"/><stop offset=".72" stop-color="#4c4a43"/><stop offset="1" stop-color="#151b20"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#313233"/><stop offset=".55" stop-color="#1f272b"/><stop offset="1" stop-color="#10191f"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#998164" stop-opacity=".21"/><stop offset="1" stop-color="#998164" stop-opacity="0"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
  </defs>
  <ellipse cx="310" cy="60" rx="275" ry="160" fill="url(#gas)"/>
  <path d="M63 214q249-8 495 1" fill="none" stroke="#b29976" stroke-opacity=".24" stroke-width="2"/>
  <path d="M66 215l-58 35m203-35l-24 35m273-35l28 35m71-35l65 35" stroke="#ac9b80" stroke-opacity=".13"/>
  <!-- What seems to be an opening is filled by masonry. -->
  <path d="M181 14h260v199H181z" fill="url(#wall)" stroke="#776e5d" stroke-opacity=".36" stroke-width="2"/>
  <path d="M186 59h252m-252 32h252m-252 32h252m-252 32h252m-252 32h252" stroke="#9d9684" stroke-opacity=".12" stroke-width="1.3"/>
  <path d="M239 28v30m97 0V30M214 60v30m127 0V60m-79 31v31m123-31v31m-155 33v31m108-31v31m-75 1v25" stroke="#aaa08b" stroke-opacity=".1" stroke-width="1.3"/>
  <path d="M279 15q-11 66-1 103-8 46 6 78m59-183q13 31 5 56-4 37 3 58-11 44-3 67" stroke="#090f13" stroke-opacity=".2" stroke-width="2" fill="none"/>
  <path d="M280 209q34-3 63 0" fill="none" stroke="#dabb7e" stroke-opacity=".4" stroke-width="1.4"/>
  <ellipse cx="312" cy="213" rx="93" ry="25" fill="url(#fault)"/>
  <path d="M247 216q62 2 128 0l31 34H216z" fill="url(#floor)"/>
  <!-- Massive, uneven pillars, topped with pub-worn capitals. -->
  <path d="M80 17h133v16H80zm-8 17h148v12H72zm13 5h120v170H85z" fill="url(#stone)" stroke="#aaa087" stroke-opacity=".4" stroke-width="1.2"/>
  <path d="M407 17h133v16H407zm-7 17h148v12H400zm13 5h120v170H413z" fill="url(#stone)" stroke="#aaa087" stroke-opacity=".4" stroke-width="1.2"/>
  <path d="M103 47v157m17-157v157m19-157v157m27-157v157m23-157v157m242-157v157m19-157v157m25-157v157m21-157v157m20-157v157" stroke="#b4aa93" stroke-opacity=".16" stroke-width="2"/>
  <path d="M91 54q26 3 49 0m13 2q25 3 48 0m219 1q43-3 75 1m-378 74q11 4 22 0m295 18q9-2 19 2" fill="none" stroke="#ddd1ae" stroke-opacity=".16" stroke-width="1"/>
  <path d="M75 206h144v11H75zm326 0h146v11H401z" fill="#2b2d2b" stroke="#8c846f" stroke-opacity=".42"/>
  <path d="M0 0h620v250H0z" filter="url(#grain)" opacity=".29"/>
</svg>
