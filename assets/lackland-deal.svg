<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
  <title id="title">The offer on the envelope</title>
  <desc id="desc">A written envelope, a cigarette and the edge of a manuscript in the green pool of an office lamp.</desc>
  <defs>
    <radialGradient id="pool"><stop stop-color="#9cb986" stop-opacity=".23"/><stop offset=".48" stop-color="#6d916b" stop-opacity=".11"/><stop offset="1" stop-color="#6d916b" stop-opacity="0"/></radialGradient>
    <radialGradient id="ember"><stop stop-color="#edaa62" stop-opacity=".33"/><stop offset="1" stop-color="#cf6738" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#302822"/><stop offset=".54" stop-color="#211d1b"/><stop offset="1" stop-color="#12171a"/></linearGradient>
    <linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#d5c5a6"/><stop offset=".56" stop-color="#c0ac89"/><stop offset="1" stop-color="#92816a"/></linearGradient>
    <linearGradient id="glass" x2=".5" y2="1"><stop stop-color="#7caa89" stop-opacity=".85"/><stop offset="1" stop-color="#1c5145" stop-opacity=".9"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="14"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".10"/></feComponentTransfer></filter>
  </defs>
  <path d="M0 162q307-13 620 3v85H0z" fill="url(#desk)"/>
  <path d="M0 163q299-13 620 3" fill="none" stroke="#ad9274" stroke-opacity=".22"/>
  <ellipse cx="301" cy="144" rx="275" ry="120" fill="url(#pool)"/>
  <path d="M51 177q160-12 306 0m84 1q91-4 159 5" fill="none" stroke="#bb9c74" stroke-opacity=".12"/>
  <!-- The green shade is only partly visible: the light falls on the decision. -->
  <path d="M64-23h154l-16 63q-57 16-123 0z" fill="#102a2a" stroke="#658877" stroke-opacity=".55" stroke-width="2"/>
  <path d="M79 39q62 20 123 0" fill="none" stroke="#a9c2a0" stroke-opacity=".53" stroke-width="2"/>
  <path d="M92 36h103" stroke="#d4c79b" stroke-opacity=".35" stroke-width="1.3"/>
  <path d="M78-2h129l-11 37q-49 14-109 0z" fill="url(#glass)" opacity=".68"/>
  <path d="M86 46q111 51 194 106" fill="none" stroke="#a9b890" stroke-opacity=".08" stroke-width="56" filter="url(#soft)"/>
  <!-- The manuscript remains present but outside the written offer. -->
  <g transform="rotate(-7 512 151)">
    <path d="M445 80h152v120H445z" fill="#080e12" opacity=".53" transform="translate(3 4)"/>
    <path d="M445 80h152v120H445z" fill="#786f60" stroke="#c9b99a" stroke-opacity=".55"/>
    <path d="M451 86h139v107H451z" fill="#b9a98d" opacity=".42"/>
    <path d="M465 103h93m-93 8h113m-113 8h102m-102 8h106m-106 8h76m-76 8h110m-110 8h99m-99 8h106" stroke="#383b35" stroke-opacity=".22" stroke-width="1.2"/>
    <path d="M445 80v120" stroke="#302d2a" stroke-opacity=".6" stroke-width="5"/>
  </g>
  <!-- A used envelope, turned over; the amount is deliberately illegible. -->
  <g transform="rotate(4 303 164)">
    <path d="M192 101h220v131H192z" fill="#05090b" opacity=".5" transform="translate(5 7)" filter="url(#soft)"/>
    <path d="M192 101h220v131H192z" fill="url(#paper)" stroke="#e7d8b7" stroke-opacity=".65" stroke-width="1.3"/>
    <path d="M194 103l107 70 108-70" fill="none" stroke="#6d604e" stroke-opacity=".34" stroke-width="1.2"/>
    <path d="M194 230l78-64m139 64l-78-64" fill="none" stroke="#6d604e" stroke-opacity=".25"/>
    <path d="M246 188q12-6 22-1t19-4q7-4 12 2 8 5 18 0 8-4 15-1 10 5 24 0m-91 12q8-2 16 1 9 3 18-2 8-3 14 0 13 6 24-1" fill="none" stroke="#312b27" stroke-opacity=".59" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M355 209q8-2 13 0" stroke="#332b26" stroke-opacity=".38"/>
  </g>
  <!-- Cigarette on an ashtray, its long ash catching the last warmth. -->
  <ellipse cx="137" cy="206" rx="61" ry="14" fill="#0c1114" stroke="#8e8878" stroke-opacity=".38" stroke-width="2"/>
  <ellipse cx="137" cy="202" rx="44" ry="7" fill="#2c2925" stroke="#9a8b72" stroke-opacity=".23"/>
  <g transform="rotate(-18 152 189)"><path d="M119 183h93v7h-93z" fill="#cfbfa2"/><path d="M119 183h24v7h-24z" fill="#aa8551"/><path d="M206 183h6v7h-6z" fill="#989b94"/><path d="M212 184h4v5h-4z" fill="#ed9d61"/></g>
  <ellipse cx="205" cy="171" rx="28" ry="30" fill="url(#ember)"/>
  <path d="M211 173q-14-22 6-38 11-12 0-20m-7 58q-5-17 2-27" fill="none" stroke="#adbaa8" stroke-opacity=".16" stroke-width="2"/>
  <path d="M5 173q85 3 153-6m254 50q100 1 190-11" stroke="#b4aa8c" stroke-opacity=".12" fill="none"/>
  <path d="M0 0h620v250H0z" filter="url(#grain)" opacity=".25"/>
</svg>
