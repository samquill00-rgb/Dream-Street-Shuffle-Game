window.dssInteriorSurface = function(t, kind, seed) {

  // A handful of drawn knots, elongated with the grain.
  for(var k=0;k<3;k++){var px=(.16+r(k+77)*.68)*w,py=(.12+r(k+99)*.76)*h;
    for(var n=0;n<4;n++){x.strokeStyle=n%2?'rgba(214,153,80,0.25)':'rgba(17,8,3,0.35)';x.lineWidth=1.4;x.beginPath();x.ellipse(px,py,8+n*6,2+n*2,.04,0,6.283);x.stroke();}

    line(join,y,join,y+h/4,'rgba(10,6,3,0.6)',1.8);

  }
} else if(kind==='plaster' || kind==='stone') {
  // Angular washes and scumbled chips: visible painted texture, not camera grain.
  for(var i=0;i<140;i++){var px=r(i+120)*w,py=r(i+720)*h,sz=5+r(i+90)*25;
    patch(px,py,sz*(1+r(i+180)),sz*.55,i%3?'rgba(17,12,8,0.12)':'rgba(244,225,186,0.15)');

x.restore();t.needsUpdate=true;return t;

 function mat(c,metal){var k=c+':'+!!metal;return mats[k]||(mats[k]=new THREE.MeshStandardMaterial({color:c,roughness:metal?0.67:0.94,metalness:metal?0.48:0}));}

 function ring(r,t,c,x,y,z,p,vertical){var o=put(new THREE.TorusGeometry(r,t,5,24),mat(c,true),x,y,z,p);if(!vertical)o.rotation.x=Math.PI/2;return o;}

// ====== THE ENLIGHTENMENT — AIRPORT PUB SCENE — INLINE ======
// The Enlightenment: an open bay cut into the terminal's south wall,
// seen across the concourse. Bunting up for something that finished.
// Ported 2026-09-14 from airport-pub-3d-static.html, the standalone

(function() {

(window.dssLoadPost ? window.dssLoadPost(buildapScene) : buildapScene());
}
}

function buildapScene() {

// Reduced motion: hold the loop's clock (t pinned, dt 0) so the pendants,
