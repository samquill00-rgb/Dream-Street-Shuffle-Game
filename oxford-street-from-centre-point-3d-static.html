  g.rotation.y = STREET_ANGLE;

  var stoneC  = new THREE.MeshStandardMaterial({ color: 0x7c6a58, roughness: 0.9 });

    color: 0x1f2e26, roughness: 0.75, metalness: 0.35

  });

  tower.position.set(0, 9.5, 0);

    for (var qz = -1; qz <= 1; qz += 2) {
      var quoin = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 12.5, 0.45),

  // --- CLOCK STAGE (the grand upper stone storey)

  clockStage.position.set(0, 18.38, 0);

  var clockFaceGeo = new THREE.CircleGeometry(clockR, 24);
  // Face on +Z side
  var clockN = new THREE.Mesh(clockFaceGeo, clockFaceMat);
  clockN.position.set(0, 18.4, 2.66);

  // Face on -Z side

  // Clock surround ring (dark narrow torus around each face for definition)
  function addClockRing(px, py, pz, ry) {

  addClockRing(-2.69, 18.4, 0, Math.PI / 2);

  // --- BALUSTRADE (open parapet with pedestals at corners)
  var balCap = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.4, 5.6), stoneL);
  balCap.position.set(0, 20.78, 0);
  g.add(balCap);

  // Urn finials at the four corners of the balustrade — read as small bumps
  function addUrn(ux, uz) {
    var urnBase = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.5, 0.55),
      stoneL
    );
    urnBase.position.set(ux, 21.25, uz);
    g.add(urnBase);
    var urn = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 10, 8),
      stoneL
    );
    urn.position.set(ux, 21.9, uz);
    g.add(urn);
  }
  addUrn(2.55, 2.55);
  addUrn(-2.55, 2.55);
  addUrn(2.55, -2.55);
  addUrn(-2.55, -2.55);

  // --- COPPER DRUM (Cockerell's signature barrel section)
  var drumH = 5.0;
  var drumY = 23.5;
  var drum = new THREE.Mesh(
    new THREE.CylinderGeometry(3.0, 3.0, drumH, 24),
    copperC
  );
  drum.position.set(0, drumY, 0);
  g.add(drum);

  // Louvres — vertical dark bars around the drum (read as pilasters/louvres)
  for (var lv = 0; lv < 8; lv++) {
    var lva = (lv / 8) * Math.PI * 2;
    var louvre = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, drumH * 0.8, 0.22),
      copperD
    );
    louvre.position.set(Math.cos(lva) * 3.05, drumY, Math.sin(lva) * 3.05);
    louvre.rotation.y = -lva;
    g.add(louvre);
  }
  // Horizontal seam bands (top and bottom of drum)
  var drumTopBand = new THREE.Mesh(
    new THREE.TorusGeometry(3.05, 0.12, 6, 24),
    copperD
  );
  drumTopBand.rotation.x = Math.PI / 2;
  drumTopBand.position.y = drumY + drumH/2 - 0.2;
  g.add(drumTopBand);
  var drumBotBand = new THREE.Mesh(
    new THREE.TorusGeometry(3.05, 0.12, 6, 24),
    copperD
  );
  drumBotBand.rotation.x = Math.PI / 2;
  drumBotBand.position.y = drumY - drumH/2 + 0.2;
  g.add(drumBotBand);

  // --- DOMED CAP (hemispherical)
  var dome = new THREE.Mesh(
    new THREE.SphereGeometry(2.7, 20, 14, 0, Math.PI * 2, 0, Math.PI / 2),
    copperC
  );
  dome.position.set(0, drumY + drumH/2, 0);
  g.add(dome);

  // --- LANTERN (small narrower stage between dome and spire)
  var lantern = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 0.95, 1.4, 14),
    copperC
  );
  lantern.position.set(0, drumY + drumH/2 + 2.5, 0);
  g.add(lantern);
  // Thin cap on lantern
  var lantCap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.85, 0.35, 14),
    copperD
  );
  lantCap.position.set(0, drumY + drumH/2 + 3.4, 0);
  g.add(lantCap);

  // --- NEEDLE SPIRE on top of lantern
  var spire = new THREE.Mesh(
    new THREE.ConeGeometry(0.5, 4.6, 10),
    copperC
  );
  spire.position.set(0, drumY + drumH/2 + 5.9, 0);
  g.add(spire);

  // Ball finial below cross
  var ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 10, 8),
    copperD
  );
  ball.position.set(0, drumY + drumH/2 + 8.3, 0);
  g.add(ball);

  // Cross finial
  var cross = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 1.0, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x1a100a })
  );
  cross.position.set(0, drumY + drumH/2 + 9.0, 0);
  g.add(cross);
  // Cross bar
  var crossBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.1, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x1a100a })
  );
  crossBar.position.set(0, drumY + drumH/2 + 9.0, 0);
  g.add(crossBar);

  churchGroup.add(g);
  return g;
}

// ============================================================
// POST OFFICE TOWER (BT Tower from 1984) — 1973 configuration
// ============================================================
//
// Proportion-accurate remodel based on reference image:
// - Very tall narrow concrete shaft dominates (~75% of total height)
// - Microwave-dish platform rings only on the upper half of the shaft
// - Glazed restaurant pod ~85% height, wider than shaft
// - Above pod: stacked concrete collars, a dark sign panel (no BT logo in 1973),
//   narrower neck, and a lattice cap
// - Tall tapering antenna spike at the very top
//
var btTower = new THREE.Group();
// Post Office Tower sits in Fitzrovia, north-west of Centre Point —
// past Soho Square and set back to the right of frame. Coordinates
// here must match isBTTowerZone() above.
var BT_X = 89, BT_Z = -196;

// Shared materials
var latticeMat = new THREE.MeshStandardMaterial({
  color: 0x7a7670, roughness: 0.6, metalness: 0.35
});
var dishMat = new THREE.MeshStandardMaterial({
  color: 0xb8b0a4, roughness: 0.4, metalness: 0.2
});
// Darker concrete for the upper sign-panel section
var darkPanelMat = new THREE.MeshStandardMaterial({
  color: 0x2a2820, roughness: 0.8
});

// Podium & base (three-storey squarish block)
var btPodium = new THREE.Mesh(
  new THREE.BoxGeometry(7, 3.0, 7),
  btConcreteMat
);
btPodium.position.set(0, 1.5, 0);
btTower.add(btPodium);

// Slightly tapered lower cylinder — the "base expansion"
var btBase = new THREE.Mesh(
  new THREE.CylinderGeometry(2.6, 3.2, 5, 24),
  btConcreteMat
);
btBase.position.set(0, 5.5, 0);
btTower.add(btBase);

// MAIN SHAFT — very tall, very narrow. This is the defining line.
var SHAFT_BASE_Y = 8.0;
var SHAFT_H      = 37;                // ~75% of total height (shortened slightly
                                      // to suit the further-away placement)
var shaft = new THREE.Mesh(
  new THREE.CylinderGeometry(1.6, 1.8, SHAFT_H, 32),
  btConcreteMat
);
shaft.position.set(0, SHAFT_BASE_Y + SHAFT_H/2, 0);
btTower.add(shaft);

// Vertical stripe detail — the faint vertical seam on the concrete
for (var vs = 0; vs < 6; vs++) {
  var va = (vs / 6) * Math.PI * 2;
  var seam = new THREE.Mesh(
    new THREE.BoxGeometry(0.05, SHAFT_H, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x4a4638, roughness: 0.9 })
  );
  seam.position.set(Math.cos(va)*1.62, SHAFT_BASE_Y + SHAFT_H/2, Math.sin(va)*1.62);
  btTower.add(seam);
}

// LATTICE DISH PLATFORMS — only on the UPPER half of the shaft
// Real Post Office Tower has them clustered ~65-80% height
function addLatticeRing(centreY, radius, dishCount, dishSize) {
  // Main platform ring
  var ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.12, 6, 32),
    latticeMat
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = centreY;
  btTower.add(ring);
  // Lower ring
  var ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(radius - 0.1, 0.08, 6, 32),
    latticeMat
  );
  ring2.rotation.x = Math.PI / 2;
  ring2.position.y = centreY - 1.1;
  btTower.add(ring2);
  // Lattice struts between them
  for (var ls = 0; ls < 16; ls++) {
    var la = (ls / 16) * Math.PI * 2;
    var strut = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 1.15, 0.06),
      latticeMat
    );
    strut.position.set(Math.cos(la)*radius, centreY - 0.55, Math.sin(la)*radius);
    btTower.add(strut);
  }
  // Microwave dishes
  for (var di = 0; di < dishCount; di++) {
    var da = (di / dishCount) * Math.PI * 2 + 0.05;
    var dx = Math.cos(da) * (radius + dishSize * 0.45);
    var dz = Math.sin(da) * (radius + dishSize * 0.45);
    var dish = new THREE.Mesh(
      new THREE.CylinderGeometry(dishSize * 0.95, dishSize, 0.18, 16, 1, true),
      dishMat
    );
    dish.rotation.x = Math.PI / 2;
    dish.rotation.z = -da + Math.PI / 2;
    dish.position.set(dx, centreY - 0.1, dz);
    btTower.add(dish);
    // Dish hood (cover)
    var hood = new THREE.Mesh(
      new THREE.CylinderGeometry(dishSize * 0.7, dishSize * 0.95, 0.35, 16),
      latticeMat
    );
    hood.rotation.x = Math.PI / 2;
    hood.rotation.z = -da + Math.PI / 2;
    hood.position.set(
      Math.cos(da) * (radius + dishSize * 0.15),
      centreY - 0.1,
      Math.sin(da) * (radius + dishSize * 0.15)
    );
    btTower.add(hood);
  }
}

// Three dish-platform rings clustered near the top of the shaft
addLatticeRing(SHAFT_BASE_Y + 26, 2.6, 10, 0.65);
addLatticeRing(SHAFT_BASE_Y + 31, 2.6, 10, 0.65);
addLatticeRing(SHAFT_BASE_Y + 35, 2.5, 8, 0.55);

// Top of shaft
var shaftTopY = SHAFT_BASE_Y + SHAFT_H;   // y = 50

// RESTAURANT POD — glazed rotating restaurant, wider than shaft,
// sits just above the dish rings.
var POD_Y = shaftTopY + 1.5;             // y = 51.5
var POD_H = 2.6;
// Lower concrete rim
var podBot = new THREE.Mesh(
  new THREE.CylinderGeometry(2.5, 2.3, 0.35, 32),
  btConcreteMat
);
podBot.position.y = POD_Y - POD_H/2 - 0.15;
btTower.add(podBot);
// Glass restaurant band
var podGlass = new THREE.Mesh(
  new THREE.CylinderGeometry(2.55, 2.55, POD_H, 36, 1, true),

);
podGlass.position.y = POD_Y;
btTower.add(podGlass);
// Upper concrete rim
var podTop = new THREE.Mesh(
  new THREE.CylinderGeometry(2.3, 2.5, 0.35, 32),
  btConcreteMat
);
podTop.position.y = POD_Y + POD_H/2 + 0.15;
btTower.add(podTop);

// Above the pod: a narrower concrete neck with a small cap
var neckY = POD_Y + POD_H/2 + 1.0;
var neck = new THREE.Mesh(
  new THREE.CylinderGeometry(1.4, 1.6, 1.8, 24),

);
neck.position.y = neckY;
btTower.add(neck);

// Dark "sign panel" section (no BT logo in 1973 — just a dark band
// representing the upper observation deck / signage area)
var signY = neckY + 2.0;
var signPanel = new THREE.Mesh(
  new THREE.BoxGeometry(2.4, 1.2, 2.4),

);
signPanel.position.y = signY;
btTower.add(signPanel);

// A faint warm strip along the sign panel (lit signage glow)
var signGlow = new THREE.Mesh(
  new THREE.BoxGeometry(2.5, 0.35, 2.5),

    color: 0x2a1a0a, emissive: 0xc07030, emissiveIntensity: 0.55
  })

signGlow.position.y = signY;
btTower.add(signGlow);

// Above sign: narrower concrete cap
var topCapY = signY + 1.1;
var topCap = new THREE.Mesh(
  new THREE.CylinderGeometry(1.0, 1.4, 1.0, 20),

);
topCap.position.y = topCapY;
btTower.add(topCap);

// Stepped lattice section above top cap — narrowing to mast
var stepY1 = topCapY + 1.0;
var step1 = new THREE.Mesh(

);
step1.position.y = stepY1;
btTower.add(step1);

var stepY2 = stepY1 + 1.0;
var step2 = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 0.9, 0.9),

);
step2.position.y = stepY2;
btTower.add(step2);

// MAIN ANTENNA MAST — long, thin, tapering to a point
var mastBaseY = stepY2 + 0.6;
var mast = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.2, 5.5, 10),
  latticeMat
);
mast.position.y = mastBaseY + 2.75;
btTower.add(mast);

// Fine spike tip
var spike = new THREE.Mesh(
  new THREE.ConeGeometry(0.05, 1.2, 8),
  latticeMat
);
spike.position.y = mastBaseY + 6.1;
btTower.add(spike);

// Aviation warning lights (red) — on shaft and near top
var btAvLight1 = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 8, 6),
  new THREE.MeshStandardMaterial({ color: 0x400000, emissive: 0xff2410, emissiveIntensity: 0.6 })
);
btAvLight1.position.set(0, SHAFT_BASE_Y + 18, 0);
btTower.add(btAvLight1);

var btAvLight2 = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 8, 6),
  new THREE.MeshStandardMaterial({ color: 0x400000, emissive: 0xff2410, emissiveIntensity: 0.6 })
);
btAvLight2.position.set(0, mastBaseY + 5.8, 0);
btTower.add(btAvLight2);

var btAvPointLight = new THREE.PointLight(0xff2410, 0.0, 20);
btAvPointLight.position.set(0, mastBaseY + 5.8, 0);
btTower.add(btAvPointLight);

btTower.position.set(BT_X, 0, BT_Z);
scene.add(btTower);

var carLights = [];
var streetCos = Math.cos(STREET_ANGLE);
var streetSin = Math.sin(STREET_ANGLE);
var streetCX  = -4 - Math.sin(STREET_ANGLE) * STREET_LEN * 0.5;
var streetCZ  = -STREET_LEN / 2 + 10;

function addCarLight(along, side, colour, intensity) {
  // `along` is distance from near end toward far end (0 → STREET_LEN)
  // `side` is lateral offset (-STREET_WIDTH/2 .. STREET_WIDTH/2)
  var px = streetCX + Math.cos(STREET_ANGLE) * side - Math.sin(STREET_ANGLE) * (along - STREET_LEN/2);
  var pz = streetCZ + Math.sin(STREET_ANGLE) * side + Math.cos(STREET_ANGLE) * (along - STREET_LEN/2);
  var lightMat = new THREE.MeshStandardMaterial({
    color: colour, emissive: colour, emissiveIntensity: intensity, fog: true
  });
  var lightMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 6, 5),
    lightMat
  );
  lightMesh.position.set(px, 0.6, pz);
  scene.add(lightMesh);
  carLights.push(lightMesh);
}

// A scattering of headlights moving away and taillights coming toward us.
// London traffic drives on the LEFT: so near-lane (negative side) carries
// traffic driving AWAY from the camera down Oxford St = shows tail-lights.
// Far-lane (positive side) carries traffic coming toward us = headlights.
for (var cl = 0; cl < 32; cl++) {
  var along = 15 + rand() * (STREET_LEN - 30);
  if (rand() < 0.5) {
    // Tail lights — near lane
    addCarLight(along, -3, 0xff2008, 1.8);
    addCarLight(along - 1.8, -2, 0xff2008, 1.6);
  } else {
    // Headlights — far lane
    addCarLight(along, 3, 0xfff4c8, 2.4);
    addCarLight(along - 1.8, 4, 0xfff4c8, 2.2);
  }
}

// ============================================================
// CENTRE POINT ROOFTOP FOREGROUND — removed (was blocking the view)
// ============================================================

// ============================================================
// ATMOSPHERIC FOG SPRITES — dawn mist hanging between buildings
// ============================================================
var fogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
  var g = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0,    'rgba(200, 180, 180, 0.22)');
  g.addColorStop(0.4,  'rgba(160, 140, 150, 0.11)');
  g.addColorStop(1,    'rgba(100, 90, 100, 0)');
  cx.fillStyle = g; cx.fillRect(0, 0, w, h);
});
var warmFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
  var g = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0,    'rgba(230, 160, 110, 0.22)');
  g.addColorStop(0.4,  'rgba(190, 110, 80, 0.10)');
  g.addColorStop(1,    'rgba(130, 70, 50, 0)');
  cx.fillStyle = g; cx.fillRect(0, 0, w, h);
});

var fogSprites = [];
for (var fi = 0; fi < 60; fi++) {
  var useWarm = fi < 25;
  var fMat = new THREE.SpriteMaterial({
    map: useWarm ? warmFogTex : fogTex,
    transparent: true, opacity: 0.25 + Math.random() * 0.25,
    fog: false
  });
  var fs = new THREE.Sprite(fMat);
  // Scatter across the mid-distance
  var fx = (Math.random() - 0.5) * 220;
  var fz = -20 - Math.random() * 300;
  var fy = 3 + Math.random() * 18;
  fs.position.set(fx, fy, fz);
  var fsc = 20 + Math.random() * 50;
  fs.scale.set(fsc, fsc * 0.4, 1);
  scene.add(fs);
  fogSprites.push({
    sprite: fs, baseX: fx,
    drift: (Math.random() - 0.5) * 0.012,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.0005 + Math.random() * 0.0015,
    swayAmt: 1.5 + Math.random() * 3.0
  });
}

// A low blanket of horizon glow-haze right on the skyline
for (var hf = 0; hf < 14; hf++) {
  var hfMat = new THREE.SpriteMaterial({
    map: warmFogTex, transparent: true,
    opacity: 0.45 + Math.random() * 0.2, fog: false
  });
  var hfs = new THREE.Sprite(hfMat);
  hfs.position.set((Math.random() - 0.5) * 500, 4 + Math.random() * 5, -250 - Math.random() * 150);
  var hfsc = 80 + Math.random() * 120;
  hfs.scale.set(hfsc, hfsc * 0.28, 1);
  scene.add(hfs);
}

// ============================================================
// COAL SMOKE PLUMES — rising from chimneys across the rooftops.
// 1973 London still had coal and gas central heating in most terraces;
// at dawn on a cold November morning, hundreds of chimneys would be
// smoking. We place a handful of visible plumes at varying distances.
// ============================================================
var smokeTex = makeCanvasTexture(128, 128, function(cx, w, h) {
  var g = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0,   'rgba(80, 75, 68, 0.55)');
  g.addColorStop(0.4, 'rgba(55, 52, 48, 0.28)');
  g.addColorStop(1,   'rgba(30, 28, 26, 0)');
  cx.fillStyle = g; cx.fillRect(0, 0, w, h);
});

var smokePlumes = [];
for (var sp = 0; sp < 22; sp++) {
  // Plume rises from a random rooftop position
  var sx = (Math.random() - 0.5) * 160;
  var sz = -Math.random() * 200 - 10;
  // Each plume is 4-6 sprites stacked vertically
  var plumeHeight = 4 + Math.floor(Math.random() * 3);
  var baseY = 6 + Math.random() * 14;
  var plumeDrift = (Math.random() - 0.3) * 0.004;  // biased slight drift east→west
  for (var ps = 0; ps < plumeHeight; ps++) {
    var smoMat = new THREE.SpriteMaterial({
      map: smokeTex, transparent: true,
      opacity: (0.55 - ps * 0.08) * (0.7 + Math.random() * 0.3),
      fog: true
    });
    var smoSpr = new THREE.Sprite(smoMat);
    var yOff = baseY + ps * (1.2 + Math.random() * 0.5);
    smoSpr.position.set(sx + (Math.random()-0.5)*0.8, yOff, sz);
    var sSize = 1.4 + ps * 0.6 + Math.random() * 0.5;
    smoSpr.scale.set(sSize, sSize, 1);
    scene.add(smoSpr);
    smokePlumes.push({
      sprite: smoSpr,
      baseX: smoSpr.position.x,
      drift: plumeDrift,
      phase: Math.random() * Math.PI * 2,
      amplitude: 0.2 + Math.random() * 0.3,
      speed: 0.0008 + Math.random() * 0.001
    });
  }
}

// ============================================================
// ANIMATION
// ============================================================
var clock = new THREE.Clock();
var avBlinkPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  // --- BT Tower aviation lights — slow red blink, slightly offset phases ---
  avBlinkPhase += 0.018;
  var avCycle1 = Math.sin(avBlinkPhase * 0.7);
  var avCycle2 = Math.sin(avBlinkPhase * 0.7 + 0.8);
  var on1 = avCycle1 > 0.82;
  var on2 = avCycle2 > 0.82;
  btAvLight1.material.emissiveIntensity = on1 ? 1.4 + (avCycle1 - 0.82) * 6 : 0.12;
  btAvLight2.material.emissiveIntensity = on2 ? 1.4 + (avCycle2 - 0.82) * 6 : 0.12;
  btAvPointLight.intensity = on2 ? (avCycle2 - 0.82) * 8 : 0;

  // --- Dawn light gently warms/cools over time ---
  var warmBreath = 0.95 + Math.sin(t * 0.05) * 0.04;
  dawnLight.intensity = 0.85 * warmBreath;

  // --- Fog drift ---
  for (var fdi = 0; fdi < fogSprites.length; fdi++) {
    var f = fogSprites[fdi];
    f.sway += f.swaySpeed;
    f.sprite.position.x = f.baseX + Math.sin(f.sway) * f.swayAmt;
    f.baseX += f.drift;
    if (f.baseX > 130) f.baseX = -130;
    if (f.baseX < -130) f.baseX = 130;
  }

  // --- Coal smoke drift (slow upward & lateral sway) ---
  for (var sdi = 0; sdi < smokePlumes.length; sdi++) {
    var sm = smokePlumes[sdi];
    sm.phase += sm.speed;
    sm.sprite.position.x = sm.baseX + Math.sin(sm.phase) * sm.amplitude + t * sm.drift;
  }

  // --- Very subtle camera breathing for life ---
  var breath = Math.sin(t * 0.12) * 0.08;
  camera.position.y = 34 + breath;

  if (composer) { composer.render(); } else { renderer.render(scene, camera); }
}

animate();
</script>
