<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
  <title id="title">The Interval stairwell</title>
  <desc id="desc">A worn red stair carpet descends from a dim theatre landing between old plaster walls and brass banisters.</desc>
