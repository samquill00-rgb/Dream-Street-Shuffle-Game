    /* across the path: A and D or the side arrows; on a touch screen you drift the way you look while walking. Each stage says how far */
    var side = ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
    if (coarse && Math.abs(st.yaw) > 0.2) side = -Math.sin(st.yaw) * Math.min(1, st.speed);
    if (st.done || asking) side = 0;
    st.latV = (st.latV || 0) + (side * 2.0 - (st.latV || 0)) * Math.min(1, dt * 6); st.lat += st.latV * dt;
    var lim = cur.st.lat ? cur.st.lat(st.s) : [0, 0];
    if (st.lat > lim[1]) { st.lat += (lim[1] - st.lat) * Math.min(1, dt * 5); if (st.latV > 0) st.latV = 0; }
    if (st.lat < lim[0]) { st.lat += (lim[0] - st.lat) * Math.min(1, dt * 5); if (st.latV < 0) st.latV = 0; }
    st.s += st.speed * dt; st.bob += st.speed * dt * 2.7;
    (cur.st.prompts || []).forEach(function (pr) {
      if (pr.id in choices || st.s < pr.at) return;
      st.s = pr.at; st.speed = 0; if (!asking) ask(pr);
      st.yaw += (pr.look - st.yaw) * Math.min(1, dt * 2.5); st.pitch += (0 - st.pitch) * Math.min(1, dt * 2.5);
    });
    /* nearing the portal the whole view softens; through it, the blur peaks, the place changes, and it clears */
    var nd = cur.st.nearDist, near = Math.max(0, Math.min(1, (st.s - (S1 - nd)) / nd)); near = near * near;
    if (st.s >= S1 && !st.done) {
      window.dispatchEvent(new CustomEvent('dss:walk-stage-end', { detail: { stage: cur.id } }));
      if (idx < SEQ.length - 1) { enter(idx + 1); st.through = 1; drag = null; near = 0; }
      else { st.done = true; veil.classList.remove('clear'); setTimeout(function () { if (Q.get('embed') !== '1') document.getElementById('end').classList.add('show'); btn.style.display = 'none'; window.dispatchEvent(new CustomEvent('dss:walk-end', { detail: { choices: choices } })); }, 2400); } /* framed in the game, the game turns the page */
    }
    st.through = Math.max(0, st.through - dt / 1.8);
    var soft = Math.max(near * 0.55, st.through * st.through), blurPx = soft * 26;
    var filt = blurPx > 0.15 ? GRADE + ' blur(' + blurPx.toFixed(1) + 'px) brightness(' + (1 + soft * 0.9).toFixed(2) + ')' : GRADE; if (filt !== lastFilt) { canvas.style.filter = filt; lastFilt = filt; }
    portalMat.uniforms.t.value = st.t; portalMat.uniforms.near.value = near;
    var P = cur.st.pose(st.s), amp = Math.min(1.25, st.speed / BASE);
    var camX = P.x + Math.cos(P.yaw) * st.lat, camZ = P.z - Math.sin(P.yaw) * st.lat;
    camera.position.set(camX, P.y + Math.sin(st.bob * 2) * 0.028 * amp, camZ);
    camera.rotation.order = 'YXZ'; camera.rotation.set(st.pitch, P.yaw + st.yaw, Math.sin(st.bob) * 0.004 * amp);
    cur.st.update(dt, st.t, st.s, [camX, camZ], st.lat); if (cur.st.rigUpdate) cur.st.rigUpdate(camX, P.y, camZ); soundTick(dt);
    composer.render();
  }
  requestAnimationFrame(frame);
  setTimeout(function () { veil.classList.add('clear'); }, 150);

  /* ?debug=1 reports what the page is doing to a local listener, for faults that only show in one browser */
  if (Q.get('debug') === '1') (function () {
    var n = 0, t0 = performance.now();
    function say(o) { o.t = Math.round(performance.now() - t0); try { navigator.sendBeacon('http://localhost:8798/log', JSON.stringify(o)); } catch (e) {} }
    function snap(why) { var i = renderer.info; return { why: why, stage: cur && cur.id, s: Math.round(st.s), lost: renderer.getContext().isContextLost(), tex: i.memory.textures, geo: i.memory.geometries, progs: i.programs ? i.programs.length : -1, calls: i.render.calls, tris: i.render.triangles, w: innerWidth, h: innerHeight, dpr: devicePixelRatio, buf: canvas.width + 'x' + canvas.height, ua: n ? undefined : navigator.userAgent }; }
    say(snap('loaded')); n = 1;
    var ticks = 0; setInterval(function () { if (ticks++ < 12) say(snap('tick')); }, 1000);
    var lostSaid = 0; canvas.addEventListener('webglcontextlost', function (e) { if (lostSaid++ < 2) say({ why: 'CONTEXT LOST', msg: e.statusMessage || '', at: snap('lost') }); });
    window.addEventListener('error', function (e) { say({ why: 'ERROR', msg: e.message, file: (e.filename || '').split('/').pop(), line: e.lineno }); }, true);
    ['keydown', 'pointerdown'].forEach(function (k) { window.addEventListener(k, function (e) { say({ why: k, key: e.key || '' }); }, true); });
    window.addEventListener('dss:walk-stage-end', function (e) { say(snap('stage-end ' + e.detail.stage)); }); window.addEventListener('dss:walk-end', function () { say(snap('WALK END')); });
  })();
  window.__walk = {
    state: function () { return { stage: idx, id: cur.id, blur: canvas.style.filter, lat: st.lat, limits: cur.st.lat ? cur.st.lat(st.s) : [0, 0], s: st.s, from: S0, to: S1, done: st.done, speed: st.speed, yaw: st.yaw, pitch: st.pitch }; },
    goto: function (f) { st.s = S0 + (S1 - S0) * f; }, enter: enter, look: function (yaw, pitch) { st.yaw = yaw; st.pitch = pitch || 0; },
    auto: function (on) { auto = !!on; }, choices: choices, answer: answer, sound: function () { var o = { on: soundOn, clip: soundClip }; Object.keys(players).forEach(function (k) { o[k] = { t: +players[k].currentTime.toFixed(1), vol: +players[k].volume.toFixed(2), paused: players[k].paused }; }); return o; }, asking: function () { return asking && asking.id; }, cam: camera, renderer: renderer
  };
})();
