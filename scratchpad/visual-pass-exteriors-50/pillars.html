</script><script>// ====== dssScene — REUSABLE 3D ATMOSPHERE TOOLKIT ===========
// ============================================================
// Procedural materials and props extracted from the Chippy /
// Pillars / Lackland scenes so new 3D approach scenes can pull
// the same Soho-night look without re-deriving every texture.
//
// Usage (inside a scene IIFE, after THREE is loaded):
//   var brickMat = dssScene.makeGrimyBrick({ baseColor: 0x7a5a48 });
//   var roadMat  = dssScene.makeGrimyRoad();
//   var paveMat  = dssScene.makePavingSlabs();
//   var stucco   = dssScene.makeWeatheredStucco();
//   dssScene.createVictorianGasLamp(scene, -4, 3.5);
//   var btn = dssScene.createEnterButton('ENTER THE SOMEWHERE',
//     function() { /* nav handler */ });
//   wrap.appendChild(btn);
//
// All `make*` factories return a THREE.MeshStandardMaterial with
// `map`/`repeat` set, ready to apply to geometry. `create*`
// factories build a THREE.Group (or DOM element) and add it for
// you when given a parent.
// ------------------------------------------------------------
window.dssScene = (function() {

  // ---------- canvas texture helper ----------
  function makeCanvasTexture(w, h, drawFunc) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    drawFunc(cx, w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------- GRIMY BRICK ----------
  // Running-bond brickwork with mortar courses, soot streaks,
  // damp/lichen patches, paste-up ghost, top soot wash.
  // opts:
  //   baseColor:  fill rgb (default 0x6f4f3a)
  //   repeat:     [u, v] tiling (default [2, 4])
  //   sootStreaks: count (default 5)
  //   dampPatches: count (default 5)
  //   lichen:      count (default 12)
  //   highlightBricks: count of brighter-painted bricks (default 8)
  function makeGrimyBrick(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x6f4f3a).toString(16).padStart(6, '0');
    var streaks = opts.sootStreaks != null ? opts.sootStreaks : 5;
    var damp    = opts.dampPatches != null ? opts.dampPatches : 5;
    var lichen  = opts.lichen      != null ? opts.lichen      : 12;
    var highlights = opts.highlightBricks != null ? opts.highlightBricks : 8;
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var bH = 14, bW = 32;
      for (var by = 0; by < h; by += bH) {
        var rowOff = ((Math.floor(by / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var bx = -bW; bx < w + bW; bx += bW) {
          var px = bx + rowOff;
          var r = 95 + Math.floor(Math.random() * 50);
          var g = 60 + Math.floor(Math.random() * 35);
          var b = 45 + Math.floor(Math.random() * 30);
          if (Math.random() > 0.94) { r -= 40; g -= 32; b -= 22; }
          if (Math.random() > 0.96) { r += 30; g += 18; b += 10; }
          cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          cx.fillRect(px + 1, by + 1, bW - 2, bH - 2);
          cx.fillStyle = 'rgba(20,12,6,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
          cx.fillRect(px + 1, by + bH - 3, bW - 2, 2);
        }
      }
      cx.fillStyle = 'rgba(170, 145, 115, 0.32)';
      for (var hy = 0; hy < h; hy += bH) cx.fillRect(0, hy, w, 1);
      cx.fillStyle = 'rgba(160, 135, 105, 0.22)';
      for (var hyy = 0; hyy < h; hyy += bH) {
        var ro = ((Math.floor(hyy / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var hxx = ro; hxx < w; hxx += bW) cx.fillRect(hxx, hyy, 1.4, bH);
      }
      for (var ss = 0; ss < streaks; ss++) {
        var sx = Math.random() * w;
        var sxw = 12 + Math.random() * 30;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(8, 6, 4, 0.55)');
        sg.addColorStop(0.3, 'rgba(12, 10, 6, 0.32)');
        sg.addColorStop(0.7, 'rgba(18, 14, 9, 0.12)');
        sg.addColorStop(1, 'rgba(22, 18, 10, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < damp; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.45 + Math.random() * h * 0.55;
        var dr = 30 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(60, 75, 55, 0.32)');
        dg2.addColorStop(0.5, 'rgba(50, 60, 45, 0.16)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      for (var lp = 0; lp < lichen; lp++) {
        cx.fillStyle = 'rgba(95, 105, 60, ' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          5 + Math.random() * 12, 3 + Math.random() * 6.6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var topG = cx.createLinearGradient(0, 0, 0, h * 0.45);
      topG.addColorStop(0, 'rgba(18, 12, 8, 0.42)');
      topG.addColorStop(1, 'rgba(18, 12, 8, 0)');
      cx.fillStyle = topG; cx.fillRect(0, 0, w, h * 0.45);
      cx.fillStyle = 'rgba(220, 200, 160, 0.08)';
      cx.fillRect(w * 0.12, h * 0.42, w * 0.18, h * 0.13);
      for (var hl = 0; hl < highlights; hl++) {
        var hbx = Math.floor(Math.random() * (w / bW)) * bW;
        var hby = Math.floor(Math.random() * (h / bH)) * bH;
        cx.fillStyle = 'rgba(220, 195, 150, ' + (0.10 + Math.random() * 0.15).toFixed(3) + ')';
        cx.fillRect(hbx + 1, hby + 1, bW - 2, 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 });
  }

  // ---------- WEATHERED STUCCO ----------
  // Cream stucco with hairline cracks, nicotine wash pooling
  // lower, soot streaks from gutters, damp/green patches, paint-
  // patch repairs, paste-up ghost, bird splat.
  // opts:
  //   baseColor: default 0xc8b89a
  //   repeat:    default [2, 3]
  function makeWeatheredStucco(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0xc8b89a).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var pp = 0; pp < 350; pp++) {
        var b = 180 + Math.floor(Math.random() * 30);
        cx.fillStyle = 'rgba(' + b + ',' + (b - 18) + ',' + (b - 32) + ',0.12)';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          6 + Math.random() * 24, 4 + Math.random() * 14, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var nicoG = cx.createLinearGradient(0, h * 0.35, 0, h);
      nicoG.addColorStop(0, 'rgba(170, 145, 80, 0)');
      nicoG.addColorStop(0.6, 'rgba(170, 145, 80, 0.10)');
      nicoG.addColorStop(1, 'rgba(160, 130, 60, 0.18)');
      cx.fillStyle = nicoG; cx.fillRect(0, h * 0.35, w, h * 0.65);
      for (var ss = 0; ss < 6; ss++) {
        var sx = Math.random() * w;
        var sxw = 10 + Math.random() * 26;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(15, 12, 8, 0.50)');
        sg.addColorStop(0.4, 'rgba(20, 16, 10, 0.22)');
        sg.addColorStop(0.85, 'rgba(25, 20, 12, 0.08)');
        sg.addColorStop(1, 'rgba(25, 20, 12, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < 4; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.7 + Math.random() * h * 0.3;
        var dr = 32 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(70, 80, 55, 0.30)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      cx.strokeStyle = 'rgba(50, 38, 22, 0.45)'; cx.lineWidth = 0.7;
      for (var ch = 0; ch < 14; ch++) {
        cx.beginPath();
        var cxh = Math.random() * w, cyh = Math.random() * h;
        cx.moveTo(cxh, cyh);
        for (var sg2 = 0; sg2 < 5; sg2++) {
          cxh += (Math.random() - 0.5) * 28; cyh += 12 + Math.random() * 22;
          cx.lineTo(cxh, cyh);
        }
        cx.stroke();
      }
      for (var pr = 0; pr < 8; pr++) {
        var prx = Math.random() * w, pry = Math.random() * h;
        var prr = 12 + Math.random() * 22;
        var pg = cx.createRadialGradient(prx, pry, 0, prx, pry, prr);
        pg.addColorStop(0, 'rgba(225, 210, 180, 0.45)');
        pg.addColorStop(0.6, 'rgba(220, 200, 170, 0.14)');
        pg.addColorStop(1, 'rgba(220, 200, 170, 0)');
        cx.fillStyle = pg;
        cx.beginPath();
        cx.ellipse(prx, pry, prr, prr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(200, 170, 130, 0.10)';
      cx.fillRect(w * 0.18, h * 0.55, w * 0.12, h * 0.10);
      cx.fillStyle = 'rgba(245, 240, 215, 0.36)';
      cx.beginPath();
      cx.ellipse(w * 0.88, h * 0.08, 5, 2.5, 0.4, 0, Math.PI * 2);
      cx.fill();
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 3];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
  }

  // ---------- GRIMY ROAD ----------
  // Tarmac with aggregate speckle, lighter repair patches, jagged
  // cracks, wandering tar-seal sealant lines, oil blotches, faded
  // white centre line.
  function makeGrimyRoad(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x1c1c1c).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var p = 0; p < 4200; p++) {
        var pg = 25 + Math.floor(Math.random() * 70);
        cx.fillStyle = 'rgba(' + pg + ',' + pg + ',' + pg + ',0.42)';
        cx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }
      for (var rp = 0; rp < 6; rp++) {
        var rx = Math.random() * w, ry = Math.random() * h;
        var rwd = 50 + Math.random() * 100, rht = 35 + Math.random() * 70;
        cx.fillStyle = 'rgba(78, 78, 78, ' + (0.16 + Math.random() * 0.22).toFixed(3) + ')';
        cx.fillRect(rx, ry, rwd, rht);
        cx.strokeStyle = 'rgba(100, 100, 100, 0.18)'; cx.lineWidth = 0.6;
        cx.strokeRect(rx, ry, rwd, rht);
      }
      cx.strokeStyle = 'rgba(8, 8, 8, 0.8)'; cx.lineWidth = 1.2;
      for (var c = 0; c < 10; c++) {
        cx.beginPath();
        var cx0 = Math.random() * w, cy0 = Math.random() * h;
        cx.moveTo(cx0, cy0);
        var ang = Math.random() * Math.PI * 2, len = 30 + Math.random() * 80;
        cx.lineTo(cx0 + Math.cos(ang) * len, cy0 + Math.sin(ang) * len);
        cx.lineTo(cx0 + Math.cos(ang + 0.4) * len * 1.4, cy0 + Math.sin(ang + 0.4) * len * 1.4);
        cx.stroke();
      }
      cx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; cx.lineWidth = 2.6;
      for (var tm = 0; tm < 5; tm++) {
        cx.beginPath();
        var tx = Math.random() * w, ty = Math.random() * h;
        cx.moveTo(tx, ty);
        for (var ts = 0; ts < 5; ts++) {
          tx += (Math.random() - 0.5) * 30; ty += 8 + Math.random() * 16;
          cx.lineTo(tx, ty);
        }
        cx.stroke();
      }
      cx.fillStyle = 'rgba(220, 220, 200, 0.5)';
      cx.fillRect(w * 0.5 - 2, h * 0.3, 4, h * 0.4);
      cx.fillStyle = 'rgba(220, 220, 200, 0.18)';
      cx.fillRect(w * 0.5 - 2, h * 0.05, 4, h * 0.2);
      cx.fillRect(w * 0.5 - 2, h * 0.75, 4, h * 0.2);
      for (var os = 0; os < 4; os++) {
        var ox = Math.random() * w, oy = Math.random() * h;
        var orr = 8 + Math.random() * 18;
        var og = cx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        og.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
        og.addColorStop(0.7, 'rgba(15, 12, 5, 0.22)');
        og.addColorStop(1, 'rgba(15, 12, 5, 0)');
        cx.fillStyle = og; cx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [1, 8];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.18 });
  }

  // ---------- PAVING SLABS ----------
  // London paving slabs with grout, cracks, gum/fag-ends and
  // wet patches.
  function makePavingSlabs(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x3a3a36).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var sw = 128, sh = 96;
      cx.strokeStyle = 'rgba(18, 18, 16, 0.55)'; cx.lineWidth = 1.4;
      for (var sy = 0; sy < h; sy += sh) {
        var off = ((sy / sh) % 2 === 0) ? 0 : sw / 2;
        for (var sx = -sw; sx < w + sw; sx += sw) {
          var bxp = sx + off;
          var sg = 48 + Math.floor(Math.random() * 28);
          cx.fillStyle = 'rgba(' + sg + ',' + sg + ',' + (sg - 4) + ',' + (0.32 + Math.random() * 0.3).toFixed(3) + ')';
          cx.fillRect(bxp, sy, sw, sh);
          cx.strokeRect(bxp, sy, sw, sh);
        }
      }
      cx.strokeStyle = 'rgba(15, 15, 12, 0.55)'; cx.lineWidth = 0.9;
      for (var c2 = 0; c2 < 7; c2++) {
        cx.beginPath();
        cx.moveTo(Math.random() * w, Math.random() * h);
        cx.lineTo(Math.random() * w, Math.random() * h);
        cx.stroke();
      }
      for (var fe = 0; fe < 60; fe++) {
        cx.fillStyle = 'rgba(180, 175, 165, ' + (0.15 + Math.random() * 0.22).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(Math.random() * w, Math.random() * h, 1.0 + Math.random() * 1.6, 0, Math.PI * 2);
        cx.fill();
      }
      for (var wp = 0; wp < 5; wp++) {
        var wpx = Math.random() * w, wpy = Math.random() * h;
        var wpr = 35 + Math.random() * 60;
        var wpg = cx.createRadialGradient(wpx, wpy, 0, wpx, wpy, wpr);
        wpg.addColorStop(0, 'rgba(72, 78, 80, 0.35)');
        wpg.addColorStop(1, 'rgba(72, 78, 80, 0)');
        cx.fillStyle = wpg; cx.fillRect(wpx - wpr, wpy - wpr, wpr * 2, wpr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [4, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88 });
  }

  // ---------- VICTORIAN GAS LAMP ----------
  // Cast-iron stepped base, fluted shaft, mid-band, ladder rest,
  // capital, 4-sided emissive glass lantern, pyramidal cap,
  // crown finial, point light, halo + inner-core sprites.
  // Adds the lamp group to `parent` at (x, 0, z). Returns the
  // group (with `.userData.light` set to the PointLight).
  //
  // opts:
  //   intensity:   point-light intensity (default 0.5)
  //   distance:    point-light range (default 10)
  //   lampColor:   point-light + glow colour (default 0xffd6a0)
  //   haloScale:   outer halo sprite size (default 2.2)
  //   coreScale:   inner-core sprite size (default 0.9)
  //   paneColor:   solid emissive pane colour (default 0xfff0c8)
  function createVictorianGasLamp(parent, x, z, opts) {
    opts = opts || {};
    var lampColor = opts.lampColor || 0xffd6a0;
    var paneColor = opts.paneColor || 0xfff0c8;
    var g = new THREE.Group();
    var castIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.78, metalness: 0.22 });
    var darkIron = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.7, metalness: 0.3 });
    var brassish = new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.35 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m;
    }
    // Stepped base
    place(new THREE.CylinderGeometry(0.24, 0.28, 0.10, 16), castIron, 0, 0.05, 0);
    place(new THREE.CylinderGeometry(0.20, 0.24, 0.18, 16), castIron, 0, 0.19, 0);
    place(new THREE.CylinderGeometry(0.17, 0.20, 0.05, 16), darkIron, 0, 0.31, 0);
    place(new THREE.BoxGeometry(0.32, 0.32, 0.32), castIron, 0, 0.50, 0);
    place(new THREE.CylinderGeometry(0.11, 0.16, 0.06, 16), darkIron, 0, 0.69, 0);
    // Shaft
    place(new THREE.CylinderGeometry(0.058, 0.10, 3.9, 16), castIron, 0, 2.65, 0);
    // Mid-band
    place(new THREE.CylinderGeometry(0.082, 0.082, 0.06, 16), darkIron, 0, 1.55, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.58, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.52, 0);
    // Ladder rest
    place(new THREE.BoxGeometry(0.52, 0.018, 0.018), castIron, 0, 4.45, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.52), castIron, 0, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron,  0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, -0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45,  0.26);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45, -0.26);
    // Capital
    place(new THREE.CylinderGeometry(0.085, 0.062, 0.08, 16), castIron, 0, 4.66, 0);
    place(new THREE.CylinderGeometry(0.105, 0.085, 0.04, 16), darkIron, 0, 4.72, 0);
    place(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12), castIron, 0, 4.81, 0);
    // Lantern base + 4 emissive panes
    place(new THREE.BoxGeometry(0.34, 0.04, 0.34), darkIron, 0, 4.91, 0);
    var paneMat = new THREE.MeshBasicMaterial({ color: paneColor });
    var paneF = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneF.position.set(0, 5.16, 0.134); g.add(paneF);
    var paneB = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneB.position.set(0, 5.16, -0.134); paneB.rotation.y = Math.PI; g.add(paneB);
    var paneL = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneL.position.set(-0.134, 5.16, 0); paneL.rotation.y = Math.PI / 2; g.add(paneL);
    var paneR = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneR.position.set(0.134, 5.16, 0); paneR.rotation.y = -Math.PI / 2; g.add(paneR);
    // Corner posts + cross-bars
    var corners = [[0.135, 0.135], [-0.135, 0.135], [0.135, -0.135], [-0.135, -0.135]];
    for (var cp = 0; cp < 4; cp++) {
      place(new THREE.BoxGeometry(0.028, 0.44, 0.028), darkIron, corners[cp][0], 5.16, corners[cp][1]);
    }

// (1) never clamp x/y separately (the pool becomes a rounded rectangle);
// (2) the kerb-side and road-side limits must BLEND smoothly around the
// flanks (an abrupt switch reads as bevelled corners);
// (3) the boundary itself must be ragged at several scales, else water
// piling against it forms a clean arc that foreshortens into a slab edge;
// (4) kerb-ward the water must ARRIVE (hard min) and merge with the kerb

// it exactly cancelled the sine falloff and the pool's upper edge became

    for (var pb2 = 0; pb2 < 8; pb2++) {

      var pbx = w * 0.13 + pb2 * w * 0.095;
      cx2.fillRect(pbx, h * 0.34, w * 0.038, h * 0.1);
      cx2.fillRect(pbx + w * 0.012, h * 0.31, w * 0.015, h * 0.035);

    cx2.fillStyle = 'rgba(55, 35, 14, 0.9)';
    cx2.fillRect(w * 0.08, h * 0.44, w * 0.84, h * 0.018);
    // Bar counter with brass rail

    cx2.fillRect(0, h * 0.56, w, h * 0.05);
    cx2.fillStyle = 'rgba(200, 165, 80, 0.5)';
    cx2.fillRect(0, h * 0.555, w, h * 0.008);
    // Pump handles on the counter
    for (var ph2 = 0; ph2 < 3; ph2++) {

      cx2.fillRect(w * (0.25 + ph2 * 0.2 + seed * 0.05), h * 0.48, 4, h * 0.08);

    }
    // Drinkers at the bar — dark head-and-shoulder silhouettes

      var fgx = w * (0.22 + fg2 * 0.42 + seed * 0.1);

      cx2.beginPath();
      cx2.ellipse(fgx, h * 0.76, w * 0.11, h * 0.13, 0, Math.PI, 0, true);
      cx2.fill();
      cx2.fillRect(fgx - w * 0.11, h * 0.76, w * 0.22, h * 0.24);
      // A raised glass for the first

        cx2.fillRect(fgx + w * 0.12, h * 0.62, w * 0.035, h * 0.06);

    cx2.fillStyle = 'rgba(235, 230, 215, 0.32)';

function createWindowBay(cx, bayW, bayH, yBase) {
  var glassH = bayH - 0.5; // glass area (above kickboard)
  var glassY = yBase + 0.25 + glassH / 2;
  var kickY = yBase + 0.17;

  // The lit interior, painted — with a faint warm glaze over it
  var bayGlass = new THREE.Mesh(new THREE.PlaneGeometry(bayW - 0.12, glassH),
    new THREE.MeshBasicMaterial({ map: makePillarsInteriorTex(((cx * 7.7 + 11) % 10) / 10) }));
  bayGlass.position.set(cx, glassY, 0.63);
  pub.add(bayGlass);
  var bayGlaze = new THREE.Mesh(new THREE.PlaneGeometry(bayW - 0.12, glassH),
    new THREE.MeshBasicMaterial({ color: 0xffd699, transparent: true, opacity: 0.16 }));
  bayGlaze.position.set(cx, glassY, 0.645);
  pub.add(bayGlaze);

  // Outer frame (mahogany surround)
  placeMesh(pub, new THREE.BoxGeometry(0.06, bayH, 0.08), mahogany, cx - bayW/2, yBase + bayH/2, 0.62);
  placeMesh(pub, new THREE.BoxGeometry(0.06, bayH, 0.08), mahogany, cx + bayW/2, yBase + bayH/2, 0.62);
  placeMesh(pub, new THREE.BoxGeometry(bayW + 0.06, 0.06, 0.08), mahogany, cx, yBase + bayH, 0.62);
  placeMesh(pub, new THREE.BoxGeometry(bayW + 0.06, 0.06, 0.08), mahogany, cx, yBase + 0.5, 0.62);

  // Vertical glazing bars (dividing bay into 3 panes)
  var paneW = bayW / 3;
  placeMesh(pub, new THREE.BoxGeometry(0.03, glassH, 0.04), mahogany, cx - paneW / 2 - paneW / 6, glassY, 0.66);
  placeMesh(pub, new THREE.BoxGeometry(0.03, glassH, 0.04), mahogany, cx + paneW / 2 + paneW / 6, glassY, 0.66);

  // Horizontal glazing bars (2 rows for traditional 3×3 grid effect)
  var thirdH = glassH / 3;
  placeMesh(pub, new THREE.BoxGeometry(bayW - 0.12, 0.03, 0.04), mahogany, cx, glassY - thirdH / 2, 0.66);
  placeMesh(pub, new THREE.BoxGeometry(bayW - 0.12, 0.03, 0.04), mahogany, cx, glassY + thirdH / 2, 0.66);

  // Solid kickboard panel below glass
  placeMesh(pub, new THREE.BoxGeometry(bayW - 0.08, 0.4, 0.06), mahoganyDark, cx, kickY, 0.62);
  // Kickboard moulding
  placeMesh(pub, new THREE.BoxGeometry(bayW - 0.04, 0.04, 0.04), mahogany, cx, yBase + 0.38, 0.64);
}

function makeSilhouetteTex(seed) {
  return makeCanvasTexture(256, 256, function(cx, w, h) {
    // Warm amber interior glow background
    var bg = cx.createRadialGradient(w/2, h * 0.4, 10, w/2, h * 0.5, w);
    bg.addColorStop(0, 'rgba(200, 140, 50, 0.5)');
    bg.addColorStop(0.5, 'rgba(160, 100, 30, 0.3)');
    bg.addColorStop(1, 'rgba(80, 50, 15, 0.15)');
    cx.fillStyle = bg;
    cx.fillRect(0, 0, w, h);

    var figureCount = 1 + Math.floor(seed * 2.5);
    for (var f = 0; f < figureCount; f++) {
      var fx = (w / (figureCount + 1)) * (f + 1);
      var baseY = h * 0.98;
      var headR = 14 + seed * 6;
      var shoulderW = 35 + seed * 15;

      cx.fillStyle = 'rgba(10, 5, 0, 0.85)';

      // Body
      cx.beginPath();
      cx.moveTo(fx - shoulderW / 2, baseY - h * 0.35);
      cx.lineTo(fx + shoulderW / 2, baseY - h * 0.35);
      cx.lineTo(fx + shoulderW / 2 + 8, baseY);
      cx.lineTo(fx - shoulderW / 2 - 8, baseY);
      cx.closePath();
      cx.fill();

      // Shoulders
      cx.beginPath();
      cx.ellipse(fx, baseY - h * 0.38, shoulderW / 2 + 5, 14, 0, 0, Math.PI, true);
      cx.fill();

      // Neck
      cx.fillRect(fx - 6, baseY - h * 0.48, 12, h * 0.1);

      // Head
      cx.beginPath();
      cx.arc(fx + (f - 1) * 4, baseY - h * 0.52, headR, 0, Math.PI * 2);
      cx.fill();

      // Raised arm with pint
      if ((seed > 0.4 && f === 0) || (seed > 0.6 && f === 1)) {
        cx.fillStyle = 'rgba(10, 5, 0, 0.8)';
        cx.beginPath();
        cx.moveTo(fx + shoulderW / 2, baseY - h * 0.38);
        cx.lineTo(fx + shoulderW / 2 + 12, baseY - h * 0.6);
        cx.lineTo(fx + shoulderW / 2 + 22, baseY - h * 0.6);
        cx.lineTo(fx + shoulderW / 2 + 10, baseY - h * 0.35);
        cx.closePath();
        cx.fill();
        cx.fillRect(fx + shoulderW / 2 + 8, baseY - h * 0.7, 16, 22);
        cx.fillStyle = 'rgba(180, 130, 40, 0.4)';
        cx.fillRect(fx + shoulderW / 2 + 10, baseY - h * 0.68, 12, 14);
      }
    }
  });
}

var clock = new THREE.Clock();

function phAnimate() {
  phAnimId = requestAnimationFrame(phAnimate);
  var t = phStill ? 14 : clock.getElapsedTime();
  phThisT = t; t = t + phCarryT;

  // Fog drift (held still under reduced motion)
  for (var i = 0; i < (phStill ? 0 : fogSprites.length); i++) {
    var f = fogSprites[i];
    f.sway += f.swaySpeed;
    f.sprite.position.x = f.baseX + Math.sin(f.sway) * f.swayAmt;
    f.baseX += f.drift;
    // Wrap fog that drifts too far
    if (f.baseX > 25) f.baseX = -25;
  }

  // Flickering pub lights
  for (var i = 0; i < lampLightsOnPub.length; i++) {
    var ll = lampLightsOnPub[i];
    if (ll.userData.dead) { ll.intensity = 0; continue; }
    ll.intensity = ll.userData.baseIntensity + Math.sin(t * 3 + i) * 0.08 + Math.sin(t * 7.3 + i * 2) * 0.04;
  }

  // Street lamp flicker (dual-frequency for naturalistic gas flicker)
  for (var i = 0; i < streetLampLights.length; i++) {
    if (streetLampLights[i].userData.dead) { streetLampLights[i].intensity = 0; continue; }
    var base = streetLampLights[i].userData.baseIntensity || 3;
    streetLampLights[i].intensity = base + Math.sin(t * 2.5 + i * 1.5) * 0.15 + Math.sin(t * 5.7 + i * 3) * 0.08;
  }

  // Pub interior glow pulse
  pubGlow.intensity = 1.2 + Math.sin(t * 1.5) * 0.18;
  pubGlow2.intensity = 0.6 + Math.sin(t * 1.8 + 0.5) * 0.1;
  pubGlow3.intensity = 0.35 + Math.sin(t * 2.0 + 1.0) * 0.06;
  doorLight.intensity = 0.8 + Math.sin(t * 2.2) * 0.12;
  pavementSpill.intensity = 0.3 + Math.sin(t * 1.2) * 0.05;
  phSheen.material.opacity = 0.095 + Math.sin(t * 1.5) * 0.02 + Math.sin(t * 3.7 + 1) * 0.008;

  // The flood — two sources only: the blocked drain in the road, and the
  // passage. The storm is coming; Carthage is close behind it.
  var flP = Math.min(1, t / 20);
  flP = flP * flP * (3 - 2 * flP);
  // Main spread over 20s as before, then a permanent slow creep (log) —
  // the flood never finishes, it just stops hurrying
  // Growth is LINEAR and endless — the boundaries in phSpreadVerts are
  // what slow it down, so it presses harder forever rather than stopping
  var flG = 0.15 + flP * 3.55 + 0.035 * Math.max(0, t - 18);
  phSpreadVerts(phFlood, flG, t, 0, 3.15);
  phSpreadVerts(phFloodDamp, flG * 1.18, t, 2.1, 3.35);
  phFlood.material.opacity = 0.55 + flP * 0.22 + Math.sin(t * 2.6) * 0.04;
  // The deep core: SMALL, ROUND, and capped. It is the source puddle, not
  // a sheet — the moment it elongates or keeps growing, its smooth scaled
  // edge becomes a dark straight line at the grate (that exact bug shipped
  // and was caught by Dr Quill; the big vertex-driven pool alone does the
  // spreading).
  var dpP = Math.min(1, t / 8);
  dpP = dpP * dpP * (3 - 2 * dpP);
  var dpR = (0.2 + dpP * 0.72) * (1 + 0.045 * Math.sin(t * 1.3) + 0.03 * Math.sin(t * 2.9));
  phDeepPool.scale.set(dpR * 1.12, dpR, 1);
  phDeepPool.material.opacity = 0.42 + dpP * 0.28;
  var crownAmp = 1 + 0.6 * Math.min(Math.max(phVisit - 1, 0), 5);
  var crownPulse = 1 + 0.13 * crownAmp * Math.sin(t * 5.1) + 0.06 * crownAmp * Math.sin(t * 8.7);
  phCrown.scale.set(0.46 * crownPulse, 0.64 * crownPulse, 1);
  phCrown.material.opacity = 0.5 + 0.22 * Math.min(1, t / 4) + 0.12 * Math.sin(t * 5.1);
  phCrown.material.emissiveIntensity = 0.22 + 0.2 * crownAmp * (0.5 + 0.5 * Math.sin(t * 5.1));

  // Water from the passage: advances INSIDE the alley from the dark,
  // reaches the mouth, then fans out across the pavement with a rounded
  // front and a second pool spreads in the gutter
  var aiP = Math.min(1, t / 7);
  aiP = aiP * aiP * (3 - 2 * aiP);
  var aiLen = aiP * 3.5;
  if (aiLen > 0.02) {
    phAlleyInner.scale.set(0.9 + aiP * 0.9 + Math.sin(t * 2.1) * 0.03, aiLen, 1);
    phAlleyInner.position.z = -3 + aiLen / 2;
    phAlleyInner.material.opacity = 0.45 + aiP * 0.25 + Math.sin(t * 3.1) * 0.05;
  }
  var alP = Math.max(0, Math.min(1, (t - 5) / 14));
  alP = alP * alP * (3 - 2 * alP);
  var alLen = alP * 2.9 + 0.5 * Math.tanh(Math.max(0, t - 19) / 70);
  if (alLen > 0.02) {
    phAlleyStream.scale.set(0.7 + alP * 1.0 + Math.sin(t * 1.9) * 0.03, alLen, 1);
    phAlleyStream.material.opacity = 0.5 + alP * 0.2 + Math.sin(t * 2.9) * 0.04;
  }
  var agP = Math.max(0, Math.min(1, (t - 9) / 18));
  agP = agP * agP * (3 - 2 * agP);
  var agR = agP * 2.1 + 2.6 * Math.tanh(Math.max(0, t - 27) / 110);
  if (agR > 0.02) {
    phAlleyPool.scale.set(agR * 1.1, agR, 1);
    phAlleyPool.material.opacity = 0.5 + agP * 0.2 + Math.sin(t * 2.3 + 1) * 0.04;
  }
  // Over the kerb: the pavement sheet, fed from the road pool. Waits for
  // the road to actually look full (the pool needs ~2.5 min to press the
  // kerb along its length) — the pavement must never flood first.
  var pvT = Math.max(0, t - 150);
  if (pvT > 0) {
    var pvLen = 2.95 * Math.tanh(pvT / 160);
    phPaveFlood.scale.set(1.2 + pvLen * 0.9 + Math.sin(t * 1.7) * 0.03, pvLen, 1);
    phPaveFlood.material.opacity = 0.45 + Math.min(0.25, pvT * 0.006) + Math.sin(t * 2.4) * 0.04;
  }

  // Visit 2+: ripples working off the drain
  if (phVisit >= 2) {
    for (var phri2 = 0; phri2 < phRip.length; phri2++) {
      var rpP = ((t * (phVisit >= 3 ? 0.38 : 0.28) + phri2 * 0.5) % 1);
      var rpS = (0.35 + rpP * 1.5) * dpR;
      phRip[phri2].scale.set(rpS * 1.12, rpS, 1);
      phRip[phri2].material.opacity = (phVisit >= 3 ? 0.32 : 0.22) * (1 - rpP);
    }
  }

  // Visit 2+: the chop — churning surface patches, more and wilder each visit
  if (phVisit >= 2) {
    var chopN = Math.min(4 * (phVisit - 1), 12);
    var chopAmp = 0.5 + 0.5 * Math.min(phVisit - 1, 5);
    for (var pci2 = 0; pci2 < phChop.length; pci2++) {
      var pc = phChop[pci2];
      if (pci2 >= chopN) { pc.material.opacity = 0; continue; }
      var pcT = t * pc.userData.sp + pc.userData.ph;
      var pcR = 0.25 + 0.55 * ((pci2 * 0.618) % 1);
      var pcA = pc.userData.ph + t * 0.15 * (pci2 % 2 ? 1 : -1);
      var pcX = 2.2 + Math.cos(pcA) * pcR * flG * 0.5 + pc.userData.ox;
      var pcZ = 6.4 - Math.sin(pcA) * pcR * Math.min(flG * 0.25, 2.0) - pc.userData.oz;
      pc.position.set(pcX, 0.023, pcZ);
      var pcS = (0.3 + 0.25 * Math.abs(Math.sin(pcT))) * (0.7 + 0.3 * chopAmp);
      pc.scale.set(pcS * 1.4, pcS, 1);
      pc.material.opacity = (0.1 + 0.14 * Math.abs(Math.sin(pcT * 1.3))) * chopAmp;
      pc.material.emissiveIntensity = 0.15 * chopAmp * Math.abs(Math.sin(pcT));
    }
  }

  // Visit 3+: the storm arrives — double-strike lightning, silvered water
  if (phVisit >= 3) {
    if (t > phBoltNext) {
      phBoltT = t;
      phBoltNext = t + Math.max(4.5, 8 - (phVisit - 3) * 1.5) + Math.random() * 9;
      if (window.dssAudio && window.dssAudio.thunderClap) setTimeout(function(){ if (window.dssAudio) window.dssAudio.thunderClap(); }, 900 + Math.random() * 1200);
    }
    var phbAge = t - phBoltT;
    var phbI = 0;
    if (phbAge >= 0 && phbAge < 0.6) {
      phbI = Math.max(0, Math.sin(Math.min(phbAge * 22, Math.PI))) * 0.9;
      if (phbAge > 0.2 && phbAge < 0.46) phbI = Math.max(phbI, Math.sin((phbAge - 0.2) * 12) * 1.0);
    }
    phLightning.intensity = phbI * 2.2;
    for (var phwi2 = 0; phwi2 < phWaterMats.length; phwi2++) { if (phWaterMats[phwi2].emissive) phWaterMats[phwi2].emissiveIntensity = phbI * 0.9; }
    if (phFogBase) scene.fog.color.copy(phFogBase).lerp(phFlashCol, phbI * 0.9);
    if (phBgBase) scene.background.copy(phBgBase).lerp(phFlashCol, phbI * 0.9);
  }

  // Silhouette sway
  for (var i = 0; i < silhouettes.length; i++) {
    var s = silhouettes[i];
    s.mesh.position.x = s.baseX + Math.sin(t * s.swaySpeed + s.swayPhase) * s.swayAmt;
  }

  // Hanging sign: pendulum swing + slow wind-twist about its bracket
  signPivot.rotation.z = Math.sin(t * 0.9) * 0.045;
  signPivot.rotation.y = 1.05 + Math.sin(t * 0.31) * 0.16 + Math.sin(t * 0.73) * 0.05;

  // Alley light flicker (subtle, eerie)
  alleyLight.intensity = 0.25 + Math.sin(t * 1.8) * 0.05 + Math.sin(t * 4.1) * 0.03;
  alleyLight2.intensity = 0.15 + Math.sin(t * 2.5 + 1) * 0.03;
  alleyEndGlow.intensity = 1.2 + Math.sin(t * 0.8) * 0.15;
  alleyEndGlow2.intensity = 0.6 + Math.sin(t * 1.1 + 0.5) * 0.08;

  if (typeof dssComposerLocal !== 'undefined' && dssComposerLocal) { dssComposerLocal.render(); } else { renderer.render(scene, camera); }
}
// ---- ENTRY BUTTON ----
var phBtn = document.createElement('div');
phBtn.textContent = 'GO TO THE PILLARS';
phBtn.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:14px min(36px, 8vw);white-space:nowrap;max-width:calc(100vw - 16px);box-sizing:border-box;font:16px "Courier New",monospace;color:rgba(200,170,100,0.85);border:1px solid rgba(200,170,100,0.3);letter-spacing:min(4px, 0.9vw);cursor:pointer;z-index:9004;background:transparent;opacity:0;transition:opacity 2s ease;';
// Show button after delay
setTimeout(function() { phBtn.style.opacity = '1'; }, 2500);
// Hover effects
phBtn.addEventListener('mouseenter', function() {
phBtn.style.color = 'rgba(230,200,120,0.95)';
phBtn.style.borderColor = 'rgba(200,170,100,0.6)';
});
phBtn.addEventListener('mouseleave', function() {
phBtn.style.color = 'rgba(200,170,100,0.85)';
phBtn.style.borderColor = 'rgba(200,170,100,0.3)';
});
// Click handler - fade out and navigate
phBtn.addEventListener('click', function() {
phWrap.style.transition = 'opacity 1.5s ease';
phWrap.style.opacity = '0';
setTimeout(function() {
if (phAnimId) cancelAnimationFrame(phAnimId);
phAnimId = null;
if (phWrap.parentNode) phWrap.parentNode.removeChild(phWrap);
// Navigate to target passage
var TARGET = 'Entering The Pillars of Hercules';
if (window.Engine && Engine.go) { Engine.go(TARGET); }
else {
var links = document.querySelectorAll('tw-link, .enchantment-link');
for (var i = 0; i < links.length; i++) {
if (links[i].textContent.trim() === '·') { links[i].click(); break; }
}
}
}, 1500);
});
phWrap.appendChild(phBtn);

document.body.appendChild(phWrap);
phAnimate();
}

// Watch for ph-container
setInterval(function() {
var container = document.getElementById('ph-container');
if (container && !phActive) {
initPillars();
} else if (!container) {
phActive = false;
phLeftAt = Date.now(); phCarryT += phThisT; phThisT = 0;
if (phAnimId) { cancelAnimationFrame(phAnimId); phAnimId = null; }
window._dssDisposeWrap('ph-wrap');
}
}, 300);
})();
