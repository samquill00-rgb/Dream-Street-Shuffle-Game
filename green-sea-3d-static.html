<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Green Sea — Carthage Coast, Tunisia</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
#datestamp {
  position: absolute; top: 18px; right: 24px;
  font: 14px monospace; color: rgba(255,140,50,0.55);
  pointer-events: none;
}
#location {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font: 12px 'Courier New', monospace; color: rgba(231,212,184,0.68);
  text-shadow: 0 1px 6px #302a39; z-index: 5; white-space: nowrap;
  letter-spacing: 2px; pointer-events: none;
}
</style>
</head>
<body>
<div id="location">CARTHAGE COAST, TUNISIA</div>
<script src="vendor/three/three.min.js"></script>
<!-- Cinematic post pipeline (bloom composer). Shaders must load before the
     passes that reference them. If any fail (offline), the scene falls back
     to the plain renderer via the guard where the composer is built. -->
<script src="vendor/three/shaders/CopyShader.js"></script>
<script src="vendor/three/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/three/postprocessing/EffectComposer.js"></script>
<script src="vendor/three/postprocessing/RenderPass.js"></script>
<script src="vendor/three/postprocessing/ShaderPass.js"></script>
<script src="vendor/three/postprocessing/UnrealBloomPass.js"></script>
<script>
// ============================================================
// SCENE SETUP — painted Mediterranean dusk
// ============================================================
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1440); /* 2026-10-23 (Sam): the same hour of dusk as the rest of Carthage, violet and wine over a molten horizon */
scene.fog = new THREE.Fog(0x7a4a6a, 24, 65);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
function frameCourtyard() {
  // Keep the door, roofline and furniture together on narrow screens too.
  camera.position.set(0, 3.6, Math.min(20.5, Math.max(15.5, 8.0 / camera.aspect)));
  camera.lookAt(0, 3.9, 0);
}
frameCourtyard();

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping || THREE.LinearToneMapping;
renderer.toneMappingExposure = 0.98;
document.body.appendChild(renderer.domElement);


// Bloom composer + film grade — same recipe as the in-game scenes.
// Composited at CSS resolution deliberately (retina through the passes
// quadruples GPU cost). Threshold 0.8 keeps broad skies out of the bloom
// so only genuine point sources halo.
// No bloom composer here, deliberately: the Green Sea is a bright pastel
// scene where half the frame sits above any usable bloom threshold, so even
// gentle bloom (verified at strength 0.14 / threshold 0.93) veils the whole
// facade in milk. The film grade below is the only treatment that suits it.
var composer = null;
(function() {
  var fgV = document.createElement('div');
  fgV.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:3;' +
    'background:radial-gradient(ellipse at 50% 44%, transparent 56%, rgba(10,6,4,0.10) 82%, rgba(8,4,2,0.24) 100%);';
  document.body.appendChild(fgV);
  var fgC = document.createElement('canvas'); fgC.width = 128; fgC.height = 128;
  var fgX = fgC.getContext('2d'); var fgD = fgX.createImageData(128, 128);
  for (var fgI = 0; fgI < fgD.data.length; fgI += 4) {
    var fgVal = 118 + Math.floor(Math.random() * 20);
    fgD.data[fgI] = fgD.data[fgI + 1] = fgD.data[fgI + 2] = fgVal;
    fgD.data[fgI + 3] = 255;
  }
  fgX.putImageData(fgD, 0, 0);
  var fgG = document.createElement('div');
  fgG.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:4;' +
    'background:url(' + fgC.toDataURL() + ');opacity:0.025;mix-blend-mode:overlay;';
  document.body.appendChild(fgG);
})();
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  frameCourtyard();
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// MATERIALS — worn, sandy, sun-bleached
// ============================================================
function makeSeawornTex(base, pale, dampAlpha) {
  var c = document.createElement('canvas'); c.width = 512; c.height = 512;
  var cx = c.getContext('2d');
  cx.fillStyle = base; cx.fillRect(0, 0, 512, 512);
  for (var m = 0; m < 46; m++) {
    var mg = cx.createRadialGradient(Math.random()*512, Math.random()*512, 0, Math.random()*512, Math.random()*512, 20 + Math.random()*70);
    mg.addColorStop(0, 'rgba(120,104,74,' + (0.04 + Math.random()*0.09).toFixed(2) + ')');
    mg.addColorStop(1, 'rgba(120,104,74,0)');
    cx.fillStyle = mg; cx.fillRect(0, 0, 512, 512);
  }
  for (var fp = 0; fp < 14; fp++) {
    var fx = Math.random()*512, fy = Math.random()*512, fw = 24 + Math.random()*70, fh = 18 + Math.random()*50;
    cx.fillStyle = pale;
    cx.beginPath();
    cx.moveTo(fx, fy);
    for (var fv = 0; fv < 7; fv++) { cx.lineTo(fx + Math.random()*fw, fy + Math.random()*fh); }
    cx.closePath(); cx.fill();
    cx.strokeStyle = 'rgba(96,82,58,0.35)'; cx.lineWidth = 1.4; cx.stroke();
  }
  for (var sb = 0; sb < 18; sb++) {
    var sg = cx.createRadialGradient(Math.random()*512, 300 + Math.random()*212, 0, Math.random()*512, 300 + Math.random()*212, 16 + Math.random()*40);
    sg.addColorStop(0, 'rgba(240,238,226,' + (0.1 + Math.random()*0.16).toFixed(2) + ')');
    sg.addColorStop(1, 'rgba(240,238,226,0)');
    cx.fillStyle = sg; cx.fillRect(0, 0, 512, 512);
  }
  for (var cr2 = 0; cr2 < 9; cr2++) {
    cx.strokeStyle = 'rgba(90,76,54,0.4)'; cx.lineWidth = 1;
    cx.beginPath(); var crx = Math.random()*512, cry = Math.random()*300;
    cx.moveTo(crx, cry);
    for (var cs2 = 0; cs2 < 5; cs2++) { crx += (Math.random()-0.5)*36; cry += 20 + Math.random()*40; cx.lineTo(crx, cry); }
    cx.stroke();
  }
  var dg2 = cx.createLinearGradient(0, 388, 0, 512);
  dg2.addColorStop(0, 'rgba(96,96,66,0)'); dg2.addColorStop(1, 'rgba(88,92,60,' + dampAlpha + ')');
  cx.fillStyle = dg2; cx.fillRect(0, 388, 512, 124);
  var tx = new THREE.CanvasTexture(c);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(2.4, 1.5);
  tx.minFilter = THREE.LinearFilter;
  return tx;
}
var sandWall = new THREE.MeshStandardMaterial({ map: makeSeawornTex('#c8b890', 'rgba(222,212,186,0.85)', '0.42'), roughness: 0.95 });
var cream = new THREE.MeshStandardMaterial({ map: makeSeawornTex('#d8ccb0', 'rgba(236,228,204,0.85)', '0.3'), roughness: 0.92 });
var blueDoor = new THREE.MeshStandardMaterial({ color: 0x3a8ab0, roughness: 0.7, metalness: 0.1 });
var blueDoorDark = new THREE.MeshStandardMaterial({ color: 0x2a6a88, roughness: 0.75, metalness: 0.15 });
var blueDoorLight = new THREE.MeshStandardMaterial({ color: 0x5599bb, roughness: 0.65, metalness: 0.08 });
var blueIron = new THREE.MeshStandardMaterial({ color: 0x4488aa, roughness: 0.6, metalness: 0.25 });
var whiteTile = new THREE.MeshStandardMaterial({ color: 0xe0d8c8, roughness: 0.75 });
var blueTile = new THREE.MeshStandardMaterial({ color: 0x2a5588, roughness: 0.7 });
var sandGround = (function(){
  var c = document.createElement('canvas'); c.width = 512; c.height = 512;
  var cx = c.getContext('2d');
  cx.fillStyle = '#b89868'; cx.fillRect(0, 0, 512, 512);
  for (var gp = 0; gp < 60; gp++) {
    var gg = cx.createRadialGradient(Math.random()*512, Math.random()*512, 0, Math.random()*512, Math.random()*512, 18 + Math.random()*56);
    var dark = Math.random() < 0.55;
    gg.addColorStop(0, dark ? 'rgba(120,96,60,' + (0.08 + Math.random()*0.14).toFixed(2) + ')' : 'rgba(230,222,198,' + (0.08 + Math.random()*0.12).toFixed(2) + ')');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gg; cx.fillRect(0, 0, 512, 512);
  }
  cx.strokeStyle = 'rgba(130,106,66,0.4)'; cx.lineWidth = 1.6;
  for (var gl = 0; gl < 14; gl++) {
    cx.beginPath(); var glx = Math.random()*512, gly = Math.random()*512;
    cx.moveTo(glx, gly);
    for (var gs2 = 0; gs2 < 4; gs2++) { glx += (Math.random()-0.5)*100; gly += (Math.random()-0.5)*100; cx.lineTo(glx, gly); }
    cx.stroke();
  }
  for (var gr2 = 0; gr2 < 200; gr2++) {
    cx.fillStyle = 'rgba(90,74,46,' + (0.14 + Math.random()*0.22).toFixed(2) + ')';
    cx.fillRect(Math.random()*512, Math.random()*512, 1.5 + Math.random()*3, 1.5 + Math.random()*3);
  }
  var tx = new THREE.CanvasTexture(c);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(9, 9);
  tx.minFilter = THREE.LinearFilter;
  return new THREE.MeshStandardMaterial({ map: tx, roughness: 0.96 });
})();

// ============================================================
// HELPERS
// ============================================================
function makeCanvasTexture(w, h, drawFunc) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var cx = c.getContext('2d');
  drawFunc(cx, w, h);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

function placeMesh(group, geo, mat, x, y, z) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  group.add(m);
  return m;
}

// ============================================================
// GROUND — dusty North African street
// ============================================================
scene.background = makeCanvasTexture(1024,1024,function(cx,w,h) {
  var sky=cx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#1c0a3a'); sky.addColorStop(0.45,'#4a1a5a'); sky.addColorStop(0.75,'#9a3a62'); sky.addColorStop(1,'#e8704a');
  cx.fillStyle=sky; cx.fillRect(0,0,w,h);
  // 2026-10-23 (Sam: "add some stars to the sky and generally more atmosphere"): a faint dust of stars in the upper sky,
  // thinning into the glow; the brighter twinkling ones are the starField points further down
  for (var si = 0; si < 900; si++) {
    var sy = Math.pow(Math.random(), 1.8) * h * 0.55, sx = Math.random() * w;
    var sa = (0.12 + Math.random() * 0.4) * (1 - sy / (h * 0.55));
    cx.fillStyle = 'rgba(' + (225 + Math.floor(Math.random() * 30)) + ',' + (215 + Math.floor(Math.random() * 30)) + ',255,' + sa.toFixed(2) + ')';
    cx.fillRect(sx, sy, Math.random() < 0.15 ? 2 : 1, 1);
  }
});
var ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), sandGround);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Sand texture overlay
var sandOverlayTex = makeCanvasTexture(256, 256, function(cx, w, h) {
  cx.fillStyle = 'rgba(180, 150, 100, 0.1)';
  cx.fillRect(0, 0, w, h);
  for (var i = 0; i < 500; i++) {
    var g = 140 + Math.random() * 80;
    cx.fillStyle = 'rgba(' + g + ',' + (g - 20) + ',' + (g - 50) + ', 0.06)';
    cx.beginPath();
    cx.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 4, 0, Math.PI * 2);
    cx.fill();
  }
});

// ============================================================
// THE GREEN SEA BAR — MAIN BUILDING (human scale)
// ============================================================
var bar = new THREE.Group();

// ---- MAIN WALL ----
var mainWall = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 5), sandWall);
mainWall.position.set(0, 4, -2.5);
bar.add(mainWall);

// Broad plaster washes, like the game's painted scenery: wear without visual grit.
var facadeTex = makeCanvasTexture(512, 512, function(cx, w, h) {
  cx.fillStyle = '#c9bca6'; cx.fillRect(0, 0, w, h);
  for (var i = 0; i < 28; i++) {
    var x = Math.random()*w, y = Math.random()*h, r = 35 + Math.random()*90;
    var wash = cx.createRadialGradient(x,y,0,x,y,r);
    wash.addColorStop(0, i % 2 ? 'rgba(239,222,192,0.22)' : 'rgba(119,109,128,0.12)');
    wash.addColorStop(1, 'rgba(180,163,150,0)');
    cx.fillStyle = wash; cx.fillRect(x-r,y-r,r*2,r*2);
  }
  var foot = cx.createLinearGradient(0,h*0.68,0,h);
  foot.addColorStop(0,'rgba(73,89,86,0)');
  foot.addColorStop(1,'rgba(73,89,86,0.22)');
  cx.fillStyle = foot; cx.fillRect(0,0,w,h);
  // A few salt-worn edges; leave the middle quiet around the door and sign.
  for (var i = 0; i < 12; i++) {
    var x = Math.random()<0.5 ? Math.random()*90 : w-90+Math.random()*90;
    var y = Math.random()*h;
    cx.fillStyle='rgba(236,219,190,0.3)';
    cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+12,y-2);
    cx.lineTo(x+20,y+7); cx.lineTo(x+5,y+12); cx.fill();
  }
});
var facadeFace = new THREE.Mesh(new THREE.PlaneGeometry(12, 8),
  new THREE.MeshStandardMaterial({ map: facadeTex, roughness: 0.94 }));
facadeFace.position.set(0, 4, 0.02);
bar.add(facadeFace);

// ---- ROOFTOP BALUSTRADE ----
var balustradeMat = new THREE.MeshStandardMaterial({ color: 0xd0c4a0, roughness: 0.88 });
placeMesh(bar, new THREE.BoxGeometry(12.5, 0.2, 0.3), balustradeMat, 0, 8.1, 0.1);
placeMesh(bar, new THREE.BoxGeometry(12.5, 0.15, 0.25), balustradeMat, 0, 9.3, 0.1);
for (var bi = -5.5; bi <= 5.5; bi += 0.55) {
  var baluster = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0, 6), balustradeMat);
  baluster.position.set(bi, 8.7, 0.1);
  bar.add(baluster);
}

// ---- TUNISIAN HORSESHOE ARCH DOOR ----
var doorW = 2.8;
var doorRectH = 2.4;    // rectangular portion height
var doorBottom = 0.35;
var doorCentre = 0;
var archRadius = doorW / 2;  // horseshoe arch radius
var archCentreY = doorBottom + doorRectH;  // where the arch springs from
var doorTopY = archCentreY + archRadius;   // top of arch

// Materials
var greenDoor = new THREE.MeshStandardMaterial({ color: 0x176f65, roughness: 0.7, metalness: 0.05 });
var greenDoorDark = new THREE.MeshStandardMaterial({ color: 0x174c48, roughness: 0.75, metalness: 0.08 });
var carvedStone = new THREE.MeshStandardMaterial({ color: 0xd5c4a9, roughness: 0.82 });
var carvedStoneDark = new THREE.MeshStandardMaterial({ color: 0x9e8a77, roughness: 0.85 });
var blackIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.35 });

// ---- CARVED STONE FRAME (outer surround) ----
// Wide carved stone border — rectangular frame around the whole arch
var frameW = doorW + 1.8;
var frameH = doorTopY - doorBottom + 1.0;
var frameMidY = doorBottom + frameH / 2;
// Back panel of frame (sand-coloured carved stone)
placeMesh(bar, new THREE.BoxGeometry(frameW, frameH, 0.2), carvedStone, doorCentre, frameMidY, -0.08);
// Carved border mouldings — outer edge
placeMesh(bar, new THREE.BoxGeometry(frameW + 0.15, 0.12, 0.25), carvedStoneDark, doorCentre, doorBottom - 0.06, 0.0);
placeMesh(bar, new THREE.BoxGeometry(frameW + 0.15, 0.12, 0.25), carvedStoneDark, doorCentre, frameMidY + frameH / 2 + 0.06, 0.0);
placeMesh(bar, new THREE.BoxGeometry(0.12, frameH + 0.24, 0.25), carvedStoneDark, doorCentre - frameW / 2 - 0.06, frameMidY, 0.0);
placeMesh(bar, new THREE.BoxGeometry(0.12, frameH + 0.24, 0.25), carvedStoneDark, doorCentre + frameW / 2 + 0.06, frameMidY, 0.0);
// Inner carved moulding (closer to arch)
placeMesh(bar, new THREE.BoxGeometry(0.08, frameH - 0.3, 0.22), carvedStoneDark, doorCentre - doorW / 2 - 0.25, frameMidY, 0.02);
placeMesh(bar, new THREE.BoxGeometry(0.08, frameH - 0.3, 0.22), carvedStoneDark, doorCentre + doorW / 2 + 0.25, frameMidY, 0.02);

// ---- Small carved columns flanking the door (like in the reference) ----
var colMat = new THREE.MeshStandardMaterial({ color: 0xc0b080, roughness: 0.8 });
for (var cSide = -1; cSide <= 1; cSide += 2) {
  var colX = doorCentre + cSide * (doorW / 2 + 0.12);
  // Column shaft
  var col = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, doorRectH - 0.2, 8), colMat);
  col.position.set(colX, doorBottom + doorRectH / 2, 0.12);
  bar.add(col);
  // Column capital
  placeMesh(bar, new THREE.BoxGeometry(0.22, 0.12, 0.18), carvedStone, colX, doorBottom + doorRectH + 0.02, 0.1);
  // Column base
  placeMesh(bar, new THREE.BoxGeometry(0.2, 0.1, 0.16), carvedStone, colX, doorBottom + 0.05, 0.1);
}

// ---- HORSESHOE ARCH (carved stone segments) ----
// Build arch from small stone blocks following the horseshoe curve
var archSegments = 20;
var archInnerR = doorW / 2;
var archOuterR = archInnerR + 0.25;
for (var ai = 0; ai <= archSegments; ai++) {
  var angle = Math.PI * ai / archSegments;  // 0 to PI (full semicircle)
  var midAngle = Math.PI * (ai + 0.5) / archSegments;
  var ax = doorCentre + Math.cos(angle) * (archInnerR + archOuterR) / 2;
  var ay = archCentreY + Math.sin(angle) * (archInnerR + archOuterR) / 2;
  var blockW = 0.32;
  var blockH = archOuterR - archInnerR;
  var archBlock = new THREE.Mesh(new THREE.BoxGeometry(blockW, blockH, 0.18),
    ai % 2 === 0 ? carvedStone : carvedStoneDark);
  archBlock.position.set(ax, ay, 0.06);
  archBlock.rotation.z = angle - Math.PI / 2;
  bar.add(archBlock);
}
// Decorative carved keystone at top
placeMesh(bar, new THREE.BoxGeometry(0.3, 0.35, 0.22), carvedStoneDark, doorCentre, doorTopY + 0.15, 0.06);

// ---- DARK RECESS behind door — follows the arch, no black square corners ----
var recessShape = new THREE.Shape();
recessShape.moveTo(-doorW/2-0.04, doorBottom-0.03);
recessShape.lineTo(doorW/2+0.04, doorBottom-0.03);
recessShape.lineTo(doorW/2+0.04, archCentreY);
recessShape.absarc(0, archCentreY, archRadius+0.04, 0, Math.PI, false);
recessShape.closePath();
placeMesh(bar, new THREE.ShapeGeometry(recessShape,24),
  new THREE.MeshBasicMaterial({color:0x182a2c}),doorCentre,0,0.025);

// ---- GREEN DOOR PANELS ----
// Rectangular portion — two panels
var leftDoor = new THREE.Mesh(new THREE.BoxGeometry(doorW / 2 - 0.05, doorRectH, 0.08), greenDoor);
leftDoor.position.set(doorCentre - doorW / 4, doorBottom + doorRectH / 2, 0.06);
bar.add(leftDoor);
var rightDoor = new THREE.Mesh(new THREE.BoxGeometry(doorW / 2 - 0.05, doorRectH, 0.08), greenDoor);
rightDoor.position.set(doorCentre + doorW / 4, doorBottom + doorRectH / 2, 0.06);
bar.add(rightDoor);

// Arch portion — green semicircle fill (canvas texture on a plane)
var archDoorTex = makeCanvasTexture(256, 128, function(cx, w, h) {
  cx.fillStyle = '#176f65';
  cx.beginPath();
  cx.arc(w / 2, h, w / 2, Math.PI, 0);
  cx.fill();
  // Subtle wood grain
  for (var gi = 0; gi < 15; gi++) {
    cx.strokeStyle = 'rgba(20, 80, 45, 0.12)';
    cx.lineWidth = 1 + Math.random() * 2;
    cx.beginPath();
    cx.moveTo(Math.random() * w, 0);
    cx.lineTo(Math.random() * w, h);
    cx.stroke();
  }
  // Centre divider line
  cx.strokeStyle = 'rgba(15, 50, 30, 0.6)';
  cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(w / 2, 0); cx.lineTo(w / 2, h); cx.stroke();
});
var archDoorPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(doorW, archRadius),
  new THREE.MeshStandardMaterial({ map: archDoorTex, transparent: true, roughness: 0.7 })
);
archDoorPlane.position.set(doorCentre, archCentreY + archRadius / 2, 0.07);
bar.add(archDoorPlane);

// Centre divider strip
placeMesh(bar, new THREE.BoxGeometry(0.06, doorRectH, 0.1), greenDoorDark, doorCentre, doorBottom + doorRectH / 2, 0.1);

// ---- BLACK IRON NAIL STUDS (decorative patterns) ----
var studMat = blackIron;

// Border studs — running along edge of each door panel
for (var bSide = -1; bSide <= 1; bSide += 2) {
  var panelCx = doorCentre + bSide * doorW / 4;
  var panelHalfW = doorW / 4 - 0.08;
  // Vertical edges
  for (var sy = doorBottom + 0.15; sy < doorBottom + doorRectH - 0.05; sy += 0.22) {
    var stud = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), studMat);
    stud.position.set(panelCx - panelHalfW + 0.05, sy, 0.12);
    bar.add(stud);
    var stud2 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), studMat);
    stud2.position.set(panelCx + panelHalfW - 0.05, sy, 0.12);
    bar.add(stud2);
  }
  // Top edge
  for (var sx = panelCx - panelHalfW + 0.15; sx < panelCx + panelHalfW - 0.1; sx += 0.22) {
    var studT = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), studMat);
    studT.position.set(sx, doorBottom + doorRectH - 0.1, 0.12);
    bar.add(studT);
  }
  // Bottom edge
  for (var sx2 = panelCx - panelHalfW + 0.15; sx2 < panelCx + panelHalfW - 0.1; sx2 += 0.22) {
    var studB = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), studMat);
    studB.position.set(sx2, doorBottom + 0.1, 0.12);
    bar.add(studB);
  }

  // Decorative stud pattern — diamond/star motif in each panel
  var patCy = doorBottom + doorRectH * 0.55;
  // Central diamond shape
  var diamondPts = [
    [0, 0.45], [0.25, 0.22], [0.35, 0], [0.25, -0.22], [0, -0.45],
    [-0.25, -0.22], [-0.35, 0], [-0.25, 0.22]
  ];
  for (var di = 0; di < diamondPts.length; di++) {
    var dp = diamondPts[di];
    var ds = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), studMat);
    ds.position.set(panelCx + dp[0], patCy + dp[1], 0.12);
    bar.add(ds);
    // Interpolate studs between this point and next
    var dp2 = diamondPts[(di + 1) % diamondPts.length];

function addWindow(wx, wy, ww, wh, hasShutter, mode) {
  // Dressed opening — lace over lamplight or shuttered dark
  placeMesh(bar, new THREE.BoxGeometry(ww, wh, 0.1), makeGsWinMat(mode || 'dark'), wx, wy, -0.03);

  // Stone frame — clean rectangle
  var frameT = 0.08;
  placeMesh(bar, new THREE.BoxGeometry(frameT, wh + 0.16, 0.1), winStoneMat, wx - ww / 2 - frameT / 2, wy, 0.03);
  placeMesh(bar, new THREE.BoxGeometry(frameT, wh + 0.16, 0.1), winStoneMat, wx + ww / 2 + frameT / 2, wy, 0.03);
  placeMesh(bar, new THREE.BoxGeometry(ww + 0.24, frameT, 0.1), winStoneMat, wx, wy + wh / 2 + frameT / 2, 0.03);
  // Sill — slightly wider and thicker
  placeMesh(bar, new THREE.BoxGeometry(ww + 0.3, 0.1, 0.16), winStoneMat, wx, wy - wh / 2 - 0.05, 0.06);

  // Simple iron grille — even vertical bars
  var nBars = 4;
  for (var bi = 1; bi < nBars; bi++) {
    var bx = wx - ww / 2 + bi * ww / nBars;
    placeMesh(bar, new THREE.BoxGeometry(0.025, wh - 0.06, 0.04), winIron, bx, wy, 0.04);
  }
  // One horizontal crossbar
  placeMesh(bar, new THREE.BoxGeometry(ww - 0.06, 0.025, 0.04), winIron, wx, wy, 0.04);

  // Green shutters (flat against wall, closed)
  if (hasShutter) {
    for (var shSide = -1; shSide <= 1; shSide += 2) {
      var shX = wx + shSide * (ww / 2 + ww / 4 + 0.06);
      var sh = new THREE.Mesh(new THREE.BoxGeometry(ww / 2, wh, 0.04), greenShutter);
      sh.position.set(shX, wy, 0.04);
      bar.add(sh);
    }
  }
}

// ---- DECORATIVE TILE PANELS ----
function makeTilePanel(subject) {
  return makeCanvasTexture(128, 128, function(cx, w, h) {
    cx.fillStyle = '#e8e0d0';
    cx.fillRect(0, 0, w, h);
    cx.strokeStyle = '#2a5588';
    cx.lineWidth = 5;
    cx.strokeRect(4, 4, w - 8, h - 8);
    cx.lineWidth = 1.5;
    cx.strokeRect(10, 10, w - 20, h - 20);
    // Weathered wash
    cx.fillStyle = 'rgba(200, 185, 155, 0.15)';
    cx.fillRect(0, 0, w, h);
    if (subject === 'camel') {
      cx.fillStyle = '#b08050';
      cx.fillRect(38, 55, 48, 28);
      cx.beginPath(); cx.arc(76, 48, 10, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#d0a070';
      cx.fillRect(28, 82, 72, 6);
      cx.fillStyle = '#3a7a44';
      cx.beginPath(); cx.arc(28, 52, 12, 0, Math.PI * 2); cx.fill();
    } else if (subject === 'boat') {
      cx.fillStyle = '#4a88aa';
      cx.fillRect(22, 68, 84, 16);
      cx.fillStyle = '#7a4520';
      cx.beginPath();
      cx.moveTo(38, 62); cx.lineTo(90, 62); cx.lineTo(82, 48); cx.lineTo(48, 48);
      cx.closePath(); cx.fill();
      cx.fillStyle = '#e8e0d0';
      cx.fillRect(62, 32, 3, 30);
      cx.beginPath(); cx.moveTo(65, 32); cx.lineTo(80, 48); cx.lineTo(65, 48); cx.closePath(); cx.fill();
    } else if (subject === 'mosque') {
      cx.fillStyle = '#d0c8b0';
      cx.fillRect(42, 42, 44, 46);
      cx.fillStyle = '#4a88aa';
      cx.beginPath(); cx.arc(64, 42, 22, Math.PI, 0); cx.fill();
      cx.fillRect(62, 22, 5, 22);
      cx.fillStyle = '#d0a070';
      cx.fillRect(28, 82, 72, 6);
    } else if (subject === 'fish') {
      cx.fillStyle = '#4a88aa';
      cx.fillRect(20, 55, 88, 30);
      cx.fillStyle = '#708850';
      cx.beginPath();
      cx.moveTo(40, 50); cx.quadraticCurveTo(64, 35, 88, 50);
      cx.quadraticCurveTo(64, 65, 40, 50); cx.fill();
      cx.fillStyle = '#222';
      cx.beginPath(); cx.arc(78, 48, 2, 0, Math.PI * 2); cx.fill();
    }
  });
}

// Tile panels on facade

  [-5.0, 2.0, 'camel'], [-5.0, 4.5, 'mosque'],

    new THREE.MeshBasicMaterial({ map: tileTex }));
  tile.position.set(tp[0], tp[1], 0.04);
  bar.add(tile);
}

function addTileGrid(cx, cy, cols, rows) {
  for (var gr = 0; gr < rows; gr++) {
    for (var gc = 0; gc < cols; gc++) {
      var tgm = ((gr + gc) % 2 === 0) ? whiteTile : blueTile;
      var tg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.03), tgm);
      tg.position.set(cx + gc * 0.16 - (cols * 0.16) / 2 + 0.08, cy + gr * 0.16 - (rows * 0.16) / 2 + 0.08, 0.04);
      bar.add(tg);
    }
  }
}

// Helper: draw a vine segment (curved cylinder chain)
function addVine(points, thickness) {
  for (var vi = 0; vi < points.length - 1; vi++) {
    var p0 = points[vi], p1 = points[vi + 1];
    var dx = p1[0] - p0[0], dy = p1[1] - p0[1], dz = p1[2] - p0[2];
    var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    var t = thickness * (1 - vi * 0.08);
    if (t < 0.01) t = 0.01;
    var seg = new THREE.Mesh(new THREE.CylinderGeometry(t * 0.7, t, len, 5), vi % 2 === 0 ? vineMat : vineMatLight);
    seg.position.set((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2, (p0[2] + p1[2]) / 2);
    // Orient toward next point
    seg.lookAt(new THREE.Vector3(p1[0], p1[1], p1[2]));
    seg.rotateX(Math.PI / 2);
    seg.castShadow = true;
    scene.add(seg);
  }
}

// Helper: add a leaf at position
function addLeaf(x, y, z, scale, rot) {
  var leaf = new THREE.Mesh(
    new THREE.PlaneGeometry(0.15 * scale, 0.25 * scale),
    Math.random() < 0.5 ? vineLeafMat : vineLeafLight
  );
  leaf.position.set(x, y, z);
  leaf.rotation.set(rot || Math.random() * 0.5, Math.random() * Math.PI * 2, Math.random() * 0.8);
  scene.add(leaf);
}

}

function chasePos(u) {
  return { x: 2.2 * Math.sin(u), z: 4.9 + 1.25 * Math.sin(2 * u + 1.2) };
}
// The pavement platform tops out at y=0.1 (kerb at z=4.2): they hop up
// onto it rather than sinking into its side
function chaseY(z) {
  var on = Math.max(0, Math.min(1, (4.35 - z) / 0.3));
  var y = 0.1 * on * on * (3 - 2 * on);
  var d = Math.abs(z - 4.2);
  if (d < 0.32) y += 0.07 * (1 - d / 0.32);
  return y;
}

var stillCourtyard = window.matchMedia('(prefers-reduced-motion: reduce)');
function animate() {
  requestAnimationFrame(animate);
  if (stillCourtyard.matches) { renderer.render(scene, camera); return; }
  var t = clock.getElapsedTime();

  // Smoke particles — rise, drift, fade in/out, loop
  for (var i = 0; i < smokeParticles.length; i++) {
    var sp = smokeParticles[i];
    sp.life += 1;
    if (sp.life > sp.maxLife) {
      // Reset particle
      sp.life = 0;
      sp.sprite.position.set(sp.baseX, sp.sprite.position.y < 0.5 ? 0.45 : 0.88, sp.baseZ);
      sp.sprite.scale.set(0.05, 0.05, 1);
      sp.mat.opacity = 0;
      sp.driftX = (Math.random() - 0.5) * 0.004;
      sp.driftZ = (Math.random() - 0.5) * 0.003;
    }
    var lifeRatio = sp.life / sp.maxLife;
    // Rise
    sp.sprite.position.y += sp.riseSpeed * (1 - lifeRatio * 0.5);
    // Drift sideways with wobble
    sp.sprite.position.x += sp.driftX + Math.sin(t * sp.wobbleSpeed + sp.wobblePhase) * sp.wobbleAmt * 0.1;
    sp.sprite.position.z += sp.driftZ;
    // Scale up as it rises — bigger puffs
    var sc = 0.1 + lifeRatio * 0.7;
    sp.sprite.scale.set(sc, sc * (1.3 + lifeRatio * 0.6), 1);
    // Fade: appear quickly, linger, fade out — MORE OPAQUE
    if (lifeRatio < 0.08) {
      sp.mat.opacity = lifeRatio * 7;
    } else if (lifeRatio > 0.5) {
      sp.mat.opacity = (1 - lifeRatio) * 1.2;
    } else {
      sp.mat.opacity = 0.55;
    }
  }

  // Heat haze drift
  for (var i = 0; i < hazeSprites.length; i++) {
    var h = hazeSprites[i];
    h.sway += h.swaySpeed;
    h.sprite.position.x = h.baseX + Math.sin(h.sway) * h.swayAmt;
    h.baseX += h.drift;
    if (h.baseX > 15) h.baseX = -15;
  }

  // Sunlight variation (passing clouds)
  sunLight.intensity = 0.78 + Math.sin(t * 0.3) * 0.025;

  // Lantern flicker
  lantern1.intensity = 0.78 + Math.sin(t * 3.7) * 0.07 + Math.sin(t * 7.1) * 0.03;
  lantern2.intensity = 0.78 + Math.sin(t * 4.1) * 0.07 + Math.sin(t * 6.3) * 0.03;

  // Incense ember glow pulse
  incenseGlow.intensity = 0.15 + Math.sin(t * 2.3) * 0.05 + Math.sin(t * 5.7) * 0.03;
  incenseEmber.material.color.setHex(Math.sin(t * 3) > 0 ? 0xcc4400 : 0xdd5510);

  // Cigarette ember flicker
  ember1.material.color.setHex(Math.sin(t * 4.5 + 1) > 0.3 ? 0xff6620 : 0xcc4410);
  ember2.material.color.setHex(Math.sin(t * 3.8 + 2) > 0.2 ? 0xff6620 : 0xcc4410);

  // The beautiful mad blobs breathe and float (their sway was built but never wired)
  for (var pi2 = 0; pi2 < plantSprites.length; pi2++) {
    var pb = plantSprites[pi2];
    if (pb.baseOp === undefined) pb.baseOp = pb.sprite.material.opacity;
    pb.sprite.position.x = pb.baseX + Math.sin(t * pb.swaySpeed + pb.swayPhase) * pb.swayAmt * 2.2;
    pb.sprite.position.y = pb.baseY + Math.cos(t * pb.swaySpeed * 0.63 + pb.swayPhase) * pb.swayAmt * 1.4;
    pb.sprite.material.opacity = pb.baseOp + Math.sin(t * pb.swaySpeed * 0.8 + pb.swayPhase * 2) * 0.08;
  }
  // The drifters cross the court on the breeze
  for (var dfi2 = 0; dfi2 < drifters.length; dfi2++) {
    var dd = drifters[dfi2];
    dd.s.position.x += dd.vx * 0.016;
    dd.s.position.y += Math.sin(t * dd.sp + dd.ph) * 0.004;
    dd.s.material.rotation += 0.0012;
    if (dd.s.position.x > 8.5) dd.s.position.x = -8.5;
  }
  // The sea breathing on the wall
  for (var ca2 = 0; ca2 < caustics.length; ca2++) {
    var cc = caustics[ca2];
    cc.s.material.opacity = 0.09 + 0.09 * (0.5 + 0.5 * Math.sin(t * cc.sp + cc.ph));
    cc.s.position.x += Math.sin(t * 0.22 + cc.ph) * 0.0012;
    cc.s.scale.x = 3.4 + Math.sin(t * 0.5 + cc.ph) * 0.25;
  }
  // The chase: bursts and stand-offs. The mouse leads; the cat runs the
  // same line half a beat behind.
  var chSpd = Math.max(0, Math.sin(t * 0.33 + 1) * 0.9 + 0.45);
  chase.u += chSpd * 0.016;

  var cp = chasePos(chase.u - 0.5);
  var running = chSpd > 0.05;
  var mJit = running ? 0 : Math.sin(t * 26) * 0.004;
  mouseG.position.set(mp.x + mJit, chaseY(mp.z), mp.z);
  catG.position.set(cp.x, chaseY(cp.z) + (running ? Math.abs(Math.sin(chase.u * 7)) * 0.035 : 0), cp.z);
  if (running) {
    mouseG.rotation.y = Math.atan2(mp.x - chase.mPX, mp.z - chase.mPZ);
    catG.rotation.y = Math.atan2(cp.x - chase.catPX, cp.z - chase.catPZ);
  }
  chase.mPX = mp.x; chase.mPZ = mp.z;
  chase.catPX = cp.x; chase.catPZ = cp.z;
  catTailG.rotation.z = Math.sin(t * (running ? 9 : 5.5)) * (running ? 0.18 : 0.38);
  catTailG.rotation.x = running ? -0.5 : 0.1;
  // Stars breathe out of step
  for (var st2 = 0; st2 < starSets.length; st2++) { var sset = starSets[st2]; sset.mat.opacity = sset.base + 0.25 * Math.sin(t * sset.sp + sset.ph) * Math.sin(t * sset.sp * 0.37 + sset.ph * 1.7); }
  // The shooting star
  if (shoot.t < 0 && t > shoot.next) { shoot.t = 0; shoot.x = -30 + Math.random() * 60; shoot.y = 31 + Math.random() * 6; shoot.dx = (Math.random() < 0.5 ? -1 : 1) * (14 + Math.random() * 8); shoot.dy = -(3 + Math.random() * 2.5); }
  if (shoot.t >= 0) {
    shoot.t += 0.016; var sk2 = shoot.t / 0.7, hx = shoot.x + shoot.dx * sk2, hy = shoot.y + shoot.dy * sk2;
    var sp2 = shootGeo.attributes.position.array; sp2[0] = hx; sp2[1] = hy; sp2[2] = -58; sp2[3] = hx - shoot.dx * 0.18; sp2[4] = hy - shoot.dy * 0.18; sp2[5] = -58; shootGeo.attributes.position.needsUpdate = true;
    shootMat.opacity = Math.sin(Math.min(1, sk2) * Math.PI) * 0.9;
    if (sk2 >= 1) { shoot.t = -1; shootMat.opacity = 0; shoot.next = t + 14 + Math.random() * 22; }
  }
  // The mist crawls and breathes
  for (var mi2 = 0; mi2 < mists.length; mi2++) { var ms = mists[mi2]; ms.s.position.x += ms.vx * 0.016; if (ms.s.position.x > 14) ms.s.position.x = -14; ms.s.material.opacity = ms.base * (0.7 + 0.3 * Math.sin(t * 0.3 + ms.ph)); }
  // The moths worry the lanterns
  for (var mo2 = 0; mo2 < moths.length; mo2++) { var mt = moths[mo2], ma = t * mt.sp + mt.ph; mt.s.position.set(mt.c[0] + Math.cos(ma) * mt.r + Math.sin(t * mt.wob * 3.1 + mt.ph) * 0.04, mt.c[1] + Math.sin(ma * 1.3) * mt.r * 0.6 + Math.sin(t * mt.wob * 4.3) * 0.03, mt.c[2] + Math.sin(ma) * mt.r * 0.5); }
  if (composer) { composer.render(); } else { renderer.render(scene, camera); }
}

animate();
