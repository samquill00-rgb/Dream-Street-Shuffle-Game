  // ============================================================
  // THE WOMAN AT THE CHANNEL (2026-10-06 Ezekiel polish). His prose has a

  // ============================================================

  // ============================================================
  (function() {

    [[0.4, 2.2, 0.5, 1.6, 0.9], [-0.35, 2.6, 0.4, 1.3, -0.8], [0.1, 3.0, 0.3, 1.0, 0.3], [0.5, 1.6, 0.35, 1.1, 1.2]].forEach(function(b) { var br = mesh(new THREE.CylinderGeometry(0.02, 0.06, b[3], 5), wood, tx + b[0], ty + b[1], tz + b[2]); br.rotation.z = b[4]; br.rotation.x = b[2]; });

    var oldBank = mesh(new THREE.BoxGeometry(400, 2.2, 8), bankMat2, 80, 0.9, -230); oldBank.rotation.y = 0.12; oldBank.castShadow = false;
  })();

  // ============================================================
  // WIND FROM NO DIRECTION: dust and haze, each drift its own way
  // ============================================================
  var fogSprites = [];
  function addFog(tex, n, x0, x1, y0, y1, z0, z1, s0, s1, op0, op1, aspect) {
    for (var i = 0; i < n; i++) {
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: rand(op0, op1) }));
      var s = rand(s0, s1); sp.scale.set(s, s * aspect, 1);
      sp.position.set(rand(x0, x1), rand(y0, y1), rand(z0, z1)); scene.add(sp);

  }
  var whiteHaze = radialTex(220, 216, 210, 0.2, 0.4), dust = radialTex(200, 190, 172, 0.16, 0.4), violetHaze = radialTex(140, 120, 150, 0.12, 0.45), riverMist = radialTex(190, 190, 195, 0.16, 0.4);
  addFog(dust, 46, -60, 60, 0.2, 2.0, -120, 12, 6, 22, 0.14, 0.3, 0.3);
  addFog(whiteHaze, 30, -90, 90, 1.5, 7, -200, -20, 20, 70, 0.1, 0.22, 0.28);
  addFog(violetHaze, 16, -180, 20, 6, 30, -420, -180, 60, 160, 0.08, 0.18, 0.3);
  addFog(riverMist, 22, -60, -10, 0.1, 1.2, -140, 4, 5, 14, 0.12, 0.24, 0.3);
  // low dust streamers crossing the ground, thin and quick to fade
  var streamers = [];
  var streamTex = canvasTex(256, 32, function(ctx, w, h) { var g = ctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, 'rgba(235,228,214,0)'); g.addColorStop(0.3, 'rgba(235,228,214,0.7)'); g.addColorStop(0.7, 'rgba(235,228,214,0.7)'); g.addColorStop(1, 'rgba(235,228,214,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); var v = ctx.createLinearGradient(0, 0, 0, h); v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(0.5, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,1)'); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = v; ctx.fillRect(0, 0, w, h); });
  for (var si = 0; si < 30; si++) {
    var st = new THREE.Sprite(new THREE.SpriteMaterial({ map: streamTex, transparent: true, depthWrite: false, opacity: 0 }));
    st.scale.set(rand(8, 20), rand(0.5, 1.2), 1); scene.add(st);

  }

  streamers.forEach(resetStreamer);

  // ============================================================
  // ANIMATION
  // ============================================================
  // The bruise caught in the wet mud of the plain: one additive streak laid
  // along the line from the camera towards the glow in the north, amber at
  // its heart and violet at its edges, broken into bands by the mud, and
  // breathing with the bruise (br) in animate.
  var pcSheenTex = canvasTex(64, 512, function(ctx, w, h) {
    var g2 = ctx.createLinearGradient(0, 0, w, 0);
    g2.addColorStop(0, 'rgba(120,70,130,0)'); g2.addColorStop(0.25, 'rgba(150,100,130,0.35)'); g2.addColorStop(0.5, 'rgba(210,150,90,0.8)'); g2.addColorStop(0.75, 'rgba(150,100,130,0.35)'); g2.addColorStop(1, 'rgba(120,70,130,0)');

  });
  var pcSheen = new THREE.Mesh(new THREE.PlaneGeometry(5, 44), new THREE.MeshBasicMaterial({ map: pcSheenTex, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.06, depthWrite: false }));
  pcSheen.rotation.order = 'YXZ'; pcSheen.rotation.x = -Math.PI / 2; pcSheen.rotation.y = Math.atan2(6 - BR.x, 8 - BR.z);
  pcSheen.position.set(2.0, plainY(2.0, -18) + 0.2, -18); scene.add(pcSheen);
  // Reduced motion: the clock is pinned at 4s (river, reeds and bruise
  // settled) and the haze and streamers hold still.
  var pcStill = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var clock = new THREE.Clock();
  function animate() {
    if (!pcActive) return;
    pcAnimId = requestAnimationFrame(animate);
    var dt = pcStill ? 0 : Math.min(clock.getDelta(), 0.05), t = pcStill ? 4 : clock.elapsedTime;
    // Slow advection gives the pale reflected sky a current.
    riverTex.offset.y = t * 0.003;
    // the river's skin
    var wp = window.__wg.attributes.position;
    for (var i = 0; i < wp.count; i++) { var b = window.__wbase[i]; wp.setZ(i, Math.sin(b.y * 0.12 + t * 0.6) * 0.12 + Math.sin(b.x * 0.6 + b.y * 0.05 - t * 0.9) * 0.07); }

      var k = Math.sin(fs.t * 0.006);

      fs.sprite.position.z = fs.z0 + fs.dz * fs.reach * 60 * k;

    bruiseRing.material.opacity = 0.1 + br * 0.14;
    bruiseDark.material.opacity = 0.16 + br * 0.14;
    northLight.intensity = 0.12 + br * 0.3;
    window.__skin.material.opacity = 0.3 + br * 0.35;
    pcSheen.material.opacity = 0.045 + br * 0.075;
    // the reeds bend to a wind that keeps changing its mind
    var wdir = Math.sin(t * 0.23) * 1.2, wstr = 0.55 + 0.45 * Math.sin(t * 0.41);
    for (var r = 0; r < reeds.length; r++) { var R = reeds[r]; var g = Math.sin(t * R.sp + R.ph) * 0.12 * wstr; R.m.rotation.x = R.rx + Math.cos(wdir) * (0.18 * wstr + g); R.m.rotation.z = R.rz + Math.sin(wdir) * (0.18 * wstr + g); }
    // the woman rocks with the washing: forward over the water and back, a little lift at the turn
    if (washer) { var wk = Math.sin(t * 1.45); washer.position.x = washer.userData.x0 - 0.03 * (wk + 1); washer.position.y = washer.userData.y0 - 0.012 * (wk + 1); }
    raycaster.setFromCamera(mouseNDC, camera);
    var hits = mouseMoved ? raycaster.intersectObjects(clickableObjects) : [];
    var hv = hits.length ? venueData.get(hits[0].object) : null;
    if (hv !== hoveredVenue) {
      hoveredVenue = hv;
      if (hv) { tooltip.textContent = hv.name; tooltip.classList.add('visible'); pcWrap.style.cursor = 'pointer'; }
      else { tooltip.classList.remove('visible'); pcWrap.style.cursor = ''; }
    }
    renderer.render(scene, camera);
  }
  animate();

var pcBtn = document.createElement('div');
pcBtn.textContent = 'WALK OUT ONTO THE PLAIN';
pcBtn.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:14px min(36px, 8vw);white-space:nowrap;max-width:calc(100vw - 16px);box-sizing:border-box;font:16px "Courier New",monospace;color:rgba(38,32,28,0.95);border:1px solid rgba(46,40,35,0.45);letter-spacing:min(4px, 0.9vw);cursor:pointer;z-index:9004;background:rgba(247,245,241,0.42);backdrop-filter:none;opacity:0;transition:opacity 2s ease;';
setTimeout(function() { pcBtn.style.opacity = '1'; }, 2200);
