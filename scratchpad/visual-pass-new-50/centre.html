</script><script>// ====== dssScene — REUSABLE 3D ATMOSPHERE TOOLKIT ===========
// ============================================================
// Procedural materials and props extracted from the Chippy /
// Pillars / Lackland scenes so new 3D approach scenes can pull
// the same Soho-night look without re-deriving every texture.
//
// Usage (inside a scene IIFE, after THREE is loaded):
//   var brickMat = dssScene.makeGrimyBrick({ baseColor: 0x7a5a48 });
//   var roadMat  = dssScene.makeGrimyRoad();
//   var paveMat  = dssScene.makePavingSlabs();
//   var stucco   = dssScene.makeWeatheredStucco();
//   dssScene.createVictorianGasLamp(scene, -4, 3.5);
//   var btn = dssScene.createEnterButton('ENTER THE SOMEWHERE',
//     function() { /* nav handler */ });
//   wrap.appendChild(btn);
//
// All `make*` factories return a THREE.MeshStandardMaterial with
// `map`/`repeat` set, ready to apply to geometry. `create*`
// factories build a THREE.Group (or DOM element) and add it for
// you when given a parent.
// ------------------------------------------------------------
window.dssScene = (function() {

  // ---------- canvas texture helper ----------
  function makeCanvasTexture(w, h, drawFunc) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    drawFunc(cx, w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------- GRIMY BRICK ----------
  // Running-bond brickwork with mortar courses, soot streaks,
  // damp/lichen patches, paste-up ghost, top soot wash.
  // opts:
  //   baseColor:  fill rgb (default 0x6f4f3a)
  //   repeat:     [u, v] tiling (default [2, 4])
  //   sootStreaks: count (default 5)
  //   dampPatches: count (default 5)
  //   lichen:      count (default 12)
  //   highlightBricks: count of brighter-painted bricks (default 8)
  function makeGrimyBrick(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x6f4f3a).toString(16).padStart(6, '0');
    var streaks = opts.sootStreaks != null ? opts.sootStreaks : 5;
    var damp    = opts.dampPatches != null ? opts.dampPatches : 5;
    var lichen  = opts.lichen      != null ? opts.lichen      : 12;
    var highlights = opts.highlightBricks != null ? opts.highlightBricks : 8;
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var bH = 14, bW = 32;
      for (var by = 0; by < h; by += bH) {
        var rowOff = ((Math.floor(by / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var bx = -bW; bx < w + bW; bx += bW) {
          var px = bx + rowOff;
          var r = 95 + Math.floor(Math.random() * 50);
          var g = 60 + Math.floor(Math.random() * 35);
          var b = 45 + Math.floor(Math.random() * 30);
          if (Math.random() > 0.94) { r -= 40; g -= 32; b -= 22; }
          if (Math.random() > 0.96) { r += 30; g += 18; b += 10; }
          cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          cx.fillRect(px + 1, by + 1, bW - 2, bH - 2);
          cx.fillStyle = 'rgba(20,12,6,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
          cx.fillRect(px + 1, by + bH - 3, bW - 2, 2);
        }
      }
      cx.fillStyle = 'rgba(170, 145, 115, 0.32)';
      for (var hy = 0; hy < h; hy += bH) cx.fillRect(0, hy, w, 1);
      cx.fillStyle = 'rgba(160, 135, 105, 0.22)';
      for (var hyy = 0; hyy < h; hyy += bH) {
        var ro = ((Math.floor(hyy / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var hxx = ro; hxx < w; hxx += bW) cx.fillRect(hxx, hyy, 1.4, bH);
      }
      for (var ss = 0; ss < streaks; ss++) {
        var sx = Math.random() * w;
        var sxw = 12 + Math.random() * 30;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(8, 6, 4, 0.55)');
        sg.addColorStop(0.3, 'rgba(12, 10, 6, 0.32)');
        sg.addColorStop(0.7, 'rgba(18, 14, 9, 0.12)');
        sg.addColorStop(1, 'rgba(22, 18, 10, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < damp; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.45 + Math.random() * h * 0.55;
        var dr = 30 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(60, 75, 55, 0.32)');
        dg2.addColorStop(0.5, 'rgba(50, 60, 45, 0.16)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      for (var lp = 0; lp < lichen; lp++) {
        cx.fillStyle = 'rgba(95, 105, 60, ' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          5 + Math.random() * 12, 3 + Math.random() * 6.6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var topG = cx.createLinearGradient(0, 0, 0, h * 0.45);
      topG.addColorStop(0, 'rgba(18, 12, 8, 0.42)');
      topG.addColorStop(1, 'rgba(18, 12, 8, 0)');
      cx.fillStyle = topG; cx.fillRect(0, 0, w, h * 0.45);
      cx.fillStyle = 'rgba(220, 200, 160, 0.08)';
      cx.fillRect(w * 0.12, h * 0.42, w * 0.18, h * 0.13);
      for (var hl = 0; hl < highlights; hl++) {
        var hbx = Math.floor(Math.random() * (w / bW)) * bW;
        var hby = Math.floor(Math.random() * (h / bH)) * bH;
        cx.fillStyle = 'rgba(220, 195, 150, ' + (0.10 + Math.random() * 0.15).toFixed(3) + ')';
        cx.fillRect(hbx + 1, hby + 1, bW - 2, 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 });
  }

  // ---------- WEATHERED STUCCO ----------
  // Cream stucco with hairline cracks, nicotine wash pooling
  // lower, soot streaks from gutters, damp/green patches, paint-
  // patch repairs, paste-up ghost, bird splat.
  // opts:
  //   baseColor: default 0xc8b89a
  //   repeat:    default [2, 3]
  function makeWeatheredStucco(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0xc8b89a).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var pp = 0; pp < 350; pp++) {
        var b = 180 + Math.floor(Math.random() * 30);
        cx.fillStyle = 'rgba(' + b + ',' + (b - 18) + ',' + (b - 32) + ',0.12)';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          6 + Math.random() * 24, 4 + Math.random() * 14, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var nicoG = cx.createLinearGradient(0, h * 0.35, 0, h);
      nicoG.addColorStop(0, 'rgba(170, 145, 80, 0)');
      nicoG.addColorStop(0.6, 'rgba(170, 145, 80, 0.10)');
      nicoG.addColorStop(1, 'rgba(160, 130, 60, 0.18)');
      cx.fillStyle = nicoG; cx.fillRect(0, h * 0.35, w, h * 0.65);
      for (var ss = 0; ss < 6; ss++) {
        var sx = Math.random() * w;
        var sxw = 10 + Math.random() * 26;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(15, 12, 8, 0.50)');
        sg.addColorStop(0.4, 'rgba(20, 16, 10, 0.22)');
        sg.addColorStop(0.85, 'rgba(25, 20, 12, 0.08)');
        sg.addColorStop(1, 'rgba(25, 20, 12, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < 4; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.7 + Math.random() * h * 0.3;
        var dr = 32 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(70, 80, 55, 0.30)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      cx.strokeStyle = 'rgba(50, 38, 22, 0.45)'; cx.lineWidth = 0.7;
      for (var ch = 0; ch < 14; ch++) {
        cx.beginPath();
        var cxh = Math.random() * w, cyh = Math.random() * h;
        cx.moveTo(cxh, cyh);
        for (var sg2 = 0; sg2 < 5; sg2++) {
          cxh += (Math.random() - 0.5) * 28; cyh += 12 + Math.random() * 22;
          cx.lineTo(cxh, cyh);
        }
        cx.stroke();
      }
      for (var pr = 0; pr < 8; pr++) {
        var prx = Math.random() * w, pry = Math.random() * h;
        var prr = 12 + Math.random() * 22;
        var pg = cx.createRadialGradient(prx, pry, 0, prx, pry, prr);
        pg.addColorStop(0, 'rgba(225, 210, 180, 0.45)');
        pg.addColorStop(0.6, 'rgba(220, 200, 170, 0.14)');
        pg.addColorStop(1, 'rgba(220, 200, 170, 0)');
        cx.fillStyle = pg;
        cx.beginPath();
        cx.ellipse(prx, pry, prr, prr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(200, 170, 130, 0.10)';
      cx.fillRect(w * 0.18, h * 0.55, w * 0.12, h * 0.10);
      cx.fillStyle = 'rgba(245, 240, 215, 0.36)';
      cx.beginPath();
      cx.ellipse(w * 0.88, h * 0.08, 5, 2.5, 0.4, 0, Math.PI * 2);
      cx.fill();
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 3];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
  }

  // ---------- GRIMY ROAD ----------
  // Tarmac with aggregate speckle, lighter repair patches, jagged
  // cracks, wandering tar-seal sealant lines, oil blotches, faded
  // white centre line.
  function makeGrimyRoad(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x1c1c1c).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var p = 0; p < 4200; p++) {
        var pg = 25 + Math.floor(Math.random() * 70);
        cx.fillStyle = 'rgba(' + pg + ',' + pg + ',' + pg + ',0.42)';
        cx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }
      for (var rp = 0; rp < 6; rp++) {
        var rx = Math.random() * w, ry = Math.random() * h;
        var rwd = 50 + Math.random() * 100, rht = 35 + Math.random() * 70;
        cx.fillStyle = 'rgba(78, 78, 78, ' + (0.16 + Math.random() * 0.22).toFixed(3) + ')';
        cx.fillRect(rx, ry, rwd, rht);
        cx.strokeStyle = 'rgba(100, 100, 100, 0.18)'; cx.lineWidth = 0.6;
        cx.strokeRect(rx, ry, rwd, rht);
      }
      cx.strokeStyle = 'rgba(8, 8, 8, 0.8)'; cx.lineWidth = 1.2;
      for (var c = 0; c < 10; c++) {
        cx.beginPath();
        var cx0 = Math.random() * w, cy0 = Math.random() * h;
        cx.moveTo(cx0, cy0);
        var ang = Math.random() * Math.PI * 2, len = 30 + Math.random() * 80;
        cx.lineTo(cx0 + Math.cos(ang) * len, cy0 + Math.sin(ang) * len);
        cx.lineTo(cx0 + Math.cos(ang + 0.4) * len * 1.4, cy0 + Math.sin(ang + 0.4) * len * 1.4);
        cx.stroke();
      }
      cx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; cx.lineWidth = 2.6;
      for (var tm = 0; tm < 5; tm++) {
        cx.beginPath();
        var tx = Math.random() * w, ty = Math.random() * h;
        cx.moveTo(tx, ty);
        for (var ts = 0; ts < 5; ts++) {
          tx += (Math.random() - 0.5) * 30; ty += 8 + Math.random() * 16;
          cx.lineTo(tx, ty);
        }
        cx.stroke();
      }
      cx.fillStyle = 'rgba(220, 220, 200, 0.5)';
      cx.fillRect(w * 0.5 - 2, h * 0.3, 4, h * 0.4);
      cx.fillStyle = 'rgba(220, 220, 200, 0.18)';
      cx.fillRect(w * 0.5 - 2, h * 0.05, 4, h * 0.2);
      cx.fillRect(w * 0.5 - 2, h * 0.75, 4, h * 0.2);
      for (var os = 0; os < 4; os++) {
        var ox = Math.random() * w, oy = Math.random() * h;
        var orr = 8 + Math.random() * 18;
        var og = cx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        og.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
        og.addColorStop(0.7, 'rgba(15, 12, 5, 0.22)');
        og.addColorStop(1, 'rgba(15, 12, 5, 0)');
        cx.fillStyle = og; cx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [1, 8];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.18 });
  }

  // ---------- PAVING SLABS ----------
  // London paving slabs with grout, cracks, gum/fag-ends and
  // wet patches.
  function makePavingSlabs(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x3a3a36).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var sw = 128, sh = 96;
      cx.strokeStyle = 'rgba(18, 18, 16, 0.55)'; cx.lineWidth = 1.4;
      for (var sy = 0; sy < h; sy += sh) {
        var off = ((sy / sh) % 2 === 0) ? 0 : sw / 2;
        for (var sx = -sw; sx < w + sw; sx += sw) {
          var bxp = sx + off;
          var sg = 48 + Math.floor(Math.random() * 28);
          cx.fillStyle = 'rgba(' + sg + ',' + sg + ',' + (sg - 4) + ',' + (0.32 + Math.random() * 0.3).toFixed(3) + ')';
          cx.fillRect(bxp, sy, sw, sh);
          cx.strokeRect(bxp, sy, sw, sh);
        }
      }
      cx.strokeStyle = 'rgba(15, 15, 12, 0.55)'; cx.lineWidth = 0.9;
      for (var c2 = 0; c2 < 7; c2++) {
        cx.beginPath();
        cx.moveTo(Math.random() * w, Math.random() * h);
        cx.lineTo(Math.random() * w, Math.random() * h);
        cx.stroke();
      }
      for (var fe = 0; fe < 60; fe++) {
        cx.fillStyle = 'rgba(180, 175, 165, ' + (0.15 + Math.random() * 0.22).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(Math.random() * w, Math.random() * h, 1.0 + Math.random() * 1.6, 0, Math.PI * 2);
        cx.fill();
      }
      for (var wp = 0; wp < 5; wp++) {
        var wpx = Math.random() * w, wpy = Math.random() * h;
        var wpr = 35 + Math.random() * 60;
        var wpg = cx.createRadialGradient(wpx, wpy, 0, wpx, wpy, wpr);
        wpg.addColorStop(0, 'rgba(72, 78, 80, 0.35)');
        wpg.addColorStop(1, 'rgba(72, 78, 80, 0)');
        cx.fillStyle = wpg; cx.fillRect(wpx - wpr, wpy - wpr, wpr * 2, wpr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [4, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88 });
  }

  // ---------- VICTORIAN GAS LAMP ----------
  // Cast-iron stepped base, fluted shaft, mid-band, ladder rest,
  // capital, 4-sided emissive glass lantern, pyramidal cap,
  // crown finial, point light, halo + inner-core sprites.
  // Adds the lamp group to `parent` at (x, 0, z). Returns the
  // group (with `.userData.light` set to the PointLight).
  //
  // opts:
  //   intensity:   point-light intensity (default 0.5)
  //   distance:    point-light range (default 10)
  //   lampColor:   point-light + glow colour (default 0xffd6a0)
  //   haloScale:   outer halo sprite size (default 2.2)
  //   coreScale:   inner-core sprite size (default 0.9)
  //   paneColor:   solid emissive pane colour (default 0xfff0c8)
  function createVictorianGasLamp(parent, x, z, opts) {
    opts = opts || {};
    var lampColor = opts.lampColor || 0xffd6a0;
    var paneColor = opts.paneColor || 0xfff0c8;
    var g = new THREE.Group();
    var castIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.78, metalness: 0.22 });
    var darkIron = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.7, metalness: 0.3 });
    var brassish = new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.35 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m;
    }
    // Stepped base
    place(new THREE.CylinderGeometry(0.24, 0.28, 0.10, 16), castIron, 0, 0.05, 0);
    place(new THREE.CylinderGeometry(0.20, 0.24, 0.18, 16), castIron, 0, 0.19, 0);
    place(new THREE.CylinderGeometry(0.17, 0.20, 0.05, 16), darkIron, 0, 0.31, 0);
    place(new THREE.BoxGeometry(0.32, 0.32, 0.32), castIron, 0, 0.50, 0);
    place(new THREE.CylinderGeometry(0.11, 0.16, 0.06, 16), darkIron, 0, 0.69, 0);
    // Shaft
    place(new THREE.CylinderGeometry(0.058, 0.10, 3.9, 16), castIron, 0, 2.65, 0);
    // Mid-band
    place(new THREE.CylinderGeometry(0.082, 0.082, 0.06, 16), darkIron, 0, 1.55, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.58, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.52, 0);
    // Ladder rest
    place(new THREE.BoxGeometry(0.52, 0.018, 0.018), castIron, 0, 4.45, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.52), castIron, 0, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron,  0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, -0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45,  0.26);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45, -0.26);
    // Capital
    place(new THREE.CylinderGeometry(0.085, 0.062, 0.08, 16), castIron, 0, 4.66, 0);
    place(new THREE.CylinderGeometry(0.105, 0.085, 0.04, 16), darkIron, 0, 4.72, 0);
    place(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12), castIron, 0, 4.81, 0);
    // Lantern base + 4 emissive panes
    place(new THREE.BoxGeometry(0.34, 0.04, 0.34), darkIron, 0, 4.91, 0);
    var paneMat = new THREE.MeshBasicMaterial({ color: paneColor });
    var paneF = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneF.position.set(0, 5.16, 0.134); g.add(paneF);
    var paneB = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneB.position.set(0, 5.16, -0.134); paneB.rotation.y = Math.PI; g.add(paneB);
    var paneL = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneL.position.set(-0.134, 5.16, 0); paneL.rotation.y = Math.PI / 2; g.add(paneL);
    var paneR = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneR.position.set(0.134, 5.16, 0); paneR.rotation.y = -Math.PI / 2; g.add(paneR);
    // Corner posts + cross-bars
    var corners = [[0.135, 0.135], [-0.135, 0.135], [0.135, -0.135], [-0.135, -0.135]];
    for (var cp = 0; cp < 4; cp++) {
      place(new THREE.BoxGeometry(0.028, 0.44, 0.028), darkIron, corners[cp][0], 5.16, corners[cp][1]);
    }
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16,  0.135);

// ============================================================
// CENTRE POINT TOWER
// ============================================================
// The building is a cylindrical-ish tower with a hexagonal/faceted
// plan. Each face of the tower has the distinctive deep-set honeycomb
// window grid: horizontal bands of precast concrete framing
// large trapezoidal glazed bays.
//
// We build it as a CylinderGeometry core (the structural mass)
// then tile the honeycomb facade panels onto the visible faces.

var tower = new THREE.Group();

// ----- CORE SHAFT -----
// 34-storey tower. In 1973 it dominated the Tottenham Court Road skyline.
// Scale: ~0.7 units per storey, so total ~24 units tall.
var STOREYS = 34;
var STOREY_H = 0.72;
var TOWER_H = STOREYS * STOREY_H;
var TOWER_R = 2.8;

// Octagonal core — the structural body
var coreGeo = new THREE.CylinderGeometry(TOWER_R, TOWER_R + 0.2, TOWER_H, 8, 1);
var core = new THREE.Mesh(coreGeo, recessMat);
core.position.set(0, TOWER_H / 2, 0);
tower.add(core);

// ----- HONEYCOMB FACADE PANELS -----
// Centre Point's signature: each storey has deep-set concrete ribs
// forming a diamond/hexagonal grid on the facade.
// We'll tile this on the front 3 faces of the octagon.

// Each honeycomb cell: a concrete surround (thick, projected forward)
// with a recessed glass pane inside.
// Cell dimensions roughly: 0.65 wide × 0.68 tall

var CELL_W = 0.62;
var CELL_H = 0.66;
var PANEL_DEPTH = 0.18;
var GLASS_INSET = 0.12;

// The angled faces of the octagon — we'll cover faces at angles:
// 0° (front), ±45° (front-flanks), and partially ±90° (sides)
var facadeAngles = [0, -45, 45, -90, 90];
var facadeWidths = [5.0, 3.5, 3.5, 2.2, 2.2];

// Random seed for consistent window lighting
var winStates = [];
for (var w = 0; w < 2000; w++) {
var r = Math.random();
winStates.push(r < 0.08 ? 'warm' : r < 0.13 ? 'cold' : 'dark');
}

var warmWindows = [];
var winIdx = 0;

facadeAngles.forEach(function(angleDeg, fi) {
var angleRad = angleDeg * Math.PI / 180;
var fWidth   = facadeWidths[fi];

// Position of this face: on the surface of the octagon
var faceDist = TOWER_R * Math.cos(Math.PI / 8);

var cols = Math.floor(fWidth / CELL_W);
var rows = STOREYS;

for (var row = 0; row < rows; row++) {
for (var col = 0; col < cols; col++) {

// Local position on the face
var lx = (col - (cols - 1) / 2) * CELL_W;
var ly = (row + 0.5) * CELL_H + 0.5;

// Odd rows offset by half a cell — the honeycomb stagger
if (row % 2 === 1) lx += CELL_W * 0.5;

// Concrete surround (the rib frame around each cell)
var surroundGeo = new THREE.BoxGeometry(CELL_W - 0.04, CELL_H - 0.04, PANEL_DEPTH);
var surround = new THREE.Mesh(surroundGeo, concreteMat);

// Glass pane — inset behind the surround
var glassState = winStates[winIdx % winStates.length];
winIdx++;
var glassMat = (glassState === 'warm') ? warmGlass :
(glassState === 'cold') ? coldGlass : darkGlass;

var glassGeo = new THREE.BoxGeometry(CELL_W * 0.72, CELL_H * 0.78, 0.04);
var glass = new THREE.Mesh(glassGeo, glassMat);
glass.position.z = -GLASS_INSET;

// The horizontal rib — a thin bar across the bottom of each cell
var ribGeo = new THREE.BoxGeometry(CELL_W, 0.06, PANEL_DEPTH + 0.04);
var rib = new THREE.Mesh(ribGeo, concreteMat);
rib.position.y = -(CELL_H / 2) + 0.03;

// Group the cell
var cell = new THREE.Group();
cell.add(surround);
cell.add(glass);
cell.add(rib);

// Position on the face, rotated to sit on the correct face of octagon
cell.position.set(lx, ly, faceDist);
cell.rotation.y = -angleRad;

// Rotate so x-axis aligns with the face
var worldPos = new THREE.Vector3();
var cosA = Math.cos(angleRad);
var sinA = Math.sin(angleRad);
cell.position.set(
lx * cosA - 0 * sinA,
ly,
lx * sinA + faceDist * cosA
);

if (glassState === 'warm') {
warmWindows.push({ x: cell.position.x, y: ly, z: cell.position.z });
}

tower.add(cell);
}
}

emissiveIntensity: 2.2,
roughness: 0.15,
metalness: 0.0,
fog: false
});

// LEFT RAIL
var leftRail = new THREE.Mesh(
new THREE.BoxGeometry(0.055, TOWER_H + 2, 0.055),
neonMat
);
leftRail.position.set(-RAIL_SEP, (TOWER_H + 2) / 2 + 0.5, LADDER_Z);
cpScene.add(leftRail);

// RIGHT RAIL
var rightRail = new THREE.Mesh(
new THREE.BoxGeometry(0.055, TOWER_H + 2, 0.055),
neonMat
);
rightRail.position.set(RAIL_SEP, (TOWER_H + 2) / 2 + 0.5, LADDER_Z);
cpScene.add(rightRail);

// RUNGS — flat boxes spanning between the rails, clearly visible face-on
var rungMeshes = [];
for (var rung = 0; rung < RUNG_COUNT; rung++) {
var ry = 0.8 + rung * RUNG_SPACING;
var rungMat = neonMat.clone();
var rungMesh = new THREE.Mesh(
new THREE.BoxGeometry(RAIL_SEP * 2, 0.07, 0.07),
rungMat
);
rungMesh.position.set(0, ry, LADDER_Z);
cpScene.add(rungMesh);
rungMeshes.push(rungMesh);
}

// Travelling pulse light
var pulseLight = new THREE.PointLight(0x00aaff, 0.0, 7);
cpScene.add(pulseLight);

// Soft base glow pooling at the bottom
var ladderBaseGlow = new THREE.PointLight(0x0055cc, 0.5, 10);
ladderBaseGlow.position.set(0, 1.5, LADDER_Z + 1);
cpScene.add(ladderBaseGlow);
// The neon in the night air (2026-09-22 polish loop): a soft blue haze
// hanging at the foot of the ladder, where the tubes' light catches the
// damp. One additive sprite; breathes with ladderBaseGlow.
var cpHazeTex = makeCanvasTexture(128, 128, function(cx, w, h) {
  var g = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0, 'rgba(90,170,255,0.55)');
  g.addColorStop(0.45, 'rgba(40,110,220,0.18)');
  g.addColorStop(1, 'rgba(20,60,160,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, w, h);
});
var cpHaze = new THREE.Sprite(new THREE.SpriteMaterial({ map: cpHazeTex, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false }));
cpHaze.position.set(LADDER_X, 1.6, LADDER_Z + 0.9);
cpHaze.scale.set(3.6, 2.2, 1);
cpScene.add(cpHaze);

// ============================================================
// ANIMATION
// ============================================================
var cpClock = new THREE.Clock();
var avBlinkPhase = 0;

function cpAnimate() {
cpAnimId = requestAnimationFrame(cpAnimate);
var t = cpStill ? 3 : cpClock.getElapsedTime();

// --- UPLIGHTING — slow breathing, like a building being dramatic ---
var upBreath = 0.96 + Math.sin(t * 0.18) * 0.03;
upLight1.intensity = 1.8 * upBreath;
upLight2.intensity = 1.5 * upBreath;
upLight3.intensity = 1.0 * upBreath;

// --- AVIATION LIGHT — slow red blink, every ~4 seconds ---
if (!cpStill) avBlinkPhase += 0.016;
var avCycle = Math.sin(avBlinkPhase * 0.8);
var avOn = avCycle > 0.85;
avLight.intensity = avOn ? (avCycle - 0.85) * 12 : 0;
warningLight.material.emissiveIntensity = avOn ? 0.8 + (avCycle - 0.85) * 4 : 0.08;

// --- WINDOW GLOW PULSE (very slow, nearly static) ---
for (var wgi = 0; wgi < windowGlows.length; wgi++) {
windowGlows[wgi].intensity = 0.15 + Math.sin(t * 0.08 + wgi * 0.9) * 0.04;
}

// --- NEON LADDER PULSE ---
// A bright pulse travels upward continuously, looping from bottom to top
var PULSE_SPEED = 4.5;
var pulsePos = (t * PULSE_SPEED) % (RUNG_COUNT + 4);
var pulseY   = 0.8 + pulsePos * RUNG_SPACING;

// Move the travelling point light
pulseLight.position.set(LADDER_X, pulseY, LADDER_Z + 0.8);

// Each rung brightness: peak when pulse is at that rung, fades off quickly
for (var ri = 0; ri < rungMeshes.length; ri++) {
var dist = Math.abs(ri - pulsePos);
var brightness = Math.max(0, 1.0 - dist * 0.55);
// Base flicker on the neon — slow, like a real tube
var neonFlicker = 0.88 + Math.sin(t * 1.4 + ri * 0.3) * 0.06
+ Math.sin(t * 3.1 + ri * 0.7) * 0.03;
rungMeshes[ri].material.emissiveIntensity = (0.5 + brightness * 1.8) * neonFlicker;
}

// Spine pulses with overall neon flicker
var spineFlicker = 0.9 + Math.sin(t * 1.2) * 0.05 + Math.sin(t * 2.8) * 0.03;
leftRail.material.emissiveIntensity  = 1.0 * spineFlicker;
rightRail.material.emissiveIntensity = 1.0 * spineFlicker;

// The pulse light intensity peaks at the centre of the travel
pulseLight.intensity = 1.2 + Math.sin(t * 1.8) * 0.2;

// Base glow breathes slowly
ladderBaseGlow.intensity = 0.35 + Math.sin(t * 0.4) * 0.12;
cpHaze.material.opacity = 0.08 + (ladderBaseGlow.intensity - 0.35) * 0.3 + Math.sin(t * 1.1) * 0.01;

// --- FOG DRIFT --- (held under reduced motion)
for (var fdi = 0; fdi < (cpStill ? 0 : fogSprites.length); fdi++) {
var f = fogSprites[fdi];
f.sway += f.swaySpeed;
f.sprite.position.x = f.baseX + Math.sin(f.sway) * f.swayAmt;
f.baseX += f.drift;
if (f.baseX > 22) f.baseX = -18;
}

if (typeof dssComposerLocal !== 'undefined' && dssComposerLocal) { dssComposerLocal.render(); } else { cpRenderer.render(cpScene, cpCamera); }
}

cpAnimate();

// Vignette
var cpVig = document.createElement('div');
cpVig.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9001;background:radial-gradient(ellipse at 45% 45%, transparent 30%, rgba(0,0,0,0.6) 100%);';
cpWrap.appendChild(cpVig);

// Datestamp

// Caption — Crowley's Thelemic line, sitting ABOVE the CLIMB IT button.
// Styled to match the "There is no part of me that is not of the Gods"
// quote that appears after the liver-eating: Playfair Display caps, gold,
// no italic. Caption at bottom:115px — lowered from 150px so it sits clear
// below the astral constellation that rises over the scene, while keeping
// breathing space above the CLIMB IT button (button top ≈88px).
var cpLoc = document.createElement('div');
cpLoc.classList.add('dss-room-caption');
var cpLocText = 'Every man and every woman is a star.';
cpLoc.style.cssText = 'position:fixed;bottom:115px;left:0;right:0;text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:14px;color:#f5d070;letter-spacing:0.18em;text-transform:uppercase;pointer-events:none;z-index:9003;white-space:nowrap;text-shadow:0 0 8px rgba(245,208,112,0.55),0 0 16px rgba(245,208,112,0.25),0 0 2px rgba(8,6,4,0.95);opacity:0;transition:opacity 1.2s ease;';
// Phone widths: the letter-spaced caps run wider than the screen, so tighten them.
if (window.innerWidth < 480) { cpLoc.style.fontSize = '11px'; cpLoc.style.letterSpacing = '0.1em'; }
cpWrap.appendChild(cpLoc);
// Type the line out one character at a time — an inscription being chiselled,
// echoing the typewriter opening of the game — rather than a flat fade-in.
setTimeout(function() {
cpLoc.style.opacity = '1';
var cpci = 0;
var cpType = setInterval(function() {
cpci++;
cpLoc.textContent = cpLocText.slice(0, cpci);
if (cpci >= cpLocText.length) { clearInterval(cpType); }
}, 80);
}, 2600);

// Button: "CLIMB IT" — brightened from rgba(248,212,128) to a near-white
// gold so it reads as a clear, glowing call-to-action against the dark
// city scene rather than a muted text-link.
var cpBtn = document.createElement('button');
cpBtn.className = 'dss-climb-button';
cpBtn.type = 'button';
cpBtn.textContent = 'CLIMB IT';
cpBtn.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:16px 42px;font:bold 20px "Courier New",monospace;color:rgba(255,255,250,1);border:2px solid rgba(255,252,232,1);letter-spacing:5px;white-space:nowrap;cursor:pointer;z-index:9004;background:rgba(255,236,176,0.22);box-shadow:0 0 18px rgba(255,240,180,0.55),0 0 42px rgba(255,228,148,0.35),inset 0 0 14px rgba(255,248,212,0.25);opacity:0;transition:opacity 5.5s ease;text-shadow:0 0 8px rgba(255,255,255,1),0 0 18px rgba(255,252,220,1),0 0 36px rgba(255,236,168,0.85),0 0 58px rgba(255,220,140,0.55),0 0 2px rgba(8,6,4,0.85);';
setTimeout(function() { cpBtn.style.opacity = '1'; }, 3500);
cpBtn.addEventListener('mouseenter', function() {
cpBtn.style.color = 'rgba(255,252,232,1)';
cpBtn.style.borderColor = 'rgba(255,248,212,1)';
});
cpBtn.addEventListener('mouseleave', function() {
cpBtn.style.color = 'rgba(255,244,200,1)';
cpBtn.style.borderColor = 'rgba(255,232,160,0.95)';
});
cpBtn.addEventListener('click', function() {
// Freeze the canvas animation immediately so the 3D scene doesn't keep
// moving while it fades — kills the perceptual "second flash" some
// players were seeing as the snap-cut at end-of-fade.
if (cpAnimId) { cancelAnimationFrame(cpAnimId); cpAnimId = null; }
cpWrap.style.transition = 'opacity 0.6s ease';
cpWrap.style.opacity = '0';
setTimeout(function() {
if (cpWrap.parentNode) cpWrap.parentNode.removeChild(cpWrap);
// Approach Centre Point's hidden tw-link now targets Alba Complete /
// Alba Incomplete directly (the Centre Point router passage was
// bypassed). Click the first "·" link in the document.
var links = document.querySelectorAll('tw-link, .enchantment-link');
for (var i = 0; i < links.length; i++) {
if (links[i].textContent.trim() === '·') { links[i].click(); break; }
}
}, 650);
});
cpWrap.appendChild(cpBtn);

document.body.appendChild(cpWrap);
}

setInterval(function() {
var container = document.getElementById('cp-container');
if (container && !cpActive) {
initCentrePoint();
} else if (!container) {
cpActive = false;
if (cpAnimId) { cancelAnimationFrame(cpAnimId); cpAnimId = null; }
window._dssDisposeWrap('cp-wrap');
}
}, 300);
})();</script>
