<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nazca Approach — dusk</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
#datestamp {
  position: absolute; top: 18px; right: 24px;
  font: 14px monospace; color: rgba(240,180,110,0.55);
  letter-spacing: 2px; pointer-events: none;
}
#location {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font: 12px 'Courier New', monospace; color: rgba(200,180,140,0.4);
  letter-spacing: 2px; pointer-events: none;
}
#tooltip {
  position: fixed; padding: 6px 14px; background: rgba(20,12,8,0.9);
  border: 1px solid rgba(240,180,110,0.4); font: italic 13px Georgia, serif; color: #f0dcc0;
  pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 10;
}
#tooltip.visible { opacity: 1; }
</style>
</head>
<body>
<div id="datestamp">PERU</div>
<div id="location">NAZCA APPROACH</div>
<div id="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// SCENE SETUP
// ============================================================
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3450);
scene.fog = new THREE.FogExp2(0x9a8a80, 0.0072);

// LAYOUT: the coast road runs away down -z. The Pacific is on the RIGHT (x > 12),
// below a low bluff, the sun going down into it. The cantina stands on the left
// verge at z = -20 facing the road. The camera is on the right-hand verge, a
// little way back, looking down the road on the diagonal: cantina left of centre,
// sea and sun at the right, the road running off into the blue.
var camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 800);
camera.position.set(5.3, 1.7, 5.5);
camera.lookAt(-2.0, 2.2, -24);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping || THREE.LinearToneMapping;
renderer.toneMappingExposure = 0.72;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// CLICK TO ENTER
// ============================================================
var clickableObjects = [], venueData = new Map(), mouseNDC = new THREE.Vector2(-2, -2), mouseMoved = false;
var raycaster = new THREE.Raycaster(), hoveredVenue = null, tooltip = document.getElementById('tooltip');
function makeClickable(mesh, info) { clickableObjects.push(mesh); venueData.set(mesh, info); }
document.addEventListener('mousemove', function(e) {
  mouseMoved = true;
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY - 30) + 'px';
});
document.addEventListener('click', function() {
  if (hoveredVenue) alert('Entering: ' + hoveredVenue.name + '\n\nTwine passage: "' + hoveredVenue.passage + '"');
});

// ============================================================
// HELPERS
// ============================================================
function canvasTex(w, h, draw, rep) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.anisotropy = 8;
  return t;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function mesh(geo, mat, x, y, z, parent) {
  var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function box(w, h, d, mat, x, y, z, parent) { return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent); }
function cyl(rt, rb, h, seg, mat, x, y, z, parent) { return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, parent); }
function radialTex(r, g, b, a, mid) {
  return canvasTex(128, 128, function(ctx) {
    var gr = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
    gr.addColorStop(mid || 0.4, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.4) + ')');
    gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, 128, 128);
  });
}
function halo(r, g, b, size, x, y, z, opacity, noFog, parent) {
  var m = new THREE.SpriteMaterial({ map: radialTex(r, g, b, 0.9), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: opacity || 0.6 });
  if (noFog) m.fog = false;
  var s = new THREE.Sprite(m); s.scale.set(size, size, 1); s.position.set(x, y, z); (parent || scene).add(s); return s;
}

// ============================================================
// SKY: the sun on the sea to the right, the east already blue
// ============================================================
var skyTex = canvasTex(2048, 1024, function(ctx, w, h) {
  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0e1a3a'); g.addColorStop(0.3, '#1e3260'); g.addColorStop(0.42, '#3a5a8a'); g.addColorStop(0.48, '#7a88a0'); g.addColorStop(0.52, '#c89a70'); g.addColorStop(0.555, '#e8a050'); g.addColorStop(0.585, '#c07040'); g.addColorStop(0.62, '#4a3838'); g.addColorStop(1, '#1a1820');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // the sun's glow: right-hand quarter of the dome (texture x ≈ 0.62)
  var sx = w * 0.62, sy = h * 0.565;
  var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, w * 0.22);
  sg.addColorStop(0, 'rgba(255,220,150,0.85)'); sg.addColorStop(0.12, 'rgba(255,180,90,0.55)'); sg.addColorStop(0.4, 'rgba(240,130,60,0.2)'); sg.addColorStop(1, 'rgba(200,90,40,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
  var disc = ctx.createRadialGradient(sx, sy, 0, sx, sy, 26);
  disc.addColorStop(0, 'rgba(255,250,235,1)'); disc.addColorStop(0.7, 'rgba(255,230,180,0.9)'); disc.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = disc; ctx.fillRect(0, 0, w, h);
  // long flat clouds, lit underneath
  for (var i = 0; i < 30; i++) {
    var cy = h * 0.44 + Math.random() * h * 0.1, cw = 80 + Math.random() * 400, cx = Math.random() * w;
    ctx.fillStyle = 'rgba(60,50,70,' + (0.15 + Math.random() * 0.25) + ')'; ctx.beginPath(); ctx.ellipse(cx, cy, cw, 3 + Math.random() * 9, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,170,100,' + (0.12 + Math.random() * 0.2) + ')'; ctx.beginPath(); ctx.ellipse(cx, cy + 5, cw * 0.8, 2 + Math.random() * 3, 0, 0, 6.3); ctx.fill();
  }
  // first stars in the east
  for (var s = 0; s < 120; s++) { var stx = Math.random() * w, sty = Math.random() * h * 0.3; if (Math.abs(stx - sx) < w * 0.25) continue; ctx.fillStyle = 'rgba(255,255,255,' + (0.1 + Math.random() * 0.4) + ')'; ctx.beginPath(); ctx.arc(stx, sty, 0.4 + Math.random() * 0.7, 0, 6.3); ctx.fill(); }
});
var sky = new THREE.Mesh(new THREE.SphereGeometry(600, 40, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
sky.rotation.y = 0.6; scene.add(sky);
// the sun itself, as sprites out over the sea (right, ahead)
var SUN = new THREE.Vector3(80, 18, -340);
var sunCore = halo(255, 240, 200, 26, SUN.x, SUN.y, SUN.z, 1.0, true);
var sunHalo = halo(255, 170, 90, 160, SUN.x, SUN.y, SUN.z, 0.5, true);
halo(255, 120, 60, 420, SUN.x, SUN.y - 10, SUN.z, 0.22, true);

// ============================================================
// LIGHTING: a long low sun from the right, the sky blue from above
// ============================================================
scene.add(new THREE.AmbientLight(0x4a5470, 0.38));
scene.add(new THREE.HemisphereLight(0x4a6aa8, 0x8a7a60, 0.42));
var sun = new THREE.DirectionalLight(0xffa060, 1.15);
sun.position.set(90, 11, -150); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 400; sun.shadow.bias = -0.0005;
scene.add(sun);

// ============================================================
// TEXTURES
// ============================================================
var pampaTex = canvasTex(512, 512, function(ctx, w, h) {
  ctx.fillStyle = '#b8ac98'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 400; i++) { var v = 160 + Math.random() * 60; ctx.fillStyle = 'rgba(' + Math.floor(v) + ',' + Math.floor(v * 0.94) + ',' + Math.floor(v * 0.82) + ',0.35)'; ctx.beginPath(); ctx.ellipse(Math.random() * w, Math.random() * h, 8 + Math.random() * 40, 5 + Math.random() * 20, Math.random() * 3, 0, 6.3); ctx.fill(); }
  for (var p = 0; p < 1600; p++) { var pv = 70 + Math.random() * 110; ctx.fillStyle = 'rgb(' + Math.floor(pv) + ',' + Math.floor(pv * 0.9) + ',' + Math.floor(pv * 0.78) + ')'; ctx.beginPath(); ctx.ellipse(Math.random() * w, Math.random() * h, 0.8 + Math.random() * 3, 0.6 + Math.random() * 2, Math.random() * 3, 0, 6.3); ctx.fill(); }
  for (var c = 0; c < 40; c++) { ctx.strokeStyle = 'rgba(90,80,64,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); var cx0 = Math.random() * w, cy0 = Math.random() * h; ctx.moveTo(cx0, cy0); ctx.lineTo(cx0 + (Math.random() - 0.5) * 60, cy0 + (Math.random() - 0.5) * 60); ctx.stroke(); }
}, [30, 30]);
var pampaMat = new THREE.MeshStandardMaterial({ map: pampaTex, roughness: 0.96, color: 0xc8c0b4 });

var tarmacTex = canvasTex(256, 1024, function(ctx, w, h) {
  ctx.fillStyle = '#4a4744'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 6000; i++) { var v = 50 + Math.random() * 60; ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 4) + ',0.5)'; ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  // sun-faded centre line, broken
  for (var y = 0; y < h; y += 120) { ctx.fillStyle = 'rgba(220,200,150,0.45)'; ctx.fillRect(w / 2 - 4, y, 8, 60); }
  // cracks and patches
  ctx.strokeStyle = 'rgba(20,18,16,0.6)'; ctx.lineWidth = 1.5;
  for (var c = 0; c < 30; c++) { ctx.beginPath(); var x0 = Math.random() * w, y0 = Math.random() * h; ctx.moveTo(x0, y0); for (var k = 0; k < 5; k++) { x0 += (Math.random() - 0.5) * 30; y0 += Math.random() * 30; ctx.lineTo(x0, y0); } ctx.stroke(); }
  for (var pt = 0; pt < 8; pt++) { ctx.fillStyle = 'rgba(30,28,26,0.5)'; ctx.fillRect(Math.random() * w, Math.random() * h, 30 + Math.random() * 60, 20 + Math.random() * 50); }
  // pale dust blown across the edges
  var eg = ctx.createLinearGradient(0, 0, w, 0); eg.addColorStop(0, 'rgba(180,170,150,0.5)'); eg.addColorStop(0.15, 'rgba(180,170,150,0)'); eg.addColorStop(0.85, 'rgba(180,170,150,0)'); eg.addColorStop(1, 'rgba(180,170,150,0.5)');
  ctx.fillStyle = eg; ctx.fillRect(0, 0, w, h);
}, [1, 40]);
var tarmacMat = new THREE.MeshStandardMaterial({ map: tarmacTex, roughness: 0.62, metalness: 0.1 });

var adobeTex = canvasTex(512, 256, function(ctx, w, h) {
  ctx.fillStyle = '#d8c8a8'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 3000; i++) { ctx.fillStyle = 'rgba(120,100,70,' + Math.random() * 0.18 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 4, 2); }
  // render cracked and flaking, a damp tide mark along the base
  ctx.strokeStyle = 'rgba(80,60,40,0.45)'; ctx.lineWidth = 1;
  for (var c = 0; c < 16; c++) { ctx.beginPath(); var x0 = Math.random() * w, y0 = Math.random() * h; ctx.moveTo(x0, y0); for (var k = 0; k < 6; k++) { x0 += (Math.random() - 0.5) * 24; y0 += (Math.random() - 0.3) * 24; ctx.lineTo(x0, y0); } ctx.stroke(); }
  for (var f = 0; f < 10; f++) { ctx.fillStyle = 'rgba(160,120,80,0.35)'; ctx.beginPath(); ctx.ellipse(Math.random() * w, h * 0.6 + Math.random() * h * 0.4, 10 + Math.random() * 30, 6 + Math.random() * 16, 0, 0, 6.3); ctx.fill(); }
  var tg = ctx.createLinearGradient(0, h * 0.75, 0, h); tg.addColorStop(0, 'rgba(90,70,50,0)'); tg.addColorStop(1, 'rgba(90,70,50,0.45)'); ctx.fillStyle = tg; ctx.fillRect(0, h * 0.75, w, h * 0.25);
}, [2, 1]);
var adobeMat = new THREE.MeshStandardMaterial({ map: adobeTex, roughness: 0.95, color: 0xe8d8b8 });
var adobeBlue = new THREE.MeshStandardMaterial({ map: adobeTex, roughness: 0.95, color: 0x6a9ab8 });

var tinTex = canvasTex(256, 256, function(ctx, w, h) {
  for (var x = 0; x < w; x += 16) { var v = 120 + Math.sin(x * 0.4) * 30 + Math.random() * 20; ctx.fillStyle = 'rgb(' + Math.floor(v) + ',' + Math.floor(v * 0.92) + ',' + Math.floor(v * 0.8) + ')'; ctx.fillRect(x, 0, 16, h); }
  for (var r = 0; r < 60; r++) { ctx.fillStyle = 'rgba(150,70,30,' + (0.2 + Math.random() * 0.4) + ')'; ctx.beginPath(); ctx.ellipse(Math.random() * w, Math.random() * h, 3 + Math.random() * 18, 2 + Math.random() * 8, 0, 0, 6.3); ctx.fill(); }
}, [3, 1]);
var tinMat = new THREE.MeshStandardMaterial({ map: tinTex, roughness: 0.5, metalness: 0.5, side: THREE.DoubleSide });

var seaTex = canvasTex(512, 512, function(ctx, w, h) {
  ctx.fillStyle = '#1c3450'; ctx.fillRect(0, 0, w, h);
  for (var y = 0; y < h; y += 2) { ctx.fillStyle = 'rgba(80,120,150,' + (0.04 + Math.sin(y * 0.07) * 0.03) + ')'; ctx.fillRect(0, y, w, 2); }
  for (var k = 0; k < 400; k++) { ctx.fillStyle = 'rgba(255,220,180,' + Math.random() * 0.08 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 4 + Math.random() * 30, 1); }
}, [8, 8]);

// ============================================================
// GROUND: the pampa, the road, the bluff and the sea
// ============================================================
var ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), pampaMat);
ground.rotation.x = -Math.PI / 2; ground.position.set(-590, 0, 0); ground.receiveShadow = true; scene.add(ground);
// the land stops at x = 14: a low bluff dropping to the beach
(function() {
  var bluffMat = new THREE.MeshStandardMaterial({ map: pampaTex, roughness: 0.95, color: 0x9a8e7c });
  for (var z = 120; z > -400; z -= 6) {
    var bx = 9.5 + Math.sin(z * 0.05) * 1.2, bh = 3.2 + Math.sin(z * 0.11) * 0.6;
    var b = box(3, bh, 6.2, bluffMat, bx + 1.5, -bh / 2 + 0.02, z - 3); b.castShadow = false;
    var b2 = box(2, bh * 0.5, 6.2, bluffMat, bx + 3.4, -bh * 0.75, z - 3); b2.castShadow = false;
  }
  // the beach below the bluff, wet and catching the sun
  var beach = new THREE.Mesh(new THREE.PlaneGeometry(14, 600), new THREE.MeshStandardMaterial({ color: 0x8a8070, roughness: 0.35, metalness: 0.25 }));
  beach.rotation.x = -Math.PI / 2; beach.position.set(19, -3.3, -140); scene.add(beach);
})();
var seaMat = new THREE.MeshStandardMaterial({ map: seaTex, color: 0x6a86a0, roughness: 0.22, metalness: 0.6, emissive: 0x0a1a2a, emissiveIntensity: 0.5 });
var seaGeo = new THREE.PlaneGeometry(600, 700, 60, 70);
var seaBase = [];
(function() { var p = seaGeo.attributes.position; for (var i = 0; i < p.count; i++) seaBase.push({ x: p.getX(i), y: p.getY(i) }); })();
var sea = new THREE.Mesh(seaGeo, seaMat); sea.rotation.x = -Math.PI / 2; sea.position.set(322, -3.5, -180); scene.add(sea);
// the sun's road across the water, toward the camera
var sunRoad = new THREE.Mesh(new THREE.PlaneGeometry(40, 320), new THREE.MeshBasicMaterial({ map: canvasTex(128, 512, function(ctx, w, h) {
  var g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(255,190,110,0.8)'); g.addColorStop(0.5, 'rgba(255,170,90,0.4)'); g.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  var side = ctx.createLinearGradient(0, 0, w, 0); side.addColorStop(0, 'rgba(0,0,0,1)'); side.addColorStop(0.35, 'rgba(0,0,0,0)'); side.addColorStop(0.65, 'rgba(0,0,0,0)'); side.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = side; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = 'source-over';
  for (var i = 0; i < 700; i++) { ctx.fillStyle = 'rgba(255,240,200,' + Math.random() * 0.5 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 12, 1); }
}), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
sunRoad.rotation.x = -Math.PI / 2; sunRoad.rotation.z = -Math.atan2(SUN.x - 30, -(SUN.z + 40)); sunRoad.position.set(50, -3.4, -190); scene.add(sunRoad);
// surf at the foot of the bluff
var foamTex = canvasTex(512, 64, function(ctx, w, h) { ctx.clearRect(0, 0, w, h); for (var i = 0; i < 500; i++) { ctx.fillStyle = 'rgba(240,235,225,' + (0.2 + Math.random() * 0.5) + ')'; ctx.beginPath(); ctx.arc(Math.random() * w, h * 0.2 + Math.random() * h * 0.6, 1 + Math.random() * 5, 0, 6.3); ctx.fill(); } var f = ctx.createLinearGradient(0, 0, 0, h); f.addColorStop(0, 'rgba(0,0,0,1)'); f.addColorStop(0.35, 'rgba(0,0,0,0)'); f.addColorStop(0.65, 'rgba(0,0,0,0)'); f.addColorStop(1, 'rgba(0,0,0,1)'); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = f; ctx.fillRect(0, 0, w, h); });
var foamLines = [];
for (var fi = 0; fi < 3; fi++) {
  var fm = new THREE.Mesh(new THREE.PlaneGeometry(600, 2.2 - fi * 0.4), new THREE.MeshBasicMaterial({ map: foamTex, transparent: true, depthWrite: false, opacity: 0.55 - fi * 0.12 }));
  fm.rotation.x = -Math.PI / 2; fm.rotation.z = Math.PI / 2; fm.position.set(24 + fi * 1.6, -3.28 + fi * 0.02, -140); scene.add(fm);
  foamLines.push({ m: fm, baseX: fm.position.x, ph: fi * 1.5, baseOp: fm.material.opacity });
}

// the road: a long strip with a slight bend away to the left in the distance
(function() {
  var segs = 40;
  for (var i = 0; i < segs; i++) {
    var z0 = 20 - i * 12, bend = Math.max(0, -z0 - 60) * 0.06;
    var r = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 12.2), tarmacMat);
    r.rotation.x = -Math.PI / 2; r.rotation.z = -bend * 0.01; r.position.set(-bend, 0.03, z0 - 6); r.receiveShadow = true; scene.add(r);
  }
  // gravel verges and a rusty crash barrier on the sea side
  var verge = new THREE.MeshStandardMaterial({ color: 0x9a9080, roughness: 1 });
  var v1 = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 420), verge); v1.rotation.x = -Math.PI / 2; v1.position.set(4.3, 0.02, -180); scene.add(v1);
  var v2 = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 420), verge); v2.rotation.x = -Math.PI / 2; v2.position.set(-4.3, 0.02, -180); scene.add(v2);
  var rust = new THREE.MeshStandardMaterial({ color: 0x7a5a48, roughness: 0.7, metalness: 0.4 });
  for (var z = 14; z > -110; z -= 4) { cyl(0.06, 0.06, 0.7, 6, rust, 6.2, 0.35, z); }
  box(0.05, 0.3, 124, rust, 6.24, 0.62, -48);
  // stones and scrub along the verges
  var stone = new THREE.MeshStandardMaterial({ color: 0x8a8278, roughness: 0.95 });
  var scrub = new THREE.MeshStandardMaterial({ color: 0x5a5a3a, roughness: 1 });
  for (var i = 0; i < 260; i++) {
    var sx = (Math.random() < 0.5 ? -1 : 1) * rand(4.5, 40), sz = rand(-200, 16);
    if (sx > 8) continue;
    var st = mesh(new THREE.DodecahedronGeometry(rand(0.08, 0.5), 0), stone, sx, 0.08, sz); st.scale.y = 0.5; st.rotation.y = rand(0, 3);
    if (Math.random() < 0.35) { var sc = mesh(new THREE.SphereGeometry(rand(0.2, 0.6), 6, 4), scrub, sx + rand(-1, 1), 0.15, sz + rand(-1, 1)); sc.scale.y = 0.5; }
  }
})();

// ============================================================
// THE CANTINA: a low rendered block on the left verge, tin awning on poles,
// the propeller against the wall, one bulb coming on
// ============================================================
var CX = -10.5, CZ = -21;
var cantina = new THREE.Group();
(function() {
  var g = cantina;
  box(9, 3.4, 7, adobeMat, 0, 1.7, 0, g);                       // the block
  box(9.3, 0.35, 7.3, adobeMat, 0, 3.55, 0, g);                 // parapet cap
  box(9.3, 0.35, 0.3, adobeBlue, 0, 3.2, 3.55, g);              // blue band along the front
  box(9.2, 0.6, 0.06, adobeBlue, 0, 0.3, 3.53, g);              // blue skirting
  // the front wall faces +x (toward the road): rotate the whole group later. Front = local +z here.
  // door, window, shutters
  var wood = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.85 });
  var doorG = new THREE.Group(); g.add(doorG);
  box(1.1, 2.3, 0.08, wood, 0, 1.15, 3.54, doorG);
