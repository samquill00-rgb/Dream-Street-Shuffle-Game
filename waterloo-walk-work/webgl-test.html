<!doctype html><meta charset="utf-8"><title>webgl test</title><canvas id="c" width="800" height="500"></canvas>
<script src="../vendor/three/three.min.js"></script>
<script>
var Q=new URLSearchParams(location.search), n=+(Q.get('canvases')||0), sz=+(Q.get('size')||1024), keep=[];
function say(o){navigator.sendBeacon('http://localhost:8798/log',JSON.stringify(o));}
for(var i=0;i<n;i++){var c=document.createElement('canvas');c.width=sz;c.height=sz;var g=c.getContext('2d');g.fillStyle='#345';g.fillRect(0,0,sz,sz);keep.push(c);}
var r=new THREE.WebGLRenderer({canvas:document.getElementById('c')}), s=new THREE.Scene(), cam=new THREE.PerspectiveCamera(60,1.6,0.1,100); cam.position.z=3;
var texs=keep.slice(0,+(Q.get('upload')||0)).map(function(c){return new THREE.CanvasTexture(c);});
var m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xff8800})); s.add(m);
texs.forEach(function(t,i){var q=new THREE.Mesh(new THREE.PlaneGeometry(0.1,0.1),new THREE.MeshBasicMaterial({map:t}));q.position.x=-2+i*0.05;s.add(q);});
document.getElementById('c').addEventListener('webglcontextlost',function(){say({why:'TEST LOST',canvases:n,size:sz});});
var f=0;(function loop(){f++;m.rotation.y+=0.02;try{r.render(s,cam);}catch(e){say({why:'TEST ERROR',msg:String(e)});return;}if(f===60)say({why:'TEST ok after 60 frames',canvases:n,size:sz,upload:texs.length,lost:r.getContext().isContextLost(),mb:Math.round(n*sz*sz*4/1048576)});requestAnimationFrame(loop);})();
</script>
