<!doctype html><meta charset="utf-8"><body style="margin:0;background:#1a140f">
<script>
function tex(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;}
function rnd(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
</script>
<script src="ghost_tex.js"></script>
<div id="g" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px"></div>
<script>
var G=document.getElementById('g');
for(var s=0;s<6;s++){ [[false,false],[true,false],[false,true],[true,true]].forEach(function(v){
 var c=window.dssGhostTex(tex,rnd,s*2,v[0],v[1], s%3==1?[210,225,180]:null);
 var o=document.createElement('canvas'); o.width=192; o.height=384; var x=o.getContext('2d');
 // additive-ish preview over a warm dark wall with a lamp gradient
 var bg=x.createLinearGradient(0,0,0,384); bg.addColorStop(0,'#3a2c20'); bg.addColorStop(1,'#120d09'); x.fillStyle=bg; x.fillRect(0,0,192,384);
 x.globalCompositeOperation = v[1] ? 'source-over' : 'lighter'; x.globalAlpha = v[1] ? 0.6 : 0.45; x.drawImage(c,0,0,192,384);
 G.appendChild(o); }); }
</script>
