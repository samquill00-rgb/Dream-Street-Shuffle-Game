<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Enlightenment - Airport Pub - 3D Static</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0908; font-family: 'Crimson Text', Georgia, serif; color: #d4c4b0; }
    canvas { display: block; }
    #location {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 24px;
      background: linear-gradient(135deg, rgba(20, 17, 16, 0.9) 0%, rgba(30, 25, 22, 0.85) 100%);
      border: 1px solid rgba(212, 165, 116, 0.4); border-radius: 4px;
      font-family: 'Playfair Display', Georgia, serif; font-size: 12px; letter-spacing: 0.3em;
      color: rgba(212, 165, 116, 0.9); text-shadow: 0 0 15px rgba(212, 165, 116, 0.4); z-index: 50;
    }
    #date {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      font-family: 'Playfair Display', Georgia, serif; font-size: 11px; letter-spacing: 0.2em;
      color: rgba(138, 155, 174, 0.7); z-index: 50;
    }
    #tooltip {
      position: fixed; padding: 8px 18px;
      background: linear-gradient(135deg, rgba(20, 17, 16, 0.95) 0%, rgba(30, 25, 22, 0.9) 100%);
      border: 1px solid rgba(212, 165, 116, 0.6); border-radius: 4px;
      font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 14px; color: #e8d5b7;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 100;
      text-shadow: 0 0 10px rgba(212, 165, 116, 0.4); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #tooltip.visible { opacity: 1; }
    .click-flash { position: fixed; inset: 0; background: rgba(212, 165, 116, 0.15); pointer-events: none; z-index: 200; animation: flash 0.6s ease-out forwards; }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="location">THE ENLIGHTENMENT</div>
<div id="date">AIRPORT PUB</div>
<div id="tooltip"></div>

<script>
// ============================================================
// SCENE SETUP
// ============================================================
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d13);
scene.fog = new THREE.Fog(0x0b0d13, 14, 44);

// ============================================================
// LAYOUT
// ============================================================
// The pub is an open bay cut into the terminal's south wall.
// Frontage runs along z = 0 from x = -7 to x = 7; interior z in [-14, 0].
// The concourse is everything z > 0. The camera stands on the concourse
// off to the RIGHT of the bay, looking across and in: near cage pier at
// the right edge, sign running across the top and off the left, tables
// and the bar receding on the diagonal. Fixed, no drag.
var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.5, 1.75, 6.0);
camera.lookAt(0.5, 2.0, -6);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping || THREE.LinearToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// CLICK TO ENTER
// ============================================================
var clickableObjects = [], venueData = new Map(), mouseNDC = new THREE.Vector2(-2, -2);
var raycaster = new THREE.Raycaster(), hoveredVenue = null, tooltip = document.getElementById('tooltip');
function makeClickable(mesh, info) { clickableObjects.push(mesh); venueData.set(mesh, info); }
document.addEventListener('mousemove', function(e) {
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY - 30) + 'px';
});
document.addEventListener('click', function() {
  if (hoveredVenue) {
    var flash = document.createElement('div'); flash.className = 'click-flash';
    document.body.appendChild(flash); setTimeout(function() { flash.remove(); }, 700);
    alert('Entering: ' + hoveredVenue.name + '\n\nTwine passage: "' + hoveredVenue.passage + '"');
  }
});

// ============================================================
// HELPERS
// ============================================================
function canvasTex(w, h, draw, rep) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.anisotropy = 8;
  return t;
}
function box(w, h, d, mat, x, y, z, opts) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  opts = opts || {};
  m.castShadow = opts.cast !== false; m.receiveShadow = opts.receive !== false;
  if (opts.ry) m.rotation.y = opts.ry;
  (opts.parent || scene).add(m); return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, parent) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; (parent || scene).add(m); return m;
}
function glowSprite(color, size, x, y, z, parent) {
  var t = canvasTex(64, 64, function(ctx) {
    var g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, color + '0.85)'); g.addColorStop(0.4, color + '0.35)'); g.addColorStop(1, color + '0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  });
  var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  s.scale.set(size, size, 1); s.position.set(x, y, z); (parent || scene).add(s); return s;
}
function rand(a, b) { return a + Math.random() * (b - a); }

// ============================================================
// TEXTURES (all procedural)
// ============================================================
// Concourse: big pale ceramic tiles, grout, scuffs
var terminalTileTex = canvasTex(512, 512, function(ctx, w, h) {
  ctx.fillStyle = '#6e6c66'; ctx.fillRect(0, 0, w, h);
  var n = 4, s = w / n;
  for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
    var v = 152 + Math.floor(Math.random() * 12);
    ctx.fillStyle = 'rgb(' + v + ',' + (v - 2) + ',' + (v - 9) + ')';
    ctx.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    for (var k = 0; k < 20; k++) {
      ctx.fillStyle = 'rgba(60,52,44,' + (Math.random() * 0.07) + ')';
      ctx.fillRect(i * s + Math.random() * s, j * s + Math.random() * s, Math.random() * 22, 1 + Math.random() * 2);
    }
  }
  ctx.strokeStyle = '#5a5852'; ctx.lineWidth = 3;
  for (var g = 0; g <= n; g++) { ctx.beginPath(); ctx.moveTo(g * s, 0); ctx.lineTo(g * s, h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, g * s); ctx.lineTo(w, g * s); ctx.stroke(); }
}, [20, 20]);

// Pub boards: reclaimed, worn
var boardTex = canvasTex(512, 512, function(ctx, w, h) {
  ctx.fillStyle = '#3e2a1a'; ctx.fillRect(0, 0, w, h);
  var bw = 40;
  for (var x = 0; x < w; x += bw) {
    var r = 84 + Math.floor(Math.random() * 40), g = 54 + Math.floor(Math.random() * 20), b = 28 + Math.floor(Math.random() * 12);
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')'; ctx.fillRect(x + 1, 0, bw - 2, h);
    for (var k = 0; k < 50; k++) {
      ctx.strokeStyle = 'rgba(28,16,6,' + (0.08 + Math.random() * 0.16) + ')'; ctx.lineWidth = 1; ctx.beginPath();
      var yy = Math.random() * h; ctx.moveTo(x + 2, yy); ctx.lineTo(x + bw - 2, yy + (Math.random() - 0.5) * 8); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(18,10,4,0.75)'; ctx.fillRect(x + 1, Math.random() * h, bw - 2, 2);
    for (var n = 0; n < 3; n++) { ctx.fillStyle = 'rgba(30,20,10,0.6)'; ctx.beginPath(); ctx.arc(x + 6 + Math.random() * (bw - 12), Math.random() * h, 1.5, 0, 6.3); ctx.fill(); }
  }
}, [5, 5]);

// The pub carpet: a proper airport-pub carpet, swirls in maroon, teal and gold
var carpetTex = canvasTex(512, 512, function(ctx, w, h) {
  ctx.fillStyle = '#4a1e2c'; ctx.fillRect(0, 0, w, h);
  var cols = ['#2a6a66', '#b58a2a', '#7a2a3a', '#1c3a4a', '#c9a24a'];
  for (var i = 0; i < 160; i++) {
    ctx.strokeStyle = cols[i % cols.length]; ctx.lineWidth = 3 + Math.random() * 4; ctx.globalAlpha = 0.55 + Math.random() * 0.35;
    ctx.beginPath();
    var cx = Math.random() * w, cy = Math.random() * h, r = 12 + Math.random() * 40;
    ctx.arc(cx, cy, r, Math.random() * 6, Math.random() * 6); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (var k = 0; k < 4000; k++) { ctx.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.25 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, [4, 4]);

// Concourse ceiling tiles
var ceilingTex = canvasTex(256, 256, function(ctx, w, h) {
  ctx.fillStyle = '#cfd0ca'; ctx.fillRect(0, 0, w, h);
  for (var k = 0; k < 1200; k++) { ctx.fillStyle = 'rgba(110,110,105,' + Math.random() * 0.3 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1); }
  ctx.strokeStyle = '#8c8c88'; ctx.lineWidth = 5; ctx.strokeRect(0, 0, w, h);
}, [30, 30]);

// Pub back wall: painted brick, dark
var pubBrickTex = canvasTex(512, 256, function(ctx, w, h) {
  ctx.fillStyle = '#2e2220'; ctx.fillRect(0, 0, w, h);
  var bh = 22, bw = 64;
  for (var row = 0; row < h / bh; row++) {
    var off = (row % 2) * bw / 2;
    for (var x = -bw; x < w + bw; x += bw) {
      var v = 62 + Math.floor(Math.random() * 34);
      ctx.fillStyle = 'rgb(' + (v + 24) + ',' + (v - 2) + ',' + (v - 14) + ')';
      ctx.fillRect(x + off + 2, row * bh + 2, bw - 4, bh - 4);
      ctx.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.25 + ')'; ctx.fillRect(x + off + 2, row * bh + 2, bw - 4, 4);
    }
  }
}, [6, 3]);

// Riveted dark steel for the fascia
var steelTex = canvasTex(512, 128, function(ctx, w, h) {
  ctx.fillStyle = '#1a1614'; ctx.fillRect(0, 0, w, h);
  for (var k = 0; k < 3000; k++) { ctx.fillStyle = 'rgba(80,70,60,' + Math.random() * 0.12 + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 2, 1); }
  for (var x = 12; x < w; x += 48) for (var y = 12; y < h; y += 104) {
    ctx.fillStyle = '#3a332e'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#5a504a'; ctx.beginPath(); ctx.arc(x - 1, y - 1, 2, 0, 6.3); ctx.fill();
  }
}, [4, 1]);

// Timber cladding for the cage shelves and pier sides
var timberTex = canvasTex(256, 256, function(ctx, w, h) {
  ctx.fillStyle = '#6a4a2c'; ctx.fillRect(0, 0, w, h);
  for (var y = 0; y < h; y += 32) {
    var v = 90 + Math.floor(Math.random() * 40);
    ctx.fillStyle = 'rgb(' + v + ',' + (v - 28) + ',' + (v - 50) + ')'; ctx.fillRect(0, y + 1, w, 30);
    for (var k = 0; k < 30; k++) { ctx.strokeStyle = 'rgba(30,18,8,' + Math.random() * 0.25 + ')'; ctx.beginPath(); var yy = y + Math.random() * 30; ctx.moveTo(0, yy); ctx.lineTo(w, yy + (Math.random() - 0.5) * 4); ctx.stroke(); }
  }
}, [2, 2]);

// Sign lettering: dark ground, warm lit letters
function signTex(text, w, h, opts) {
  opts = opts || {};
  return canvasTex(w, h, function(ctx, cw, ch) {
    ctx.fillStyle = opts.bg || '#15100c'; ctx.fillRect(0, 0, cw, ch);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = opts.glow || 'rgba(255,175,85,0.95)'; ctx.shadowBlur = opts.blur || 30;
    ctx.fillStyle = opts.color || '#ffdca6';
    ctx.font = (opts.weight || 'bold ') + Math.floor(ch * (opts.scale || 0.62)) + 'px ' + (opts.font || '"Playfair Display", Georgia, serif');
    ctx.fillText(text, cw / 2, ch / 2 + (opts.dy || 0));
    ctx.shadowBlur = 0;
  });
}

function clockTex(hh, mm, label) {
  return canvasTex(256, 256, function(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath(); ctx.arc(128, 116, 94, 0, Math.PI * 2); ctx.fillStyle = '#ece2cc'; ctx.fill();
    ctx.lineWidth = 9; ctx.strokeStyle = '#241c14'; ctx.stroke();
    ctx.strokeStyle = '#241c14'; ctx.lineWidth = 4;
    for (var i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(128 + Math.sin(a) * 78, 116 - Math.cos(a) * 78); ctx.lineTo(128 + Math.sin(a) * 88, 116 - Math.cos(a) * 88); ctx.stroke(); }
    var ha = ((hh % 12) + mm / 60) / 12 * Math.PI * 2, ma = mm / 60 * Math.PI * 2;
    ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(128, 116); ctx.lineTo(128 + Math.sin(ha) * 48, 116 - Math.cos(ha) * 48); ctx.stroke();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(128, 116); ctx.lineTo(128 + Math.sin(ma) * 74, 116 - Math.cos(ma) * 74); ctx.stroke();
    ctx.fillStyle = '#e8c58c'; ctx.textAlign = 'center'; ctx.font = 'bold 22px Georgia, serif'; ctx.fillText(label, 128, 244);
  });
}

// Departures board (also shown on the pub's TV)
var departuresRows = [['DELHI', 'BOARDING'], ['LIMA', 'GATE 7'], ['HANGA ROA', 'DELAYED'], ['CAIRO', 'WAIT IN LOUNGE'], ['BABYLON', 'SEE AGENT']];
var departuresCanvas = document.createElement('canvas'); departuresCanvas.width = 512; departuresCanvas.height = 384;
function drawDepartures(flipRow, flipPhase) {
  var ctx = departuresCanvas.getContext('2d'), w = 512, h = 384;
  ctx.fillStyle = '#06070a'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#181a22'; ctx.fillRect(0, 0, w, 54);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#c8c8d0'; ctx.font = 'bold 26px Georgia, serif'; ctx.fillText('DEPARTURES', 22, 27);
  ctx.shadowColor = 'rgba(255,190,90,0.9)'; ctx.shadowBlur = 8;
  for (var i = 0; i < departuresRows.length; i++) {
    var y = 92 + i * 60; ctx.fillStyle = '#ffbb55'; ctx.font = 'bold 28px "Courier New", monospace';
    var dest = departuresRows[i][0], stat = departuresRows[i][1];
    if (i === flipRow) { var scr = ''; for (var c = 0; c < stat.length; c++) scr += (Math.random() < flipPhase) ? stat[c] : String.fromCharCode(65 + Math.floor(Math.random() * 26)); stat = scr; }
    ctx.fillText(dest, 22, y); ctx.textAlign = 'right'; ctx.fillText(stat, w - 22, y); ctx.textAlign = 'left';
  }
  ctx.shadowBlur = 0;
}
drawDepartures(-1, 1);
var departuresTex = new THREE.CanvasTexture(departuresCanvas);

var chalkTex = canvasTex(256, 384, function(ctx, w, h) {
  ctx.fillStyle = '#1b1e1b'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 12; ctx.strokeRect(6, 6, w - 12, h - 12);
  ctx.fillStyle = '#e6dfcc'; ctx.textAlign = 'center';
  ctx.font = 'italic 30px Georgia, serif'; ctx.fillText('The', 128, 70);
  ctx.font = 'bold 30px Georgia, serif'; ctx.fillText('Enlightenment', 128, 112);
  ctx.strokeStyle = '#e6dfcc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(60, 132); ctx.lineTo(196, 132); ctx.stroke();
  ctx.fillStyle = '#d9c9a0'; for (var i = 0; i < 6; i++) ctx.fillRect(48 + Math.random() * 20, 160 + i * 30, 120 + Math.random() * 40, 3);
  ctx.fillStyle = '#f0c060'; ctx.font = 'bold 40px Georgia, serif'; ctx.fillText('OPEN', 128, 350);
});

// Seated / standing dark figures, like the Soho window silhouettes
function figureTex(seated, seed) {
  return canvasTex(128, 256, function(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(12,8,4,0.92)';
    var cx = 64, headR = 14 + seed * 4, top = seated ? 70 : 30;
    ctx.beginPath(); ctx.arc(cx + (seed - 0.5) * 6, top, headR, 0, 6.3); ctx.fill();
    ctx.fillRect(cx - 6, top + headR - 2, 12, 14);
    ctx.beginPath(); ctx.ellipse(cx, top + headR + 18, 30 + seed * 8, 12, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 30 - seed * 8, top + headR + 18); ctx.lineTo(cx + 30 + seed * 8, top + headR + 18);
    if (seated) { ctx.lineTo(cx + 34, h * 0.72); ctx.lineTo(cx - 34, h * 0.72); }
    else { ctx.lineTo(cx + 26, h); ctx.lineTo(cx - 26, h); }
    ctx.closePath(); ctx.fill();
    if (seed > 0.5) { ctx.beginPath(); ctx.moveTo(cx + 28, top + headR + 22); ctx.lineTo(cx + 46, top + headR + 4); ctx.lineTo(cx + 52, top + headR + 10); ctx.lineTo(cx + 36, top + headR + 34); ctx.fill(); }
  });
}

// ============================================================
// LIGHTING
// ============================================================
scene.add(new THREE.AmbientLight(0x4c5468, 0.40));
scene.add(new THREE.HemisphereLight(0xb8c4dc, 0x2a2420, 0.34));
var concourseFill = new THREE.DirectionalLight(0xdde6f5, 0.16); concourseFill.position.set(6, 18, 22); scene.add(concourseFill);

// Warm interior fill so the far tables don't sink
var wallWash = new THREE.PointLight(0xcfd8ec, 0.7, 12, 2); wallWash.position.set(9.5, 4.2, 3.0); scene.add(wallWash);
var pubFill = new THREE.PointLight(0xffb070, 0.6, 20, 2); pubFill.position.set(0, 3.0, -7); scene.add(pubFill);

function addSpot(x, y, z, tx, ty, tz, color, intensity, angle, dist, shadow) {
  var s = new THREE.SpotLight(color, intensity, dist, angle, 0.6, 2);
  s.position.set(x, y, z); s.target.position.set(tx, ty, tz);
  if (shadow) { s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0005; }
  scene.add(s); scene.add(s.target); return s;
}
// Fascia downlights washing the threshold
addSpot(-4.5, 3.3, 0.5, -4.5, 0, 0.8, 0xffc070, 1.5, 0.75, 12);
addSpot(0, 3.3, 0.5, 0, 0, 0.8, 0xffc070, 1.8, 0.75, 12, true);
addSpot(4.5, 3.3, 0.5, 4.5, 0, 0.8, 0xffc070, 1.5, 0.75, 12);

// ============================================================
// CONCOURSE
// ============================================================
var terminalFloor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ map: terminalTileTex, roughness: 0.28, metalness: 0.06 }));
terminalFloor.rotation.x = -Math.PI / 2; terminalFloor.position.set(0, 0, 44); terminalFloor.receiveShadow = true; scene.add(terminalFloor);

var terminalCeiling = new THREE.Mesh(new THREE.PlaneGeometry(90, 100), new THREE.MeshLambertMaterial({ map: ceilingTex, emissive: 0x262830 }));
terminalCeiling.rotation.x = Math.PI / 2; terminalCeiling.position.set(0, 5.6, 36); scene.add(terminalCeiling);

// Troffers: emissive panels in the concourse ceiling; a couple are real lights
var troffers = [];
(function() {
  var geo = new THREE.PlaneGeometry(2.4, 0.6), mat = new THREE.MeshBasicMaterial({ color: 0xe2eafa });
  for (var x = -14; x <= 14; x += 7) for (var z = 3; z <= 24; z += 7) {
    var p = new THREE.Mesh(geo, mat.clone()); p.rotation.x = Math.PI / 2; p.position.set(x, 5.58, z); scene.add(p); troffers.push(p);
    if (Math.abs(x) <= 7 && z <= 10) { var l = new THREE.PointLight(0xdde8ff, 0.3, 18, 2); l.position.set(x, 5.2, z); scene.add(l); }
  }
})();
// A ceiling duct and sprinkler heads out on the concourse
(function() {
  var ductMat = new THREE.MeshStandardMaterial({ color: 0x9a9ea6, roughness: 0.35, metalness: 0.7 });
  var d = cyl(0.28, 0.28, 30, 14, ductMat, 3.5, 5.15, 16); d.rotation.x = Math.PI / 2;
  var domeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.1, metalness: 0.4 });
  var dome = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 8, 0, 6.3, Math.PI / 2, Math.PI / 2), domeMat); dome.position.set(6, 5.58, 2.5); scene.add(dome);
})();

// Terminal wall either side of the bay, with skirting and the bulkhead over the bay
var wallMat = new THREE.MeshStandardMaterial({ color: 0xb2afa6, roughness: 0.92 });
box(26, 5.6, 0.6, wallMat, -20, 2.8, 0.3);
box(26, 5.6, 0.6, wallMat, 20, 2.8, 0.3);
box(14, 1.5, 0.6, new THREE.MeshStandardMaterial({ color: 0x8e8a82, roughness: 0.9 }), 0, 4.85, 0.3);
var skirtMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.6 });
box(26, 0.14, 0.04, skirtMat, -20, 0.07, 0.62); box(26, 0.14, 0.04, skirtMat, 20, 0.07, 0.62);

// Fire exit sign on the right wall, glowing green
(function() {
  var t = canvasTex(256, 128, function(ctx, w, h) {
    ctx.fillStyle = '#1c8a3a'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(70, 34, 12, 0, 6.3); ctx.fill();
    ctx.fillRect(58, 50, 22, 40); ctx.fillRect(80, 60, 30, 8); ctx.fillRect(40, 90, 18, 30); ctx.fillRect(74, 90, 26, 12);

// ============================================================
// ANIMATION
// ============================================================
var clock = new THREE.Clock();
var flipRow = -1, flipT = 0, nextFlip = 4;
var tickTroffer = troffers[Math.floor(troffers.length * 0.35)], flickerT = 0;

function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  for (var i = 0; i < pendants.length; i++) pendants[i].intensity = pendants[i].userData.base * (0.97 + 0.03 * Math.sin(t * 1.3 + i * 1.7));

  // one tired fluorescent tube out on the concourse
  flickerT -= dt;
  if (flickerT <= 0) { tickTroffer.material.color.setHex(Math.random() < 0.25 ? 0x6a7080 : 0xe2eafa); flickerT = Math.random() < 0.8 ? 0.06 + Math.random() * 0.3 : 3 + Math.random() * 5; }

  // departures: a row flips over now and then, seen on the pub's TV
  if (flipRow < 0) { nextFlip -= dt; if (nextFlip <= 0) { flipRow = Math.floor(Math.random() * departuresRows.length); flipT = 0; } }
  else {
    flipT += dt * 1.6; drawDepartures(flipRow, Math.min(1, flipT)); departuresTex.needsUpdate = true;
    if (flipT >= 1.2) { flipRow = -1; nextFlip = 5 + Math.random() * 8; drawDepartures(-1, 1); departuresTex.needsUpdate = true; }
  }

  // people shift in their seats
  for (var f = 0; f < figures.length; f++) {
    var fg = figures[f]; fg.phase += fg.speed * dt;
    fg.sprite.position.x = fg.baseX + Math.sin(fg.phase) * fg.amt;
    fg.sprite.position.y += (Math.sin(fg.phase * 0.7) * 0.004 - (fg.sprite.position.y - (fg.sprite.scale.y > 1.5 ? 0.9 : 0.72))) * 0.1;
  }

  raycaster.setFromCamera(mouseNDC, camera);
  var hits = raycaster.intersectObjects(clickableObjects);
  var hv = hits.length ? venueData.get(hits[0].object) : null;
  if (hv !== hoveredVenue) {
    hoveredVenue = hv;
    if (hv) { tooltip.textContent = hv.name; tooltip.classList.add('visible'); document.body.style.cursor = 'pointer'; }
    else { tooltip.classList.remove('visible'); document.body.style.cursor = ''; }
  }

  renderer.render(scene, camera);
}
