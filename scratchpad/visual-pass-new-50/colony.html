</script><script>// ====== dssScene — REUSABLE 3D ATMOSPHERE TOOLKIT ===========
// ============================================================
// Procedural materials and props extracted from the Chippy /
// Pillars / Lackland scenes so new 3D approach scenes can pull
// the same Soho-night look without re-deriving every texture.
//
// Usage (inside a scene IIFE, after THREE is loaded):
//   var brickMat = dssScene.makeGrimyBrick({ baseColor: 0x7a5a48 });
//   var roadMat  = dssScene.makeGrimyRoad();
//   var paveMat  = dssScene.makePavingSlabs();
//   var stucco   = dssScene.makeWeatheredStucco();
//   dssScene.createVictorianGasLamp(scene, -4, 3.5);
//   var btn = dssScene.createEnterButton('ENTER THE SOMEWHERE',
//     function() { /* nav handler */ });
//   wrap.appendChild(btn);
//
// All `make*` factories return a THREE.MeshStandardMaterial with
// `map`/`repeat` set, ready to apply to geometry. `create*`
// factories build a THREE.Group (or DOM element) and add it for
// you when given a parent.
// ------------------------------------------------------------
window.dssScene = (function() {

  // ---------- canvas texture helper ----------
  function makeCanvasTexture(w, h, drawFunc) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    drawFunc(cx, w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------- GRIMY BRICK ----------
  // Running-bond brickwork with mortar courses, soot streaks,
  // damp/lichen patches, paste-up ghost, top soot wash.
  // opts:
  //   baseColor:  fill rgb (default 0x6f4f3a)
  //   repeat:     [u, v] tiling (default [2, 4])
  //   sootStreaks: count (default 5)
  //   dampPatches: count (default 5)
  //   lichen:      count (default 12)
  //   highlightBricks: count of brighter-painted bricks (default 8)
  function makeGrimyBrick(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x6f4f3a).toString(16).padStart(6, '0');
    var streaks = opts.sootStreaks != null ? opts.sootStreaks : 5;
    var damp    = opts.dampPatches != null ? opts.dampPatches : 5;
    var lichen  = opts.lichen      != null ? opts.lichen      : 12;
    var highlights = opts.highlightBricks != null ? opts.highlightBricks : 8;
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var bH = 14, bW = 32;
      for (var by = 0; by < h; by += bH) {
        var rowOff = ((Math.floor(by / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var bx = -bW; bx < w + bW; bx += bW) {
          var px = bx + rowOff;
          var r = 95 + Math.floor(Math.random() * 50);
          var g = 60 + Math.floor(Math.random() * 35);
          var b = 45 + Math.floor(Math.random() * 30);
          if (Math.random() > 0.94) { r -= 40; g -= 32; b -= 22; }
          if (Math.random() > 0.96) { r += 30; g += 18; b += 10; }
          cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          cx.fillRect(px + 1, by + 1, bW - 2, bH - 2);
          cx.fillStyle = 'rgba(20,12,6,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
          cx.fillRect(px + 1, by + bH - 3, bW - 2, 2);
        }
      }
      cx.fillStyle = 'rgba(170, 145, 115, 0.32)';
      for (var hy = 0; hy < h; hy += bH) cx.fillRect(0, hy, w, 1);
      cx.fillStyle = 'rgba(160, 135, 105, 0.22)';
      for (var hyy = 0; hyy < h; hyy += bH) {
        var ro = ((Math.floor(hyy / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var hxx = ro; hxx < w; hxx += bW) cx.fillRect(hxx, hyy, 1.4, bH);
      }
      for (var ss = 0; ss < streaks; ss++) {
        var sx = Math.random() * w;
        var sxw = 12 + Math.random() * 30;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(8, 6, 4, 0.55)');
        sg.addColorStop(0.3, 'rgba(12, 10, 6, 0.32)');
        sg.addColorStop(0.7, 'rgba(18, 14, 9, 0.12)');
        sg.addColorStop(1, 'rgba(22, 18, 10, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < damp; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.45 + Math.random() * h * 0.55;
        var dr = 30 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(60, 75, 55, 0.32)');
        dg2.addColorStop(0.5, 'rgba(50, 60, 45, 0.16)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      for (var lp = 0; lp < lichen; lp++) {
        cx.fillStyle = 'rgba(95, 105, 60, ' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          5 + Math.random() * 12, 3 + Math.random() * 6.6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var topG = cx.createLinearGradient(0, 0, 0, h * 0.45);
      topG.addColorStop(0, 'rgba(18, 12, 8, 0.42)');
      topG.addColorStop(1, 'rgba(18, 12, 8, 0)');
      cx.fillStyle = topG; cx.fillRect(0, 0, w, h * 0.45);
      cx.fillStyle = 'rgba(220, 200, 160, 0.08)';
      cx.fillRect(w * 0.12, h * 0.42, w * 0.18, h * 0.13);
      for (var hl = 0; hl < highlights; hl++) {
        var hbx = Math.floor(Math.random() * (w / bW)) * bW;
        var hby = Math.floor(Math.random() * (h / bH)) * bH;
        cx.fillStyle = 'rgba(220, 195, 150, ' + (0.10 + Math.random() * 0.15).toFixed(3) + ')';
        cx.fillRect(hbx + 1, hby + 1, bW - 2, 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 });
  }

  // ---------- WEATHERED STUCCO ----------
  // Cream stucco with hairline cracks, nicotine wash pooling
  // lower, soot streaks from gutters, damp/green patches, paint-
  // patch repairs, paste-up ghost, bird splat.
  // opts:
  //   baseColor: default 0xc8b89a
  //   repeat:    default [2, 3]
  function makeWeatheredStucco(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0xc8b89a).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var pp = 0; pp < 350; pp++) {
        var b = 180 + Math.floor(Math.random() * 30);
        cx.fillStyle = 'rgba(' + b + ',' + (b - 18) + ',' + (b - 32) + ',0.12)';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          6 + Math.random() * 24, 4 + Math.random() * 14, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var nicoG = cx.createLinearGradient(0, h * 0.35, 0, h);
      nicoG.addColorStop(0, 'rgba(170, 145, 80, 0)');
      nicoG.addColorStop(0.6, 'rgba(170, 145, 80, 0.10)');
      nicoG.addColorStop(1, 'rgba(160, 130, 60, 0.18)');
      cx.fillStyle = nicoG; cx.fillRect(0, h * 0.35, w, h * 0.65);
      for (var ss = 0; ss < 6; ss++) {
        var sx = Math.random() * w;
        var sxw = 10 + Math.random() * 26;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(15, 12, 8, 0.50)');
        sg.addColorStop(0.4, 'rgba(20, 16, 10, 0.22)');
        sg.addColorStop(0.85, 'rgba(25, 20, 12, 0.08)');
        sg.addColorStop(1, 'rgba(25, 20, 12, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < 4; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.7 + Math.random() * h * 0.3;
        var dr = 32 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(70, 80, 55, 0.30)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      cx.strokeStyle = 'rgba(50, 38, 22, 0.45)'; cx.lineWidth = 0.7;
      for (var ch = 0; ch < 14; ch++) {
        cx.beginPath();
        var cxh = Math.random() * w, cyh = Math.random() * h;
        cx.moveTo(cxh, cyh);
        for (var sg2 = 0; sg2 < 5; sg2++) {
          cxh += (Math.random() - 0.5) * 28; cyh += 12 + Math.random() * 22;
          cx.lineTo(cxh, cyh);
        }
        cx.stroke();
      }
      for (var pr = 0; pr < 8; pr++) {
        var prx = Math.random() * w, pry = Math.random() * h;
        var prr = 12 + Math.random() * 22;
        var pg = cx.createRadialGradient(prx, pry, 0, prx, pry, prr);
        pg.addColorStop(0, 'rgba(225, 210, 180, 0.45)');
        pg.addColorStop(0.6, 'rgba(220, 200, 170, 0.14)');
        pg.addColorStop(1, 'rgba(220, 200, 170, 0)');
        cx.fillStyle = pg;
        cx.beginPath();
        cx.ellipse(prx, pry, prr, prr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(200, 170, 130, 0.10)';
      cx.fillRect(w * 0.18, h * 0.55, w * 0.12, h * 0.10);
      cx.fillStyle = 'rgba(245, 240, 215, 0.36)';
      cx.beginPath();
      cx.ellipse(w * 0.88, h * 0.08, 5, 2.5, 0.4, 0, Math.PI * 2);
      cx.fill();
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 3];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
  }

  // ---------- GRIMY ROAD ----------
  // Tarmac with aggregate speckle, lighter repair patches, jagged
  // cracks, wandering tar-seal sealant lines, oil blotches, faded
  // white centre line.
  function makeGrimyRoad(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x1c1c1c).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var p = 0; p < 4200; p++) {
        var pg = 25 + Math.floor(Math.random() * 70);
        cx.fillStyle = 'rgba(' + pg + ',' + pg + ',' + pg + ',0.42)';
        cx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }
      for (var rp = 0; rp < 6; rp++) {
        var rx = Math.random() * w, ry = Math.random() * h;
        var rwd = 50 + Math.random() * 100, rht = 35 + Math.random() * 70;
        cx.fillStyle = 'rgba(78, 78, 78, ' + (0.16 + Math.random() * 0.22).toFixed(3) + ')';
        cx.fillRect(rx, ry, rwd, rht);
        cx.strokeStyle = 'rgba(100, 100, 100, 0.18)'; cx.lineWidth = 0.6;
        cx.strokeRect(rx, ry, rwd, rht);
      }
      cx.strokeStyle = 'rgba(8, 8, 8, 0.8)'; cx.lineWidth = 1.2;
      for (var c = 0; c < 10; c++) {
        cx.beginPath();
        var cx0 = Math.random() * w, cy0 = Math.random() * h;
        cx.moveTo(cx0, cy0);
        var ang = Math.random() * Math.PI * 2, len = 30 + Math.random() * 80;
        cx.lineTo(cx0 + Math.cos(ang) * len, cy0 + Math.sin(ang) * len);
        cx.lineTo(cx0 + Math.cos(ang + 0.4) * len * 1.4, cy0 + Math.sin(ang + 0.4) * len * 1.4);
        cx.stroke();
      }
      cx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; cx.lineWidth = 2.6;
      for (var tm = 0; tm < 5; tm++) {
        cx.beginPath();
        var tx = Math.random() * w, ty = Math.random() * h;
        cx.moveTo(tx, ty);
        for (var ts = 0; ts < 5; ts++) {
          tx += (Math.random() - 0.5) * 30; ty += 8 + Math.random() * 16;
          cx.lineTo(tx, ty);
        }
        cx.stroke();
      }
      cx.fillStyle = 'rgba(220, 220, 200, 0.5)';
      cx.fillRect(w * 0.5 - 2, h * 0.3, 4, h * 0.4);
      cx.fillStyle = 'rgba(220, 220, 200, 0.18)';
      cx.fillRect(w * 0.5 - 2, h * 0.05, 4, h * 0.2);
      cx.fillRect(w * 0.5 - 2, h * 0.75, 4, h * 0.2);
      for (var os = 0; os < 4; os++) {
        var ox = Math.random() * w, oy = Math.random() * h;
        var orr = 8 + Math.random() * 18;
        var og = cx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        og.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
        og.addColorStop(0.7, 'rgba(15, 12, 5, 0.22)');
        og.addColorStop(1, 'rgba(15, 12, 5, 0)');
        cx.fillStyle = og; cx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [1, 8];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.18 });
  }

  // ---------- PAVING SLABS ----------
  // London paving slabs with grout, cracks, gum/fag-ends and
  // wet patches.
  function makePavingSlabs(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x3a3a36).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var sw = 128, sh = 96;
      cx.strokeStyle = 'rgba(18, 18, 16, 0.55)'; cx.lineWidth = 1.4;
      for (var sy = 0; sy < h; sy += sh) {
        var off = ((sy / sh) % 2 === 0) ? 0 : sw / 2;
        for (var sx = -sw; sx < w + sw; sx += sw) {
          var bxp = sx + off;
          var sg = 48 + Math.floor(Math.random() * 28);
          cx.fillStyle = 'rgba(' + sg + ',' + sg + ',' + (sg - 4) + ',' + (0.32 + Math.random() * 0.3).toFixed(3) + ')';
          cx.fillRect(bxp, sy, sw, sh);
          cx.strokeRect(bxp, sy, sw, sh);
        }
      }
      cx.strokeStyle = 'rgba(15, 15, 12, 0.55)'; cx.lineWidth = 0.9;
      for (var c2 = 0; c2 < 7; c2++) {
        cx.beginPath();
        cx.moveTo(Math.random() * w, Math.random() * h);
        cx.lineTo(Math.random() * w, Math.random() * h);
        cx.stroke();
      }
      for (var fe = 0; fe < 60; fe++) {
        cx.fillStyle = 'rgba(180, 175, 165, ' + (0.15 + Math.random() * 0.22).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(Math.random() * w, Math.random() * h, 1.0 + Math.random() * 1.6, 0, Math.PI * 2);
        cx.fill();
      }
      for (var wp = 0; wp < 5; wp++) {
        var wpx = Math.random() * w, wpy = Math.random() * h;
        var wpr = 35 + Math.random() * 60;
        var wpg = cx.createRadialGradient(wpx, wpy, 0, wpx, wpy, wpr);
        wpg.addColorStop(0, 'rgba(72, 78, 80, 0.35)');
        wpg.addColorStop(1, 'rgba(72, 78, 80, 0)');
        cx.fillStyle = wpg; cx.fillRect(wpx - wpr, wpy - wpr, wpr * 2, wpr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [4, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88 });
  }

  // ---------- VICTORIAN GAS LAMP ----------
  // Cast-iron stepped base, fluted shaft, mid-band, ladder rest,
  // capital, 4-sided emissive glass lantern, pyramidal cap,
  // crown finial, point light, halo + inner-core sprites.
  // Adds the lamp group to `parent` at (x, 0, z). Returns the
  // group (with `.userData.light` set to the PointLight).
  //
  // opts:
  //   intensity:   point-light intensity (default 0.5)
  //   distance:    point-light range (default 10)
  //   lampColor:   point-light + glow colour (default 0xffd6a0)
  //   haloScale:   outer halo sprite size (default 2.2)
  //   coreScale:   inner-core sprite size (default 0.9)
  //   paneColor:   solid emissive pane colour (default 0xfff0c8)
  function createVictorianGasLamp(parent, x, z, opts) {
    opts = opts || {};
    var lampColor = opts.lampColor || 0xffd6a0;
    var paneColor = opts.paneColor || 0xfff0c8;
    var g = new THREE.Group();
    var castIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.78, metalness: 0.22 });
    var darkIron = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.7, metalness: 0.3 });
    var brassish = new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.35 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m;
    }
    // Stepped base
    place(new THREE.CylinderGeometry(0.24, 0.28, 0.10, 16), castIron, 0, 0.05, 0);
    place(new THREE.CylinderGeometry(0.20, 0.24, 0.18, 16), castIron, 0, 0.19, 0);
    place(new THREE.CylinderGeometry(0.17, 0.20, 0.05, 16), darkIron, 0, 0.31, 0);
    place(new THREE.BoxGeometry(0.32, 0.32, 0.32), castIron, 0, 0.50, 0);
    place(new THREE.CylinderGeometry(0.11, 0.16, 0.06, 16), darkIron, 0, 0.69, 0);
    // Shaft
    place(new THREE.CylinderGeometry(0.058, 0.10, 3.9, 16), castIron, 0, 2.65, 0);
    // Mid-band
    place(new THREE.CylinderGeometry(0.082, 0.082, 0.06, 16), darkIron, 0, 1.55, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.58, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.52, 0);
    // Ladder rest
    place(new THREE.BoxGeometry(0.52, 0.018, 0.018), castIron, 0, 4.45, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.52), castIron, 0, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron,  0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, -0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45,  0.26);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45, -0.26);
    // Capital
    place(new THREE.CylinderGeometry(0.085, 0.062, 0.08, 16), castIron, 0, 4.66, 0);
    place(new THREE.CylinderGeometry(0.105, 0.085, 0.04, 16), darkIron, 0, 4.72, 0);
    place(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12), castIron, 0, 4.81, 0);
    // Lantern base + 4 emissive panes
    place(new THREE.BoxGeometry(0.34, 0.04, 0.34), darkIron, 0, 4.91, 0);
    var paneMat = new THREE.MeshBasicMaterial({ color: paneColor });
    var paneF = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneF.position.set(0, 5.16, 0.134); g.add(paneF);
    var paneB = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneB.position.set(0, 5.16, -0.134); paneB.rotation.y = Math.PI; g.add(paneB);
    var paneL = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneL.position.set(-0.134, 5.16, 0); paneL.rotation.y = Math.PI / 2; g.add(paneL);
    var paneR = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneR.position.set(0.134, 5.16, 0); paneR.rotation.y = -Math.PI / 2; g.add(paneR);
    // Corner posts + cross-bars
    var corners = [[0.135, 0.135], [-0.135, 0.135], [0.135, -0.135], [-0.135, -0.135]];
    for (var cp = 0; cp < 4; cp++) {
      place(new THREE.BoxGeometry(0.028, 0.44, 0.028), darkIron, corners[cp][0], 5.16, corners[cp][1]);
    }
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16,  0.135);

// HELPERS (must be defined before any textures)
// ============================================================
function makeCanvasTexture(w, h, drawFunc) {
var c = document.createElement('canvas');
c.width = w; c.height = h;
var cx = c.getContext('2d');
drawFunc(cx, w, h);
var tex = new THREE.CanvasTexture(c);
tex.minFilter = THREE.LinearFilter;
return tex;
}

function placeMesh(geo, mat, x, y, z) {
var m = new THREE.Mesh(geo, mat);
m.position.set(x, y, z);
scene.add(m);
return m;
}

// Dark umbra brick — sooty London stock with mortar lines
var brickTex = makeCanvasTexture(512, 1024, function(cx, w, h) {
// Base umbra tone
cx.fillStyle = '#3a2e25';
cx.fillRect(0, 0, w, h);
// Brick rows — each brick individually coloured
var brickH = 18;
var mortarW = 3;
var brickW = 55;
for (var row = 0; row < Math.ceil(h / (brickH + mortarW)); row++) {
var by = row * (brickH + mortarW);
var offset = (row % 2 === 0) ? 0 : brickW / 2;
for (var bx = -brickW; bx < w + brickW; bx += brickW + mortarW) {
var x = bx + offset;
// Each brick gets a slightly different shade of umbra/brown
var r = 48 + Math.floor(Math.random() * 22);
var g = 36 + Math.floor(Math.random() * 16);
var b = 28 + Math.floor(Math.random() * 12);
cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
cx.fillRect(x, by, brickW, brickH);
// Subtle face variation on each brick
cx.fillStyle = 'rgba(' + (r + 10) + ',' + (g + 8) + ',' + (b + 5) + ', 0.15)';
cx.fillRect(x + 2, by + 2, brickW - 4, brickH - 4);
}
// Mortar line (horizontal)
cx.fillStyle = 'rgba(55, 48, 40, 0.6)';
cx.fillRect(0, by + brickH, w, mortarW);
}
// Vertical mortar lines
for (var row = 0; row < Math.ceil(h / (brickH + mortarW)); row++) {
var by = row * (brickH + mortarW);
var offset = (row % 2 === 0) ? 0 : brickW / 2;
for (var bx = -brickW; bx < w + brickW; bx += brickW + mortarW) {
var x = bx + offset;
cx.fillStyle = 'rgba(55, 48, 40, 0.5)';
cx.fillRect(x - 1, by, mortarW, brickH);
}
}
// Heavy soot wash — decades of London grime
var sootWash = cx.createLinearGradient(0, 0, 0, h);
sootWash.addColorStop(0, 'rgba(10, 8, 5, 0.4)');
sootWash.addColorStop(0.1, 'rgba(15, 12, 8, 0.2)');
sootWash.addColorStop(0.5, 'rgba(12, 10, 6, 0.1)');
sootWash.addColorStop(0.85, 'rgba(10, 8, 5, 0.15)');
sootWash.addColorStop(1, 'rgba(8, 6, 3, 0.35)');
cx.fillStyle = sootWash;
cx.fillRect(0, 0, w, h);
// Dark rain streaks running down the bricks — heavy water staining
cx.strokeStyle = 'rgba(18, 14, 10, 0.15)';
cx.lineWidth = 3;
for (var rs = 0; rs < 30; rs++) {
cx.beginPath();
var rx = Math.random() * w;
cx.moveTo(rx, 0);
for (var ry = 0; ry < h; ry += 20) {
rx += (Math.random() - 0.5) * 3;
cx.lineTo(rx, ry);
}
cx.stroke();
}
// Damp patches — more and darker
cx.fillStyle = 'rgba(18, 14, 10, 0.18)';
for (var dp = 0; dp < 8; dp++) {
cx.beginPath();
cx.ellipse(Math.random() * w, h * 0.5 + Math.random() * h * 0.5, 35 + Math.random() * 60, 25 + Math.random() * 40, Math.random(), 0, Math.PI * 2);
cx.fill();
}
// Green algae/moss at base of building
cx.fillStyle = 'rgba(25, 38, 15, 0.2)';
cx.fillRect(0, h * 0.9, w, h * 0.1);
for (var ag = 0; ag < 10; ag++) {
cx.fillStyle = 'rgba(28, 42, 18, 0.15)';
cx.beginPath();
cx.ellipse(Math.random() * w, h * 0.88 + Math.random() * h * 0.12, 15 + Math.random() * 30, 8 + Math.random() * 15, 0, 0, Math.PI * 2);
cx.fill();
}
// Pigeon droppings — white splatters
cx.fillStyle = 'rgba(140, 135, 120, 0.12)';
for (var pd = 0; pd < 6; pd++) {
cx.beginPath();
cx.ellipse(Math.random() * w, Math.random() * h * 0.4, 3 + Math.random() * 8, 5 + Math.random() * 12, Math.random(), 0, Math.PI * 2);
cx.fill();
}
});

// Pavement texture — dark York stone flags, browner and grimier than Portland
var paveTex = makeCanvasTexture(512, 512, function(cx, w, h) {
cx.fillStyle = '#332c1e';
cx.fillRect(0, 0, w, h);
var flagRows = [
{ y: 0, h: 128 }, { y: 128, h: 110 },
{ y: 238, h: 140 }, { y: 378, h: 134 }
];
for (var ri = 0; ri < flagRows.length; ri++) {
var row = flagRows[ri];
var slabs = (ri % 2 === 0) ? [0, 200, 380] : [0, 260, 420];
for (var si = 0; si < slabs.length; si++) {
var sx = slabs[si];
var sw = (si < slabs.length - 1) ? slabs[si + 1] - sx : w - sx;
var tone = 35 + Math.random() * 18;
cx.fillStyle = 'rgb(' + tone + ',' + (tone - 5) + ',' + (tone - 12) + ')';
cx.fillRect(sx + 2, row.y + 2, sw - 4, row.h - 4);
cx.fillStyle = 'rgba(60, 55, 45, 0.08)';
for (var sp = 0; sp < 10; sp++) {
cx.beginPath();
cx.ellipse(sx + Math.random() * sw, row.y + Math.random() * row.h, 10 + Math.random() * 25, 5 + Math.random() * 12, Math.random(), 0, Math.PI * 2);
cx.fill();
}
}
}
cx.strokeStyle = 'rgba(18, 15, 10, 0.7)';
cx.lineWidth = 3;
for (var ri = 0; ri < flagRows.length; ri++) {
cx.beginPath(); cx.moveTo(0, flagRows[ri].y); cx.lineTo(w, flagRows[ri].y); cx.stroke();
}
var vertLines1 = [200, 380]; var vertLines2 = [260, 420];
for (var ri = 0; ri < flagRows.length; ri++) {
var row = flagRows[ri];
var vlines = (ri % 2 === 0) ? vertLines1 : vertLines2;
for (var vi = 0; vi < vlines.length; vi++) {
cx.beginPath(); cx.moveTo(vlines[vi], row.y); cx.lineTo(vlines[vi], row.y + row.h); cx.stroke();
}
}
// Deep joint grime
cx.fillStyle = 'rgba(10, 8, 5, 0.3)';
for (var ri = 0; ri < flagRows.length; ri++) { cx.fillRect(0, flagRows[ri].y - 1, w, 5); }
// Dark stains — spilled drinks, oil, old gum
cx.fillStyle = 'rgba(20, 18, 12, 0.3)';
for (var st = 0; st < 15; st++) {
cx.beginPath();
cx.ellipse(Math.random() * w, Math.random() * h, 10 + Math.random() * 30, 8 + Math.random() * 20, Math.random() * Math.PI, 0, Math.PI * 2);
cx.fill();
}
// Old chewing gum spots
cx.fillStyle = 'rgba(50, 48, 42, 0.4)';
for (var gm = 0; gm < 12; gm++) {
cx.beginPath(); cx.arc(Math.random() * w, Math.random() * h, 2 + Math.random() * 5, 0, Math.PI * 2); cx.fill();
}
// Large damp/grimy patches
cx.fillStyle = 'rgba(22, 20, 15, 0.18)';
for (var dp = 0; dp < 6; dp++) {
cx.beginPath();
cx.ellipse(Math.random() * w, Math.random() * h, 30 + Math.random() * 60, 25 + Math.random() * 40, Math.random(), 0, Math.PI * 2);
cx.fill();
}
// Greenish moss in cracks
cx.fillStyle = 'rgba(30, 40, 18, 0.15)';
for (var ri = 0; ri < flagRows.length; ri++) {
for (var ms = 0; ms < 3; ms++) {
cx.beginPath();
cx.ellipse(Math.random() * w, flagRows[ri].y + Math.random() * 6 - 3, 8 + Math.random() * 15, 3 + Math.random() * 4, 0, 0, Math.PI * 2);
cx.fill();
}
}

function buildDoor(xPos, doorMat, panelMat, mouldMat, parentGroup) {
var dg = new THREE.Group();

// Door recess
var recess = new THREE.Mesh(
new THREE.BoxGeometry(1.4, 3.2, 0.3),
new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.9 })
);
recess.position.set(0, 1.7, -0.05);

// Wooden doorframe
var fL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.9, 0.07), woodFrameMat);
fL.position.set(-0.6, 1.55, 0.06); dg.add(fL);
var fR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.9, 0.07), woodFrameMat);
fR.position.set(0.6, 1.55, 0.06); dg.add(fR);
var fT = new THREE.Mesh(new THREE.BoxGeometry(1.28, 0.08, 0.07), woodFrameMat);
fT.position.set(0, 3.01, 0.06); dg.add(fT);
var fB = new THREE.Mesh(new THREE.BoxGeometry(1.28, 0.05, 0.07), woodFrameMat);
fB.position.set(0, 0.13, 0.06); dg.add(fB);

// Door slab
var slab = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.8, 0.08), doorMat);
slab.position.set(0, 1.55, 0.08);
slab.castShadow = true;
dg.add(slab);

// 6 panels (Georgian layout)
var pGeo1 = new THREE.BoxGeometry(0.38, 0.65, 0.03);
dg.add(new THREE.Mesh(pGeo1, panelMat).translateX(-0.22).translateY(2.55).translateZ(0.12));
dg.add(new THREE.Mesh(pGeo1, panelMat).translateX(0.22).translateY(2.55).translateZ(0.12));
var pGeo2 = new THREE.BoxGeometry(0.38, 0.45, 0.03);
dg.add(new THREE.Mesh(pGeo2, panelMat).translateX(-0.22).translateY(1.65).translateZ(0.12));
dg.add(new THREE.Mesh(pGeo2, panelMat).translateX(0.22).translateY(1.65).translateZ(0.12));
var pGeo3 = new THREE.BoxGeometry(0.38, 0.6, 0.03);
dg.add(new THREE.Mesh(pGeo3, panelMat).translateX(-0.22).translateY(0.75).translateZ(0.12));
dg.add(new THREE.Mesh(pGeo3, panelMat).translateX(0.22).translateY(0.75).translateZ(0.12));

// Panel mouldings
function addMould(cx, cy, pw, ph) {
dg.add(new THREE.Mesh(new THREE.BoxGeometry(pw + 0.06, 0.025, 0.02), mouldMat).translateX(cx).translateY(cy + ph/2 + 0.01).translateZ(0.13));
dg.add(new THREE.Mesh(new THREE.BoxGeometry(pw + 0.06, 0.025, 0.02), mouldMat).translateX(cx).translateY(cy - ph/2 - 0.01).translateZ(0.13));
dg.add(new THREE.Mesh(new THREE.BoxGeometry(0.025, ph + 0.06, 0.02), mouldMat).translateX(cx - pw/2 - 0.01).translateY(cy).translateZ(0.13));
dg.add(new THREE.Mesh(new THREE.BoxGeometry(0.025, ph + 0.06, 0.02), mouldMat).translateX(cx + pw/2 + 0.01).translateY(cy).translateZ(0.13));
}
addMould(-0.22, 2.55, 0.38, 0.65);
addMould(0.22, 2.55, 0.38, 0.65);
addMould(-0.22, 1.65, 0.38, 0.45);
addMould(0.22, 1.65, 0.38, 0.45);
addMould(-0.22, 0.75, 0.38, 0.6);
addMould(0.22, 0.75, 0.38, 0.6);

// Centre stile
dg.add(new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.6, 0.02), doorMat).translateX(0).translateY(1.55).translateZ(0.12));

// Brass knob — centred
var bp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.015, 16), brassMat);
bp.rotation.x = Math.PI / 2; bp.position.set(0, 1.55, 0.14); dg.add(bp);

function enableCrSceneShadows(root) {
  root.traverse(function(obj) {
    if (!(obj instanceof THREE.Mesh)) return;
    var mat = obj.material;
    if (mat && (mat.transparent === true && (mat.opacity || 1) < 0.7)) return;
    obj.receiveShadow = true;
    if (obj.position.y > 0.2 || (obj.geometry && obj.geometry.type !== 'PlaneGeometry')) {
      obj.castShadow = true;
    }
  });
}

var grad = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
grad.addColorStop(0, 'rgba(100, 95, 85, 0.18)');
grad.addColorStop(0.6, 'rgba(80, 75, 65, 0.08)');
grad.addColorStop(1, 'rgba(60, 55, 45, 0)');
cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
});
var gingerFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
var grad = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
grad.addColorStop(0, 'rgba(232, 120, 24, 0.3)');
grad.addColorStop(0.3, 'rgba(210, 95, 18, 0.15)');

grad.addColorStop(1, 'rgba(140, 50, 8, 0)');
cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
});

var fogSprites = [];

// LAYER 1: Ground-hugging
for (var i = 0; i < 60; i++) {
var fogMat = new THREE.SpriteMaterial({
map: thickFogTex, transparent: true, opacity: 0.3 + Math.random() * 0.25
});
var fog = new THREE.Sprite(fogMat);
fog.position.set(Math.random() * 40 - 15, 0.1 + Math.random() * 1.8, Math.random() * 30 - 5);
var s = 5 + Math.random() * 12;
fog.scale.set(s, s * 0.3, 1);
scene.add(fog);
fogSprites.push({
sprite: fog, baseX: fog.position.x,
drift: 0.002 + Math.random() * 0.005,
sway: Math.random() * Math.PI * 2,
swaySpeed: 0.001 + Math.random() * 0.004,
swayAmt: 0.4 + Math.random() * 0.8
});
}

// LAYER 2: Mid-height (behind building)
for (var i = 0; i < 15; i++) {
var mfMat = new THREE.SpriteMaterial({
map: thinFogTex, transparent: true, opacity: 0.06 + Math.random() * 0.06
});
var mf = new THREE.Sprite(mfMat);
mf.position.set(Math.random() * 30 - 10, 2 + Math.random() * 4, 3 + Math.random() * 20);
var ms = 5 + Math.random() * 12;
mf.scale.set(ms, ms * 0.3, 1);
scene.add(mf);
fogSprites.push({
sprite: mf, baseX: mf.position.x,
drift: 0.003 + Math.random() * 0.006,
sway: Math.random() * Math.PI * 2,
swaySpeed: 0.002 + Math.random() * 0.005,
swayAmt: 0.5 + Math.random() * 1.2
});
}

// LAYER 3a: Ginger-tinted near streetlamp (fewer than Lackland's)
for (var i = 0; i < 15; i++) {
var gfMat = new THREE.SpriteMaterial({
map: gingerFogTex, transparent: true, opacity: 0.15 + Math.random() * 0.15
});
var gf = new THREE.Sprite(gfMat);
gf.position.set(-3.0 + (Math.random() - 0.5) * 8, 0.3 + Math.random() * 5, 2.5 + (Math.random() - 0.5) * 8);
var gs = 2 + Math.random() * 5;
gf.scale.set(gs, gs * 0.45, 1);
scene.add(gf);
fogSprites.push({
sprite: gf, baseX: gf.position.x,
drift: 0.002 + Math.random() * 0.004,
sway: Math.random() * Math.PI * 2,
swaySpeed: 0.002 + Math.random() * 0.004,
swayAmt: 0.3 + Math.random() * 0.5
});
}

// LAYER 3b: Sickly yellow-green haze hugging the building facade
var greenFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
var grad = cx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
grad.addColorStop(0, 'rgba(120, 140, 45, 0.22)');
grad.addColorStop(0.3, 'rgba(90, 105, 30, 0.1)');

grad.addColorStop(1, 'rgba(40, 50, 10, 0)');
cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
});
for (var i = 0; i < 12; i++) {

});

// LAYER 4: High wisps (behind building)
for (var i = 0; i < 10; i++) {
var wMat = new THREE.SpriteMaterial({
map: thinFogTex, transparent: true, opacity: 0.04 + Math.random() * 0.05
});
var wisp = new THREE.Sprite(wMat);
wisp.position.set(Math.random() * 30 - 10, 8 + Math.random() * 7, 4 + Math.random() * 15);
wisp.scale.set(7 + Math.random() * 12, 2 + Math.random() * 3, 1);

fogSprites.push({
sprite: wisp, baseX: wisp.position.x,
drift: 0.004 + Math.random() * 0.008,
sway: Math.random() * Math.PI * 2,
swaySpeed: 0.003 + Math.random() * 0.006,
swayAmt: 0.6 + Math.random() * 1.5
});
}

// ============================================================
// ANIMATION
// ============================================================
var clock = new THREE.Clock();

function crAnimate() {
crAnimId = requestAnimationFrame(crAnimate);
var t = crStill ? 11 : clock.getElapsedTime();

// Streetlamp flicker (slow, gentle)
for (var i = 0; i < lampLights.length; i++) {
var baseInt = (i === 0) ? 1.2 : (i === 1) ? 0.5 : 0.3;
var flicker = 0.92 + Math.sin(t * (0.3 + i * 0.15)) * 0.04 + Math.sin(t * (0.7 + i * 0.2)) * 0.02;
lampLights[i].intensity = baseInt * flicker;
}

// Fanlight glow pulse
fanlightGlow.intensity = 0.12 + Math.sin(t * 0.15) * 0.02;
fanlightGlassL.emissiveIntensity = 0.12 + Math.sin(t * 0.12) * 0.03;

// Green Knight sign — slow swing in the night air
gawainSwing.rotation.z = Math.sin(t * 0.45) * 0.045 + Math.sin(t * 1.15) * 0.012;

// Door lighting (very slow breathing)
var doorBreath = 0.95 + Math.sin(t * 0.25) * 0.03;
doorSpot.intensity = 1.5 * doorBreath;
doorFill.intensity = 0.4 * doorBreath;
brassHighlight.intensity = 0.25 * doorBreath;

// Brass emissive
brassMat.emissive = brassMat.emissive || new THREE.Color(0x4a3008);
brassMat.emissiveIntensity = 0.05 * doorBreath;

// Colony Room window glow — gentle warm pulse
var colPulse = 0.95 + Math.sin(t * 0.18) * 0.04;
colGlowL.intensity = 0.2 * colPulse;
colGlowC.intensity = 0.25 * colPulse;
colGlowR.intensity = 0.1 * colPulse;
crSheen.material.opacity = 0.06 + (colPulse - 0.91) * 0.5 + Math.sin(t * 1.3) * 0.006;

// Fog drift
for (var i = 0; i < (crStill ? 0 : fogSprites.length); i++) {
var f = fogSprites[i];
f.sway += f.swaySpeed;
f.sprite.position.x = f.baseX + Math.sin(f.sway) * f.swayAmt;
f.baseX += f.drift;
if (f.baseX > 20) f.baseX = -15;
}

// Gawain's shop glow — diffuse warm pulse
var booksPulse = Math.sin(t * 0.12) * 0.3 + Math.sin(t * 0.4) * 0.15;
booksPulse = Math.max(0, booksPulse);
shopGawains.glassMat.emissiveIntensity = 0.12 + booksPulse * 0.1;
shopGawains.backGlow.opacity = 0.12 + booksPulse * 0.06;
for (var si = 0; si < shopGawains.lights.length; si++) {
shopGawains.lights[si].intensity = 0.42 + booksPulse * 0.12;
}

// The Minotaur — warmer, brighter diffuse flicker
var deliPulse = Math.sin(t * 0.18) * 0.35 + Math.sin(t * 0.55) * 0.2;
deliPulse = Math.max(0, deliPulse);
shopMinotaur.glassMat.emissiveIntensity = 0.12 + deliPulse * 0.12;
shopMinotaur.backGlow.opacity = 0.14 + deliPulse * 0.07;
for (var si = 0; si < shopMinotaur.lights.length; si++) {
shopMinotaur.lights[si].intensity = 0.48 + deliPulse * 0.14;
}

// MR PUNCH — diffuse yellowish flicker
var tobPulse = Math.sin(t * 0.25) * 0.3 + Math.sin(t * 0.7) * 0.18;
tobPulse = Math.max(0, tobPulse);
shopPunch.glassMat.emissiveIntensity = 0.1 + tobPulse * 0.08;
shopPunch.backGlow.opacity = 0.1 + tobPulse * 0.05;
for (var si = 0; si < shopPunch.lights.length; si++) {
shopPunch.lights[si].intensity = 0.38 + tobPulse * 0.1;
}

// (Silhouette animation removed)

// Puddle reflection
doorPuddleMat.emissiveIntensity = 0.04 + Math.sin(t * 1.7) * 0.02;

if (typeof dssComposerLocal !== 'undefined' && dssComposerLocal) { dssComposerLocal.render(); } else { renderer.render(scene, camera); }
}

crAnimate();

// ============================================================
// OVERLAY ELEMENTS
// ============================================================

// Vignette
crVig = document.createElement('div');
crVig.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9001;background:radial-gradient(ellipse at 45% 45%, transparent 30%, rgba(0,0,0,0.6) 100%);';
crWrap.appendChild(crVig);

// Film grain
crGrain = document.createElement('canvas');
crGrain.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9002;opacity:0.02;mix-blend-mode:overlay;';
crGrain.width = 256; crGrain.height = 256;
crWrap.appendChild(crGrain);
crGrainCtx = crGrain.getContext('2d');
crGrainFrame = 0;

// Colorwash
crWash = document.createElement('div');
crWash.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9002;background:linear-gradient(180deg, rgba(10,8,25,0.3) 0%, rgba(5,5,15,0.08) 30%, rgba(5,5,15,0.08) 60%, rgba(5,3,2,0.4) 100%);';
crWrap.appendChild(crWash);

// Datestamp

// Location
crLoc = document.createElement('div');
crLoc.textContent = 'DEAN STREET, SOHO';
crLoc.style.cssText = 'position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px "Courier New",monospace;color:rgba(200,180,140,0.25);letter-spacing:2px;pointer-events:none;z-index:9003;white-space:nowrap;';
crWrap.appendChild(crLoc);

// Button
crBtn = document.createElement('div');
crBtn.textContent = 'ENTER THE COLONY ROOM';
crBtn.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:14px min(36px, 8vw);white-space:nowrap;max-width:calc(100vw - 16px);box-sizing:border-box;font:16px "Courier New",monospace;color:rgba(200,170,100,0.85);border:1px solid rgba(200,170,100,0.3);letter-spacing:min(4px, 0.9vw);cursor:pointer;z-index:9004;background:transparent;opacity:0;transition:opacity 2s ease;';
setTimeout(function() { crBtn.style.opacity = '1'; }, 2500);
crBtn.addEventListener('mouseenter', function() {
crBtn.style.color = 'rgba(230,200,120,0.95)';
crBtn.style.borderColor = 'rgba(200,170,100,0.6)';
});
crBtn.addEventListener('mouseleave', function() {
crBtn.style.color = 'rgba(200,170,100,0.85)';
crBtn.style.borderColor = 'rgba(200,170,100,0.3)';
});
crBtn.addEventListener('click', function() {
crWrap.style.transition = 'opacity 1.5s ease';
crWrap.style.opacity = '0';
setTimeout(function() {
if (crAnimId) cancelAnimationFrame(crAnimId);
crAnimId = null;
if (crWrap.parentNode) crWrap.parentNode.removeChild(crWrap);
var TARGET = 'The Colony Room Door';
if (window.Engine && Engine.go) { Engine.go(TARGET); }
else {
var links = document.querySelectorAll('tw-link, .enchantment-link');
for (var i = 0; i < links.length; i++) {
if (links[i].textContent.trim() === '·') { links[i].click(); break; }
}
}
}, 1500);
});
crWrap.appendChild(crBtn);

document.body.appendChild(crWrap);
}

setInterval(function() {
var container = document.getElementById('cr-container');
if (container && !crActive) {
initColonyRoom();
} else if (!container) {
crActive = false;
if (crAnimId) { cancelAnimationFrame(crAnimId); crAnimId = null; }
window._dssDisposeWrap('cr-wrap');
}
}, 300);
})();</script>
