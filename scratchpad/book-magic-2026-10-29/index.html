<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INIS's magical books — preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d09;color:#e3d2ac;font:15px Georgia,serif}
header{height:76px;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid #59482e}
button{padding:10px 18px;background:#211c13;color:#e3d2ac;border:1px solid #695535;cursor:pointer;font:inherit}
button[aria-pressed=true]{background:#68522c;color:#fff0d0}p{margin:0;line-height:1.4}small{color:#b2a181}
iframe{display:block;border:0;width:100%;height:calc(100dvh - 76px)}
@media(max-width:650px){header{height:116px;flex-wrap:wrap;gap:8px;padding:10px}header p{width:100%;font-size:13px}iframe{height:calc(100dvh - 116px)}}
</style>
<header><button data-room="outside" aria-pressed="true">Outside</button><button data-room="inside" aria-pressed="false">Inside</button><p>Colours shift at different speeds; pairs also vanish and swap places.<br><small>Inside, choose “A window” or “Shelves” for a closer look.</small></p></header>
<iframe title="Outside INIS's shop" src="outside.html"></iframe>
<script>
const view=document.querySelector('iframe');
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{
 document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 view.title=(button.dataset.room==='inside'?'Inside':'Outside')+" INIS's shop";
 view.src=button.dataset.room+'.html';
});
</script></html>
