</script><script>// ====== dssScene — REUSABLE 3D ATMOSPHERE TOOLKIT ===========
// ============================================================
// Procedural materials and props extracted from the Chippy /
// Pillars / Lackland scenes so new 3D approach scenes can pull
// the same Soho-night look without re-deriving every texture.
//
// Usage (inside a scene IIFE, after THREE is loaded):
//   var brickMat = dssScene.makeGrimyBrick({ baseColor: 0x7a5a48 });
//   var roadMat  = dssScene.makeGrimyRoad();
//   var paveMat  = dssScene.makePavingSlabs();
//   var stucco   = dssScene.makeWeatheredStucco();
//   dssScene.createVictorianGasLamp(scene, -4, 3.5);
//   var btn = dssScene.createEnterButton('ENTER THE SOMEWHERE',
//     function() { /* nav handler */ });
//   wrap.appendChild(btn);
//
// All `make*` factories return a THREE.MeshStandardMaterial with
// `map`/`repeat` set, ready to apply to geometry. `create*`
// factories build a THREE.Group (or DOM element) and add it for
// you when given a parent.
// ------------------------------------------------------------
window.dssScene = (function() {

  // ---------- canvas texture helper ----------
  function makeCanvasTexture(w, h, drawFunc) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    drawFunc(cx, w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------- GRIMY BRICK ----------
  // Running-bond brickwork with mortar courses, soot streaks,
  // damp/lichen patches, paste-up ghost, top soot wash.
  // opts:
  //   baseColor:  fill rgb (default 0x6f4f3a)
  //   repeat:     [u, v] tiling (default [2, 4])
  //   sootStreaks: count (default 5)
  //   dampPatches: count (default 5)
  //   lichen:      count (default 12)
  //   highlightBricks: count of brighter-painted bricks (default 8)
  function makeGrimyBrick(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x6f4f3a).toString(16).padStart(6, '0');
    var streaks = opts.sootStreaks != null ? opts.sootStreaks : 5;
    var damp    = opts.dampPatches != null ? opts.dampPatches : 5;
    var lichen  = opts.lichen      != null ? opts.lichen      : 12;
    var highlights = opts.highlightBricks != null ? opts.highlightBricks : 8;
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var bH = 14, bW = 32;
      for (var by = 0; by < h; by += bH) {
        var rowOff = ((Math.floor(by / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var bx = -bW; bx < w + bW; bx += bW) {
          var px = bx + rowOff;
          var r = 95 + Math.floor(Math.random() * 50);
          var g = 60 + Math.floor(Math.random() * 35);
          var b = 45 + Math.floor(Math.random() * 30);
          if (Math.random() > 0.94) { r -= 40; g -= 32; b -= 22; }
          if (Math.random() > 0.96) { r += 30; g += 18; b += 10; }
          cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          cx.fillRect(px + 1, by + 1, bW - 2, bH - 2);
          cx.fillStyle = 'rgba(20,12,6,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
          cx.fillRect(px + 1, by + bH - 3, bW - 2, 2);
        }
      }
      cx.fillStyle = 'rgba(170, 145, 115, 0.32)';
      for (var hy = 0; hy < h; hy += bH) cx.fillRect(0, hy, w, 1);
      cx.fillStyle = 'rgba(160, 135, 105, 0.22)';
      for (var hyy = 0; hyy < h; hyy += bH) {
        var ro = ((Math.floor(hyy / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var hxx = ro; hxx < w; hxx += bW) cx.fillRect(hxx, hyy, 1.4, bH);
      }
      for (var ss = 0; ss < streaks; ss++) {
        var sx = Math.random() * w;
        var sxw = 12 + Math.random() * 30;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(8, 6, 4, 0.55)');
        sg.addColorStop(0.3, 'rgba(12, 10, 6, 0.32)');
        sg.addColorStop(0.7, 'rgba(18, 14, 9, 0.12)');
        sg.addColorStop(1, 'rgba(22, 18, 10, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < damp; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.45 + Math.random() * h * 0.55;
        var dr = 30 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(60, 75, 55, 0.32)');
        dg2.addColorStop(0.5, 'rgba(50, 60, 45, 0.16)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      for (var lp = 0; lp < lichen; lp++) {
        cx.fillStyle = 'rgba(95, 105, 60, ' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          5 + Math.random() * 12, 3 + Math.random() * 6.6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var topG = cx.createLinearGradient(0, 0, 0, h * 0.45);
      topG.addColorStop(0, 'rgba(18, 12, 8, 0.42)');
      topG.addColorStop(1, 'rgba(18, 12, 8, 0)');
      cx.fillStyle = topG; cx.fillRect(0, 0, w, h * 0.45);
      cx.fillStyle = 'rgba(220, 200, 160, 0.08)';
      cx.fillRect(w * 0.12, h * 0.42, w * 0.18, h * 0.13);
      for (var hl = 0; hl < highlights; hl++) {
        var hbx = Math.floor(Math.random() * (w / bW)) * bW;
        var hby = Math.floor(Math.random() * (h / bH)) * bH;
        cx.fillStyle = 'rgba(220, 195, 150, ' + (0.10 + Math.random() * 0.15).toFixed(3) + ')';
        cx.fillRect(hbx + 1, hby + 1, bW - 2, 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 });
  }

  // ---------- WEATHERED STUCCO ----------
  // Cream stucco with hairline cracks, nicotine wash pooling
  // lower, soot streaks from gutters, damp/green patches, paint-
  // patch repairs, paste-up ghost, bird splat.
  // opts:
  //   baseColor: default 0xc8b89a
  //   repeat:    default [2, 3]
  function makeWeatheredStucco(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0xc8b89a).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var pp = 0; pp < 350; pp++) {
        var b = 180 + Math.floor(Math.random() * 30);
        cx.fillStyle = 'rgba(' + b + ',' + (b - 18) + ',' + (b - 32) + ',0.12)';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          6 + Math.random() * 24, 4 + Math.random() * 14, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var nicoG = cx.createLinearGradient(0, h * 0.35, 0, h);
      nicoG.addColorStop(0, 'rgba(170, 145, 80, 0)');
      nicoG.addColorStop(0.6, 'rgba(170, 145, 80, 0.10)');
      nicoG.addColorStop(1, 'rgba(160, 130, 60, 0.18)');
      cx.fillStyle = nicoG; cx.fillRect(0, h * 0.35, w, h * 0.65);
      for (var ss = 0; ss < 6; ss++) {
        var sx = Math.random() * w;
        var sxw = 10 + Math.random() * 26;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(15, 12, 8, 0.50)');
        sg.addColorStop(0.4, 'rgba(20, 16, 10, 0.22)');
        sg.addColorStop(0.85, 'rgba(25, 20, 12, 0.08)');
        sg.addColorStop(1, 'rgba(25, 20, 12, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < 4; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.7 + Math.random() * h * 0.3;
        var dr = 32 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(70, 80, 55, 0.30)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      cx.strokeStyle = 'rgba(50, 38, 22, 0.45)'; cx.lineWidth = 0.7;
      for (var ch = 0; ch < 14; ch++) {
        cx.beginPath();
        var cxh = Math.random() * w, cyh = Math.random() * h;
        cx.moveTo(cxh, cyh);
        for (var sg2 = 0; sg2 < 5; sg2++) {
          cxh += (Math.random() - 0.5) * 28; cyh += 12 + Math.random() * 22;
          cx.lineTo(cxh, cyh);
        }
        cx.stroke();
      }
      for (var pr = 0; pr < 8; pr++) {
        var prx = Math.random() * w, pry = Math.random() * h;
        var prr = 12 + Math.random() * 22;
        var pg = cx.createRadialGradient(prx, pry, 0, prx, pry, prr);
        pg.addColorStop(0, 'rgba(225, 210, 180, 0.45)');
        pg.addColorStop(0.6, 'rgba(220, 200, 170, 0.14)');
        pg.addColorStop(1, 'rgba(220, 200, 170, 0)');
        cx.fillStyle = pg;
        cx.beginPath();
        cx.ellipse(prx, pry, prr, prr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(200, 170, 130, 0.10)';
      cx.fillRect(w * 0.18, h * 0.55, w * 0.12, h * 0.10);
      cx.fillStyle = 'rgba(245, 240, 215, 0.36)';
      cx.beginPath();
      cx.ellipse(w * 0.88, h * 0.08, 5, 2.5, 0.4, 0, Math.PI * 2);
      cx.fill();
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 3];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
  }

  // ---------- GRIMY ROAD ----------
  // Tarmac with aggregate speckle, lighter repair patches, jagged
  // cracks, wandering tar-seal sealant lines, oil blotches, faded
  // white centre line.
  function makeGrimyRoad(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x1c1c1c).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var p = 0; p < 4200; p++) {
        var pg = 25 + Math.floor(Math.random() * 70);
        cx.fillStyle = 'rgba(' + pg + ',' + pg + ',' + pg + ',0.42)';
        cx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }
      for (var rp = 0; rp < 6; rp++) {
        var rx = Math.random() * w, ry = Math.random() * h;
        var rwd = 50 + Math.random() * 100, rht = 35 + Math.random() * 70;
        cx.fillStyle = 'rgba(78, 78, 78, ' + (0.16 + Math.random() * 0.22).toFixed(3) + ')';
        cx.fillRect(rx, ry, rwd, rht);
        cx.strokeStyle = 'rgba(100, 100, 100, 0.18)'; cx.lineWidth = 0.6;
        cx.strokeRect(rx, ry, rwd, rht);
      }
      cx.strokeStyle = 'rgba(8, 8, 8, 0.8)'; cx.lineWidth = 1.2;
      for (var c = 0; c < 10; c++) {
        cx.beginPath();
        var cx0 = Math.random() * w, cy0 = Math.random() * h;
        cx.moveTo(cx0, cy0);
        var ang = Math.random() * Math.PI * 2, len = 30 + Math.random() * 80;
        cx.lineTo(cx0 + Math.cos(ang) * len, cy0 + Math.sin(ang) * len);
        cx.lineTo(cx0 + Math.cos(ang + 0.4) * len * 1.4, cy0 + Math.sin(ang + 0.4) * len * 1.4);
        cx.stroke();
      }
      cx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; cx.lineWidth = 2.6;
      for (var tm = 0; tm < 5; tm++) {
        cx.beginPath();
        var tx = Math.random() * w, ty = Math.random() * h;
        cx.moveTo(tx, ty);
        for (var ts = 0; ts < 5; ts++) {
          tx += (Math.random() - 0.5) * 30; ty += 8 + Math.random() * 16;
          cx.lineTo(tx, ty);
        }
        cx.stroke();
      }
      cx.fillStyle = 'rgba(220, 220, 200, 0.5)';
      cx.fillRect(w * 0.5 - 2, h * 0.3, 4, h * 0.4);
      cx.fillStyle = 'rgba(220, 220, 200, 0.18)';
      cx.fillRect(w * 0.5 - 2, h * 0.05, 4, h * 0.2);
      cx.fillRect(w * 0.5 - 2, h * 0.75, 4, h * 0.2);
      for (var os = 0; os < 4; os++) {
        var ox = Math.random() * w, oy = Math.random() * h;
        var orr = 8 + Math.random() * 18;
        var og = cx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        og.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
        og.addColorStop(0.7, 'rgba(15, 12, 5, 0.22)');
        og.addColorStop(1, 'rgba(15, 12, 5, 0)');
        cx.fillStyle = og; cx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [1, 8];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.18 });
  }

  // ---------- PAVING SLABS ----------
  // London paving slabs with grout, cracks, gum/fag-ends and
  // wet patches.
  function makePavingSlabs(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x3a3a36).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var sw = 128, sh = 96;
      cx.strokeStyle = 'rgba(18, 18, 16, 0.55)'; cx.lineWidth = 1.4;
      for (var sy = 0; sy < h; sy += sh) {
        var off = ((sy / sh) % 2 === 0) ? 0 : sw / 2;
        for (var sx = -sw; sx < w + sw; sx += sw) {
          var bxp = sx + off;
          var sg = 48 + Math.floor(Math.random() * 28);
          cx.fillStyle = 'rgba(' + sg + ',' + sg + ',' + (sg - 4) + ',' + (0.32 + Math.random() * 0.3).toFixed(3) + ')';
          cx.fillRect(bxp, sy, sw, sh);
          cx.strokeRect(bxp, sy, sw, sh);
        }
      }
      cx.strokeStyle = 'rgba(15, 15, 12, 0.55)'; cx.lineWidth = 0.9;
      for (var c2 = 0; c2 < 7; c2++) {
        cx.beginPath();
        cx.moveTo(Math.random() * w, Math.random() * h);
        cx.lineTo(Math.random() * w, Math.random() * h);
        cx.stroke();
      }
      for (var fe = 0; fe < 60; fe++) {
        cx.fillStyle = 'rgba(180, 175, 165, ' + (0.15 + Math.random() * 0.22).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(Math.random() * w, Math.random() * h, 1.0 + Math.random() * 1.6, 0, Math.PI * 2);
        cx.fill();
      }
      for (var wp = 0; wp < 5; wp++) {
        var wpx = Math.random() * w, wpy = Math.random() * h;
        var wpr = 35 + Math.random() * 60;
        var wpg = cx.createRadialGradient(wpx, wpy, 0, wpx, wpy, wpr);
        wpg.addColorStop(0, 'rgba(72, 78, 80, 0.35)');
        wpg.addColorStop(1, 'rgba(72, 78, 80, 0)');
        cx.fillStyle = wpg; cx.fillRect(wpx - wpr, wpy - wpr, wpr * 2, wpr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [4, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88 });
  }

  // ---------- VICTORIAN GAS LAMP ----------
  // Cast-iron stepped base, fluted shaft, mid-band, ladder rest,
  // capital, 4-sided emissive glass lantern, pyramidal cap,
  // crown finial, point light, halo + inner-core sprites.
  // Adds the lamp group to `parent` at (x, 0, z). Returns the
  // group (with `.userData.light` set to the PointLight).
  //
  // opts:
  //   intensity:   point-light intensity (default 0.5)
  //   distance:    point-light range (default 10)
  //   lampColor:   point-light + glow colour (default 0xffd6a0)
  //   haloScale:   outer halo sprite size (default 2.2)
  //   coreScale:   inner-core sprite size (default 0.9)
  //   paneColor:   solid emissive pane colour (default 0xfff0c8)
  function createVictorianGasLamp(parent, x, z, opts) {
    opts = opts || {};
    var lampColor = opts.lampColor || 0xffd6a0;
    var paneColor = opts.paneColor || 0xfff0c8;
    var g = new THREE.Group();
    var castIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.78, metalness: 0.22 });
    var darkIron = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.7, metalness: 0.3 });
    var brassish = new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.35 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m;
    }
    // Stepped base
    place(new THREE.CylinderGeometry(0.24, 0.28, 0.10, 16), castIron, 0, 0.05, 0);
    place(new THREE.CylinderGeometry(0.20, 0.24, 0.18, 16), castIron, 0, 0.19, 0);
    place(new THREE.CylinderGeometry(0.17, 0.20, 0.05, 16), darkIron, 0, 0.31, 0);
    place(new THREE.BoxGeometry(0.32, 0.32, 0.32), castIron, 0, 0.50, 0);
    place(new THREE.CylinderGeometry(0.11, 0.16, 0.06, 16), darkIron, 0, 0.69, 0);
    // Shaft
    place(new THREE.CylinderGeometry(0.058, 0.10, 3.9, 16), castIron, 0, 2.65, 0);
    // Mid-band
    place(new THREE.CylinderGeometry(0.082, 0.082, 0.06, 16), darkIron, 0, 1.55, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.58, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.52, 0);
    // Ladder rest
    place(new THREE.BoxGeometry(0.52, 0.018, 0.018), castIron, 0, 4.45, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.52), castIron, 0, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron,  0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, -0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45,  0.26);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45, -0.26);
    // Capital
    place(new THREE.CylinderGeometry(0.085, 0.062, 0.08, 16), castIron, 0, 4.66, 0);
    place(new THREE.CylinderGeometry(0.105, 0.085, 0.04, 16), darkIron, 0, 4.72, 0);
    place(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12), castIron, 0, 4.81, 0);
    // Lantern base + 4 emissive panes
    place(new THREE.BoxGeometry(0.34, 0.04, 0.34), darkIron, 0, 4.91, 0);
    var paneMat = new THREE.MeshBasicMaterial({ color: paneColor });
    var paneF = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneF.position.set(0, 5.16, 0.134); g.add(paneF);
    var paneB = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneB.position.set(0, 5.16, -0.134); paneB.rotation.y = Math.PI; g.add(paneB);
    var paneL = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneL.position.set(-0.134, 5.16, 0); paneL.rotation.y = Math.PI / 2; g.add(paneL);
    var paneR = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneR.position.set(0.134, 5.16, 0); paneR.rotation.y = -Math.PI / 2; g.add(paneR);
    // Corner posts + cross-bars
    var corners = [[0.135, 0.135], [-0.135, 0.135], [0.135, -0.135], [-0.135, -0.135]];
    for (var cp = 0; cp < 4; cp++) {
      place(new THREE.BoxGeometry(0.028, 0.44, 0.028), darkIron, corners[cp][0], 5.16, corners[cp][1]);
    }
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16,  0.135);
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16, -0.135);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.28), darkIron,  0.135, 5.16, 0);

    placeMesh(g, new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16,  0.135);
    placeMesh(g, new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16, -0.135);
    placeMesh(g, new THREE.BoxGeometry(0.018, 0.018, 0.28), darkIron,  0.135, 5.16, 0);
    placeMesh(g, new THREE.BoxGeometry(0.018, 0.018, 0.28), darkIron, -0.135, 5.16, 0);

    // ---- Top plate ----
    placeMesh(g, new THREE.BoxGeometry(0.36, 0.045, 0.36), darkIron, 0, 5.40, 0);

    // ---- Pyramidal cap ----
    var capMesh = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.20, 4), castIron);
    capMesh.position.set(0, 5.52, 0);
    capMesh.rotation.y = Math.PI / 4;
    g.add(capMesh);

    // ---- Crown finial: ball + spike + small ball ----
    placeMesh(g, new THREE.SphereGeometry(0.034, 8, 6), darkIron, 0, 5.66, 0);
    placeMesh(g, new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8), darkIron, 0, 5.74, 0);
    placeMesh(g, new THREE.SphereGeometry(0.018, 6, 4), brassish,  0, 5.82, 0);

    // ---- Faint point light: just enough to feel real, doesn't
    //      flood the scene. The lantern panes carry the visible glow.
    var light = new THREE.PointLight(0xffd6a0, 0.75, 11);
    light.position.set(0, 5.16, 0);
    light.castShadow = false; // 2026-10-14 (speed): no mesh here takes its shadow
    g.add(light);
    streetLampLights.push(light);

    // ---- Tight halo sprite around the lantern itself ----
    var glowTex = makeCanvasTexture(128, 128, function(cx, w, h) {
      var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      grad.addColorStop(0, 'rgba(255, 220, 150, 0.85)');
      grad.addColorStop(0.25, 'rgba(255, 200, 110, 0.40)');
      grad.addColorStop(0.6, 'rgba(220, 160, 70, 0.08)');
      grad.addColorStop(1, 'rgba(180, 120, 50, 0)');
      cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    });
    var glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0.7 }));
    glowSprite.position.set(0, 5.16, 0);
    glowSprite.scale.set(2.2, 2.2, 1);
    g.add(glowSprite);

    // ---- Bright inner-core sprite (small, hot centre) ----
    var innerGlowTex = makeCanvasTexture(64, 64, function(cx, w, h) {
      var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      grad.addColorStop(0, 'rgba(255, 245, 200, 1)');
      grad.addColorStop(0.3, 'rgba(255, 220, 140, 0.55)');
      grad.addColorStop(1, 'rgba(255, 200, 110, 0)');
      cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    });
    var innerGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: innerGlowTex, transparent: true, opacity: 0.9 }));
    innerGlow.position.set(0, 5.16, 0);
    innerGlow.scale.set(0.9, 0.9, 1);
    g.add(innerGlow);

    g.position.set(x, 0, z);
    scene.add(g);
  }

  createLamp(-4, 3.5);
  createLamp(5, 3.5);
  createLamp(1, 10);
  createLamp(-4.6, 6.5); // was (-5,10) — sat on the camera axis, a giant dark post square across the shopfront

  // ============================================================
  // SILHOUETTES IN CHIPPY WINDOWS (people at counter)
  // ============================================================
  var silhouettes = [];

  function makeChippySilhouette(seed) {
    return makeCanvasTexture(256, 256, function(cx, w, h) {
      // Bright warm interior background
      var bg = cx.createRadialGradient(w / 2, h * 0.4, 10, w / 2, h * 0.5, w);
      bg.addColorStop(0, 'rgba(255, 220, 140, 0.5)');
      bg.addColorStop(0.4, 'rgba(240, 190, 100, 0.35)');
      bg.addColorStop(0.8, 'rgba(200, 150, 70, 0.15)');
      bg.addColorStop(1, 'rgba(150, 100, 40, 0.05)');
      cx.fillStyle = bg;
      cx.fillRect(0, 0, w, h);

      var figureCount = 1 + Math.floor(seed * 2);
      for (var f = 0; f < figureCount; f++) {
        var fx = (w / (figureCount + 1)) * (f + 1);
        var baseY = h * 0.98;
        var headR = 12 + seed * 5;
        var shoulderW = 30 + seed * 12;

        cx.fillStyle = 'rgba(10, 5, 0, 0.8)';
        // Body
        cx.beginPath();
        cx.moveTo(fx - shoulderW / 2, baseY - h * 0.3);
        cx.lineTo(fx + shoulderW / 2, baseY - h * 0.3);
        cx.lineTo(fx + shoulderW / 2 + 5, baseY);
        cx.lineTo(fx - shoulderW / 2 - 5, baseY);
        cx.closePath(); cx.fill();
        // Shoulders
        cx.beginPath();
        cx.ellipse(fx, baseY - h * 0.33, shoulderW / 2 + 3, 12, 0, 0, Math.PI, true);
        cx.fill();
        // Neck
        cx.fillRect(fx - 5, baseY - h * 0.42, 10, h * 0.09);
        // Head
        cx.beginPath();
        cx.arc(fx + (f - 1) * 3, baseY - h * 0.47, headR, 0, Math.PI * 2);
        cx.fill();

        // Person leaning on counter / eating
        if (f === 0 && seed > 0.3) {
          // Arm reaching forward (to counter)
          cx.fillStyle = 'rgba(10, 5, 0, 0.75)';
          cx.beginPath();
          cx.moveTo(fx - shoulderW / 2, baseY - h * 0.32);
          cx.lineTo(fx - shoulderW / 2 - 15, baseY - h * 0.2);
          cx.lineTo(fx - shoulderW / 2 - 10, baseY - h * 0.18);
          cx.lineTo(fx - shoulderW / 2 + 5, baseY - h * 0.3);
          cx.closePath(); cx.fill();
        }
      }

      // Counter silhouette at bottom (the serving counter seen through glass)
      cx.fillStyle = 'rgba(60, 40, 20, 0.4)';
      cx.fillRect(0, h * 0.75, w, h * 0.25);
    });
  }

  // Silhouettes in both large windows
  var chipWinXs = [-0.7, 1.7];
  var chipSeeds = [0.7, 0.5];
  for (var i = 0; i < chipWinXs.length; i++) {
    var sTex = makeChippySilhouette(chipSeeds[i]);
    var sMat = new THREE.MeshBasicMaterial({
      map: sTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
    });
    var sPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.3), sMat);
    sPlane.position.set(chipWinXs[i], 1.9, 0.32);
    shop.add(sPlane);
    silhouettes.push({
      mesh: sPlane, baseX: chipWinXs[i],
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.25 + Math.random() * 0.3,
      swayAmt: 0.01 + Math.random() * 0.015
    });
  }

  // ============================================================
  // STEAM SPRITES (from extractor vent — chippy steam!)
  // ============================================================
  var steamSprites = [];
  var steamTex = makeCanvasTexture(64, 64, function(cx, w, h) {
    var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, 'rgba(220, 210, 190, 0.25)');
    grad.addColorStop(0.4, 'rgba(200, 190, 170, 0.1)');
    grad.addColorStop(1, 'rgba(180, 170, 150, 0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
  });
  for (var si = 0; si < 8; si++) {
    var steamMat = new THREE.SpriteMaterial({ map: steamTex, transparent: true, opacity: 0.15 + Math.random() * 0.1 });
    var steam = new THREE.Sprite(steamMat);
    steam.position.set(2.8 + (Math.random() - 0.5) * 0.5, 5.5 + Math.random() * 2, 0.5 + Math.random() * 0.5);
    var ss = 1.0 + Math.random() * 1.5;
    steam.scale.set(ss, ss * 1.2, 1);
    shop.add(steam);
    steamSprites.push({
      sprite: steam,
      baseY: steam.position.y,
      baseX: steam.position.x,
      rise: 0.003 + Math.random() * 0.005,
      drift: (Math.random() - 0.5) * 0.002,
      sway: Math.random() * Math.PI * 2,
      resetY: 5.0
    });
  }

  // ============================================================
  // LIGHTING
  // ============================================================
  scene.add(new THREE.AmbientLight(0x121218, 0.25));
  var moonLight = new THREE.DirectionalLight(0x4455aa, 0.08);
  moonLight.position.set(5, 20, 10);
  moonLight.castShadow = true;
  scene.add(moonLight);
  // Blue fill
  var fillLight = new THREE.DirectionalLight(0x2233aa, 0.04);
  fillLight.position.set(-5, 10, -5);
  scene.add(fillLight);

  // ============================================================
  // FOG VOLUMES (4 layers — the chippy glow cuts through the fog)
  // ============================================================
  var thickFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
    var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, 'rgba(180, 170, 155, 0.22)');
    grad.addColorStop(0.4, 'rgba(150, 140, 130, 0.1)');
    grad.addColorStop(1, 'rgba(120, 110, 100, 0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
  });
  var thinFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
    var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, 'rgba(140, 135, 125, 0.15)');
    grad.addColorStop(0.6, 'rgba(120, 115, 105, 0.06)');
    grad.addColorStop(1, 'rgba(100, 95, 85, 0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
  });
  var warmFogTex = makeCanvasTexture(128, 128, function(cx, w, h) {
    var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, 'rgba(255, 220, 140, 0.1)');
    grad.addColorStop(0.5, 'rgba(240, 190, 100, 0.04)');
    grad.addColorStop(1, 'rgba(200, 150, 60, 0)');
    cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
  });

  var fogSprites = [];

  // Layer 1: Ground-hugging
  for (var i = 0; i < 50; i++) {
    var fogMat = new THREE.SpriteMaterial({ map: thickFogTex, transparent: true, opacity: 0.16 + Math.random() * 0.16 });
    var fogSprite = new THREE.Sprite(fogMat);
    fogSprite.position.set(Math.random() * 40 - 15, 0.3 + Math.random() * 2, Math.random() * 30 - 5);
    var s = 5 + Math.random() * 12;
    fogSprite.scale.set(s, s * 0.35, 1);
    scene.add(fogSprite);
    fogSprites.push({ sprite: fogSprite, baseX: fogSprite.position.x, drift: 0.002 + Math.random() * 0.006, sway: Math.random() * Math.PI * 2, swaySpeed: 0.001 + Math.random() * 0.004, swayAmt: 0.4 + Math.random() * 1.0 });
  }

  // Layer 2: Mid-height
  for (var i = 0; i < 28; i++) {
    var midFogMat = new THREE.SpriteMaterial({ map: thinFogTex, transparent: true, opacity: 0.1 + Math.random() * 0.1 });
    var midFog = new THREE.Sprite(midFogMat);
    midFog.position.set(Math.random() * 35 - 12, 2 + Math.random() * 6, Math.random() * 30 - 5);
    var ms = 6 + Math.random() * 14;
    midFog.scale.set(ms, ms * 0.3, 1);
    scene.add(midFog);
    fogSprites.push({ sprite: midFog, baseX: midFog.position.x, drift: 0.001 + Math.random() * 0.004, sway: Math.random() * Math.PI * 2, swaySpeed: 0.0008 + Math.random() * 0.003, swayAmt: 0.5 + Math.random() * 1.5 });
  }

  // Layer 3: Warm fog near chippy (picks up the bright glow)
  for (var i = 0; i < 18; i++) {
    var warmFogMat = new THREE.SpriteMaterial({ map: warmFogTex, transparent: true, opacity: 0.1 + Math.random() * 0.12 });
    var warmFog = new THREE.Sprite(warmFogMat);
    warmFog.position.set(Math.random() * 10 - 3, 0.5 + Math.random() * 3, 1 + Math.random() * 6);
    var ws = 4 + Math.random() * 8;
    warmFog.scale.set(ws, ws * 0.3, 1);
    scene.add(warmFog);
    fogSprites.push({ sprite: warmFog, baseX: warmFog.position.x, drift: 0.001 + Math.random() * 0.003, sway: Math.random() * Math.PI * 2, swaySpeed: 0.001 + Math.random() * 0.003, swayAmt: 0.3 + Math.random() * 0.8 });
  }

  // Layer 4: High wisps
  for (var i = 0; i < 12; i++) {
    var highFogMat = new THREE.SpriteMaterial({ map: thinFogTex, transparent: true, opacity: 0.06 + Math.random() * 0.07 });
    var highFog = new THREE.Sprite(highFogMat);
    highFog.position.set(Math.random() * 30 - 10, 8 + Math.random() * 8, Math.random() * 20 - 5);
    var hs = 10 + Math.random() * 15;
    highFog.scale.set(hs, hs * 0.2, 1);
    scene.add(highFog);
    fogSprites.push({ sprite: highFog, baseX: highFog.position.x, drift: 0.003 + Math.random() * 0.005, sway: Math.random() * Math.PI * 2, swaySpeed: 0.0005 + Math.random() * 0.002, swayAmt: 1.0 + Math.random() * 2.0 });
  }

  // ============================================================
  // ANIMATION LOOP
  // ============================================================
  var clock = new THREE.Clock();
  var neonFlickerPhase = 0;

  function fcAnimate() {
    fcAnimId = requestAnimationFrame(fcAnimate);
    var t = fcStill ? 5 : clock.getElapsedTime();

    // Fog drift
    for (var i = 0; i < (fcStill ? 0 : fogSprites.length); i++) {
      var f = fogSprites[i];
      f.sway += f.swaySpeed;
      f.sprite.position.x = f.baseX + Math.sin(f.sway) * f.swayAmt;
      f.baseX += f.drift;
      if (f.baseX > 25) f.baseX = -25;
    }

    // Fascia spotlight flicker (slight)
    for (var i = 0; i < fasciaLamps.length; i++) {
      var fl = fasciaLamps[i];
      fl.intensity = fl.userData.baseIntensity + Math.sin(t * 4 + i * 1.5) * 0.06;
    }

    // Street lamp flicker
    for (var i = 0; i < streetLampLights.length; i++) {
      streetLampLights[i].intensity = 0.5 + Math.sin(t * 2 + i * 1.5) * 0.05;
    }

    // Interior glow pulse (subtle — bright and steady, comforting)
    interiorLight1.intensity = 1.5 + Math.sin(t * 1.2) * 0.12;
    interiorLight2.intensity = 1.0 + Math.sin(t * 1.5 + 0.5) * 0.08;
    interiorLight3.intensity = 1.0 + Math.sin(t * 1.8 + 1.0) * 0.08;
    doorSpill.intensity = 0.8 + Math.sin(t * 1.3) * 0.1;
    pavementSpill.intensity = 0.6 + Math.sin(t * 1.0) * 0.08;
    fcSheen.material.opacity = 0.075 + (pavementSpill.intensity - 0.6) * 0.3 + (doorSpill.intensity - 0.8) * 0.12;

    // Neon flicker (the "FISH & CHIPS" neon and fish shapes)
    neonFlickerPhase += 0.05;
    var neonPulse = 0.85 + Math.sin(t * 6) * 0.1 + Math.sin(t * 13) * 0.05;
    // Occasional random flicker
    if (!fcStill && Math.random() > 0.995) neonPulse *= 0.4;
    neonFish.material.opacity = neonPulse;
    neonBlueLight.intensity = 0.3 * neonPulse;
    neonFishL.material.opacity = neonPulse * 0.9;
    neonFishR.material.opacity = neonPulse * 0.9;
    neonRedL.intensity = 0.15 * neonPulse;
    neonRedR.intensity = 0.15 * neonPulse;

    // OPEN sign pulse
    openSign.material.opacity = 0.8 + Math.sin(t * 4) * 0.15;

    // Silhouette sway
    for (var i = 0; i < silhouettes.length; i++) {
      var s = silhouettes[i];
      s.mesh.position.x = s.baseX + Math.sin(t * s.swaySpeed + s.swayPhase) * s.swayAmt;
    }

    // Steam rise and drift
    for (var i = 0; i < (fcStill ? 0 : steamSprites.length); i++) {
      var st = steamSprites[i];
      st.sprite.position.y += st.rise;
      st.sprite.position.x += st.drift + Math.sin(t * 0.5 + i) * 0.001;
      st.sprite.material.opacity *= 0.9995;
      // Reset when too high or faded
      if (st.sprite.position.y > st.resetY + 4 || st.sprite.material.opacity < 0.02) {
        st.sprite.position.y = st.resetY;
        st.sprite.position.x = st.baseX + (Math.random() - 0.5) * 0.3;
        st.sprite.material.opacity = 0.12 + Math.random() * 0.1;
      }
    }

    // Hanging sign sway
    hangSign.rotation.z = Math.sin(t * 0.9) * 0.04;

    // Fluorescent light very subtle flicker
    if (!fcStill) fluoro.material.color.setHex(Math.random() > 0.998 ? 0xe0e0d0 : 0xf0f0e8);

    // The fly-killer crackle: a flash (sometimes a double-crack) on a
    // random cycle
    var zapBoost = 0;
    if (t > zapState.next) {
      zapState.start = t;
      zapState.dbl = Math.random() < 0.4;
      zapState.next = t + 8 + Math.random()*14;
    }
    var zapAge = t - zapState.start;
    if (zapAge < 0.28) zapBoost = Math.sin(zapAge/0.28*Math.PI);
    else if (zapState.dbl && zapAge > 0.42 && zapAge < 0.62) zapBoost = Math.sin((zapAge - 0.42)/0.2*Math.PI)*0.8;
    fkHalo.material.opacity = 0.85 + zapBoost*0.15;
    fkHalo.scale.set(1.3 + zapBoost*2.9, 0.5 + zapBoost*1.2, 1);
    fkCore.scale.set(1 + zapBoost*0.8, 1 + zapBoost*4.2, 1);
    flyKillerGlow.intensity = 0.55 + zapBoost*4.5;

    // The woman at the red window: fade in, watch, one lean, withdraw
    if (t > rwState.until) {
      if (rwState.mode === 'away') { rwState.mode = 'in'; rwState.until = t + 0.85; }
      else if (rwState.mode === 'in') {
        rwState.mode = 'present';
        var rwDur = 12 + Math.random()*9;
        rwState.until = t + rwDur;
        rwState.leanAt = t + 3 + Math.random()*(rwDur - 7);
      }
      else if (rwState.mode === 'present') { rwState.mode = 'out'; rwState.until = t + 0.7; }
      else { rwState.mode = 'away'; rwState.until = t + 8 + Math.random()*10; }
      rwState.start = t;
    }
    var rwP = Math.min((t - rwState.start) / (rwState.mode === 'in' ? 0.85 : 0.7), 1);
    var rwQ = rwP*rwP*(3 - 2*rwP);
    rwMat.opacity = rwState.mode === 'present' ? 0.94 : rwState.mode === 'in' ? rwQ*0.94 : rwState.mode === 'out' ? (1 - rwQ)*0.94 : 0;
    // She steps up to the glass rather than materialising: a quick rise
    // paired with the short fade
    rwWoman.position.y = 9.5 - 0.12*(rwState.mode === 'in' ? (1 - rwQ) : rwState.mode === 'out' ? rwQ : rwState.mode === 'away' ? 1 : 0);
    var rwLean = 0;
    if (rwState.mode === 'present') {
      var rwDl = (t - rwState.leanAt)/4;
      if (rwDl > 0 && rwDl < 1) rwLean = Math.sin(rwDl*Math.PI);
    }
    rwWoman.position.x = 2.33 + Math.sin(t*0.35)*0.01;
    rwWoman.scale.set(1 + rwLean*0.05, 1 + rwLean*0.03, 1);
    rwHead.rotation.z = Math.sin(t*0.15)*0.06;
    rwHandMat.opacity = rwLean*0.9*rwMat.opacity;
    redBrothelLight.intensity = 0.7 - rwMat.opacity*0.18;

    if (typeof dssComposerLocal !== 'undefined' && dssComposerLocal) { dssComposerLocal.render(); } else { renderer.render(scene, camera); }
  }


  // ── ENTER BUTTON ──
  var fcBtn = document.createElement('div');
  fcBtn.textContent = 'ENTER THE CHIPPY';
  // Ginger-Light style: transparent dark background, coloured text +
  // border, no infill. Hover just brightens the border/text.
  fcBtn.style.cssText = [
    'position:fixed', 'bottom:60px', 'left:50%', 'transform:translateX(-50%)',
    'font:13px "Courier New",monospace',
    'color:rgba(232,180,80,0.85)',
    'letter-spacing:4px', 'cursor:pointer', 'padding:12px 28px',
    'border:1px solid rgba(232,180,80,0.3)',
    'background:rgba(0,0,0,0.4)',
    'z-index:9004', 'white-space:nowrap',
    'opacity:0', 'transition:opacity 1.5s ease, color 0.3s ease, border-color 0.3s ease'
  ].join(';');
  setTimeout(function() { fcBtn.style.opacity = '1'; }, 1800);
  fcBtn.addEventListener('mouseenter', function() {
    this.style.color = 'rgba(255,210,120,0.95)';
    this.style.borderColor = 'rgba(232,180,80,0.6)';
  });
  fcBtn.addEventListener('mouseleave', function() {
    this.style.color = 'rgba(232,180,80,0.85)';
    this.style.borderColor = 'rgba(232,180,80,0.3)';
  });
  fcBtn.addEventListener('click', function() {
    fcWrap.style.transition = 'opacity 1.5s ease';
    fcWrap.style.opacity = '0';
    setTimeout(function() {
      if (fcWrap && fcWrap.parentNode) fcWrap.parentNode.removeChild(fcWrap);
      var TARGET = 'Chinese Fish and Chips';
      if (window.Engine && Engine.go) { Engine.go(TARGET); }
      else {
        var links = document.querySelectorAll('tw-link, .enchantment-link');
        for (var i = 0; i < links.length; i++) {
          if (links[i].textContent.trim() === '\u00b7') { links[i].click(); break; }
        }
      }
    }, 1500);
  });
  fcWrap.appendChild(fcBtn);
  document.body.appendChild(fcWrap);
  fcAnimate();
}

setInterval(function() {
  var container = document.getElementById('fc-container');
  if (container && !fcActive) { initFc(); }
  else if (!container) {
    fcActive = false;
    if (fcAnimId) { cancelAnimationFrame(fcAnimId); fcAnimId = null; }
    window._dssDisposeWrap('fc-wrap');
  }
}, 300);
})();</script>
