    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#44414b"/><stop offset=".5" stop-color="#34333d"/><stop offset="1" stop-color="#161d25"/></linearGradient>
    <linearGradient id="runner" x2="1" y2="0"><stop stop-color="#441c29"/><stop offset=".18" stop-color="#6c293b"/><stop offset=".5" stop-color="#7e3445"/><stop offset=".82" stop-color="#542031"/><stop offset="1" stop-color="#361a27"/></linearGradient>
    <linearGradient id="brass" x2="0" y2="1"><stop stop-color="#f1d3a0"/><stop offset=".28" stop-color="#8e7249"/><stop offset=".7" stop-color="#b59664"/><stop offset="1" stop-color="#3e382f"/></linearGradient>
    <radialGradient id="shade"><stop offset=".5" stop-color="#080c13" stop-opacity="0"/><stop offset="1" stop-color="#080c13" stop-opacity=".87"/></radialGradient>
